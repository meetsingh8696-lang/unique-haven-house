function resetPrivPw(w){var np=prompt('New private password for '+w);if(np){localStorage.setItem('uh_chatPw_'+w.toLowerCase(),np);renderPrivatePwList();showToast('Password Reset');}}
function changeMyPrivPw(){var cur=localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'';var np=document.getElementById('myPrivPw').value.trim();if(!np){alert('Enter new password');return;}localStorage.setItem('uh_chatPw_'+cur.toLowerCase(),np);showToast('Your Private Password Changed');document.getElementById('myPrivPw').value='';}
function savePw(){var a=document.getElementById('setAdmin').value;var w=document.getElementById('setWorker').value;var t=document.getElementById('setTrans').value;var inv=document.getElementById('setInvoice').value;pw.admin=a;pw.worker=w;pw.transport=t;pw.invoice=inv;localStorage.setItem('uh_pw',JSON.stringify(pw));showToast('Passwords Saved');}function renderMy(){var list=document.getElementById('myList');if(!list)return;var curW=(localStorage.getItem('uh_curW')||'').toLowerCase();var html='';for(var i=0;i<complaints.length;i++){var c=complaints[i];var a=(c.assignedTo||'').toLowerCase();if(!a.includes(curW)&&!curW.includes(a))continue;var m='';if(c.photos){for(var p=0;p<c.photos.length;p++)m+='<img src="'+c.photos[p]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card"><b>CHASSIS: '+c.chassis+'</b><br><b>Full Name:</b> '+(c.name||'')+'<br><b>Plot:</b> '+(c.plot||'')+'<br><b>Location:</b> '+(c.location||'')+'<br><b>Full Address:</b> '+(c.address||c.addr||'')+'<br><b>Phone:</b> '+(c.phone||'')+'<br><b>Issue:</b> '+c.issue+'<br><b>Date:</b> '+(c.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+m+'</div><br><button class="btn-green" onclick="workerCompDone('+i+')">Done</button></div>';}list.innerHTML=html||'<div class="card">No jobs</div>';}
function renderMyReports(){var curW=localStorage.getItem('uh_curW')||'';var list=document.getElementById('myReportsList');if(!list)return;var html='<h4>My Reports - Total Days: '+getWorkerDayCount(curW)+' (auto unique dates)</h4>';for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===curW.toLowerCase())html+='<div class="card"><b>'+reports[i].chassis+'</b> '+(reports[i].location||'')+'<br>Address:'+(reports[i].addr||'')+'<br>'+reports[i].work+'<br>Date:'+reports[i].date+'</div>';}list.innerHTML=html;}
function renderMyDays(){var curW=localStorage.getItem('uh_curW')||'';var list=document.getElementById('myDaysList');if(!list)return;var days=getWorkerDaysList(curW);var html='<div class="totalBox">Total Working Days: '+days.length+' (1 per unique date)</div>';if(days.length===0)html+='<div class="card">No days yet - submit daily report with date</div>';else{for(var i=0;i<days.length;i++){html+='<div class="card">📅 Day '+(i+1)+': '+days[i]+'</div>';}}list.innerHTML=html;}
function submitReport(){var curW=localStorage.getItem('uh_curW')||'';var obj={name:curW,chassis:document.getElementById('rChassis').value,type:document.getElementById('rType').value,location:document.getElementById('rLocation').value,addr:document.getElementById('jobAddr').value,hours:document.getElementById('hours').value,work:document.getElementById('workDone').value,date:document.getElementById('rDate').value||new Date().toISOString().split('T')[0]};if(!obj.chassis){alert('Chassis needed');return;}reports.unshift(obj);localStorage.setItem('uh_reports',JSON.stringify(reports));cloudAdd('reports',obj);showToast('Report Submitted - Day Auto Counted');renderMyReports();renderMyDays();}
function getWorkerOpts(){var o='';for(var i=0;i<workersList.length;i++){o+='<option value="'+workersList[i]+'">'+workersList[i]+'</option>';}return o;}
function renderT(){var list=document.getElementById('tjList');if(!list)return;var html='';var hasPending=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(j.done)continue;hasPending=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border:2px solid #ff9800"><b>🚚 CHASSIS: '+j.chassis+'</b><br><b>Full Name:</b> '+(j.name||'')+'<br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver:</b> '+(j.assignedTo||j.driver||'')+'<br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="markDone('+i+')">✅ Done</button> <button class="btn2" onclick="editTrans('+i+')">Edit</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasPending)html='<div class="card">No pending transport jobs</div>';list.innerHTML=html;}
function renderTDone(){var list=document.getElementById('tjDone');if(!list)return;var html='';var hasDone=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(!j.done)continue;hasDone=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border-left:5px solid #00c853"><b>✅ DONE CHASSIS: '+j.chassis+'</b><br><b>Full Name:</b> '+(j.name||'')+'<br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver:</b> '+(j.assignedTo||j.driver||'')+'<br><b>Completed:</b> '+(j.completedDate||'')+'<br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn2" onclick="markDone('+i+')">↩️ Reopen</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasDone)html='<div class="card">No done transport jobs yet - done jobs will show here</div>';list.innerHTML=html;}
function editReport(i){var r=reports[i];var nw=prompt('Edit Work:',r.work);if(nw===null)return;r.work=nw;var nd=prompt('Edit Date (YYYY-MM-DD):',r.date);if(nd!==null)r.date=nd;localStorage.setItem('uh_reports',JSON.stringify(reports));renderContent();}
function delReport(i){if(confirm('Delete report?')){reports.splice(i,1);localStorage.setItem('uh_reports',JSON.stringify(reports));renderContent();}}
function startCall(type,toName){if(!toName||toName.toLowerCase()==='all'){alert('Select specific person for call');return;}var fromName=localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin';document.getElementById('callModal').style.display='flex';document.getElementById('callStatus').innerText='Calling '+toName+'... '+type;if(db){try{db.collection('calls').add({from:fromName,to:toName,type:type,status:'calling',timestamp:Date.now()});}catch(e){}}navigator.mediaDevices.getUserMedia({video:type==='video',audio:true}).then(function(stream){localStream=stream;var lv=document.getElementById('localVideo');lv.srcObject=stream;lv.style.display=type==='video'?'block':'none';document.getElementById('callStatus').innerText='Call connected to '+toName+' (Real WebRTC - '+type+') - Talk now';}).catch(function(err){document.getElementById('callStatus').innerText='Mic/Camera permission needed: '+err.message;});}
function answerCall(id,data){document.getElementById('callModal').style.display='flex';document.getElementById('callStatus').innerText='Answering '+data.type+' call from '+data.from;var type=data.type;navigator.mediaDevices.getUserMedia({video:type==='video',audio:true}).then(function(stream){localStream=stream;document.getElementById('localVideo').srcObject=stream;document.getElementById('callStatus').innerText='Call with '+data.from+' connected (Real '+type+')';if(db)db.collection('calls').doc(id).update({status:'connected'});}).catch(function(err){document.getElementById('callStatus').innerText='Permission error: '+err.message;});}
function endCall(){var modal=document.getElementById('callModal');modal.style.display='none';if(localStream){localStream.getTracks().forEach(function(t){t.stop();});localStream=null;}document.getElementById('localVideo').srcObject=null;document.getElementById('remoteVideo').srcObject=null;showToast('Call Ended');}
window.addEventListener('load',function(){setTimeout(function(){initPubInvUpload();startLiveSync();},800);});
</script></body></html>
