function extractSmartTotal(t){if(!t)return 0;var m=t.match(/£?\s*(\d{1,4}\.\d{2})/g);if(!m)return 0;var last=m[m.length-1];var v=parseFloat(last.replace('£',''));return isNaN(v)?0:v;}

function initPublicInvoiceUpload(){function handle(files){for(var f=0;f<files.length;f++){(function(file,idx){var r=new FileReader();r.onload=function(ev){pubInvPhotos.push(ev.target.result);var img=document.createElement('img');img.src=ev.target.result;img.style.width='60px';img.style.height='60px';img.style.margin='2px';document.getElementById('pubInvPrevBox').appendChild(img);try{Tesseract.recognize(ev.target.result,'eng').then(function(o){var v=extractSmartTotal(o.data.text);ocrAmounts[idx]=v;var sum=0;for(var j=0;j<ocrAmounts.length;j++)sum+=ocrAmounts[j]||0;document.getElementById('pubInvAmt').value=sum.toFixed(2);});}catch(e){}};r.readAsDataURL(file);})(files[f],f);}}var cam=document.getElementById('pubInvCam');var lib=document.getElementById('pubInvLib');if(cam)cam.onchange=function(e){document.getElementById('pubInvPrevBox').innerHTML='';pubInvPhotos=[];ocrAmounts=[];handle(e.target.files);};if(lib)lib.onchange=function(e){document.getElementById('pubInvPrevBox').innerHTML='';pubInvPhotos=[];ocrAmounts=[];handle(e.target.files);};var sel=document.getElementById('pubInvFolderSelect');if(sel)sel.onchange=function(){if(this.value)document.getElementById('pubInvChassis').value=this.value;};}

function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase();var area=document.getElementById('publicViewArea');if(!q){area.innerHTML='Type chassis';return;}var html='';for(var i=0;i<complaints.length;i++)if((complaints[i].chassis||'').toLowerCase().includes(q))html+='<div class=card>📢 '+complaints[i].chassis+' '+(complaints[i].completed?'✅ DONE':'⏳')+'</div>';for(var i=0;i<transJobs.length;i++)if((transJobs[i].chassis||'').toLowerCase().includes(q))html+='<div class=card>🚚 '+transJobs[i].chassis+' '+(transJobs[i].done?'✅':'⏳')+'</div>';area.innerHTML=html||'No jobs';}
function checkFlashes(){var alertBox=document.getElementById('globalAlert');var cpAlert=document.getElementById('cp12Alert');var msgs=[];var emerg=complaints.filter(function(c){return c.emergency&&!c.completed;}).length;if(emerg>0)msgs.push('🚨 '+emerg+' EMERGENCY');var now=new Date();now.setHours(0,0,0,0);var exp=[];for(var i=0;i<cp12List.length;i++){try{var d=new Date(cp12List[i].cpDate);d.setHours(0,0,0,0);var diff=Math.ceil((d-now)/86400000);if(diff>=0&&diff<=30)exp.push(cp12List[i].chassis+' ('+diff+'d)');if(diff<0)exp.push(cp12List[i].chassis+' EXPIRED');}catch(e){}}if(exp.length>0){msgs.push('⚠️ CP12: '+exp.join(', '));if(cpAlert){cpAlert.style.display='block';cpAlert.innerHTML='⚠️ CP12 EXPIRY: '+exp.join(', ')+' <button onclick="this.parentElement.style.display=\'none\'" style=margin-left:8px>X</button>';}}else if(cpAlert)cpAlert.style.display='none';if(msgs.length>0){alertBox.style.display='block';alertBox.innerHTML=msgs.join('<br>')+' <button onclick="this.parentElement.style.display=\'none\'" style=float:right>X</button>';}else alertBox.style.display='none';}
function showTabs(){var list=[];if(role==='admin')list=['dash','reports','activeJobs','completeJobs','refurb','cp12','invoices','transportJobs','transportDone','transportForm','complaints','publicChatAdmin','workers','companyHomes','settings','aboutEdit'];else if(role==='worker')list=['myJobs','addReport','myDays','publicChatAdmin'];else list=['transportJobs','transportDone','publicChatAdmin'];var h='';for(var i=0;i<list.length;i++){var lbl=list[i].toUpperCase().replace('COMPANYHOMES','HOMES DB').replace('PUBLICCHATADMIN','CHAT').replace('TRANSPORTDONE','T DONE').replace('MYJOBS','MY JOBS');h+='<button class="btn2" onclick="openTab(\''+list[i]+'\')">'+lbl+'</button>';}document.getElementById('tabs').innerHTML=h;openTab(list[0]);}
var curTab='';function openTab(t){curTab=t;renderContent();}
function renderContent(){var f=document.getElementById('content');var html='';if(curTab==='dash'){var c=countInvoicesPhotos();html='<div class=card><h3 style=color:#000>Dashboard CLOUD ON ✅ Fixed SYNC</h3>Reports:'+reports.length+'<br>Transport:'+transJobs.length+'<br>Complaints:'+complaints.length+'<br>CP12:'+cp12List.length+'<br>Unpaid £'+c.unpaid.toFixed(2)+' Total £'+c.total.toFixed(2)+'</div>';}if(curTab==='reports'){html='<div class=card><h3>Reports CLOUD SYNC</h3></div>';for(var i=0;i<reports.length;i++)html+='<div class=card>👷 '+reports[i].name+' | '+reports[i].chassis+'<br>'+reports[i].date+'<br>'+reports[i].work+'</div>';}if(curTab==='activeJobs'){html='<div class=card><h3>ACTIVE JOBS CLOUD<div id=activeList></div></div>';}if(curTab==='completeJobs'){html='<div class=card><h3>COMPLETE JOBS</h3></div>';for(var i=0;i<completeJobs.length;i++)html+='<div class=card>✅ '+completeJobs[i].chassis+'<br>'+completeJobs[i].completedDate+'</div>';}if(curTab==='refurb'){html='<div class=card><h3>Refurb</h3><input id=rfChassis placeholder=Chassis><button class=btn onclick=addRefurb()>CREATE</button></div>';for(var i=0;i<refurbs.length;i++)html+='<div class=card>'+refurbs[i].chassis+' <button class=btn2 onclick=delRefurb('+i+')>Delete</button> <button class=btn2 onclick=completeRefurb('+i+')>Complete</button></div>';}if(curTab==='cp12'){html='<div class=card><h3>CP12 - Flash 30 days before</h3><input id=cpChassis placeholder=Chassis><input id=cpDate type=date><button class=btn onclick=addCp()>ADD CLOUD SYNC</button></div>';for(var i=0;i<cp12List.length;i++)html+='<div class=card>'+cp12List[i].chassis+' '+cp12List[i].cpDate+' <button class=btn2 onclick=delCp('+i+')>Delete CLOUD</button></div>';}if(curTab==='invoices'){html='<div class=card><h3>Invoices CLOUD SYNC</h3></div>';for(var ch in invoices)for(var j=0;j<invoices[ch].length;j++)html+='<div class=card>'+ch+' £'+invoices[ch][j].amt+' <button class=btn2 onclick=delInv(\''+ch+'\','+j+')>Delete CLOUD</button></div>';}if(curTab==='transportJobs'){html='<div class=card><h3>Transport PENDING CLOUD<div id=tjList></div></div>';}if(curTab==='transportDone'){html='<div class=card><h3>Transport DONE<div id=tjDone></div></div>';}if(curTab==='transportForm'){html='<div class=card><h3>Transport Form</h3><input id=atChassis placeholder=Chassis><input id=atAssign placeholder=Driver><button class=btn onclick=submitAdminT()>SUBMIT CLOUD</button></div>';}if(curTab==='complaints'){html='<div class=card><h3>Complaint - Declan Test FIXED</h3><input id=acChassis placeholder=Chassis><input id=acAssign placeholder=Worker like Declan><button class=btn onclick=adminCreateComplaint()>CREATE CLOUD SYNC ALL</button></div>';for(var i=0;i<complaints.length;i++)html+='<div class=card>'+(complaints[i].completed?'✅':'⏳')+' '+complaints[i].chassis+' → '+complaints[i].assignedTo+'<br>'+(role==='admin'?'<button class=btn2 onclick=compDone('+i+')>Complete CLOUD ALL</button> <button class=btn2 onclick=delComp('+i+')>Delete CLOUD ALL</button>':'')+'</div>';}if(curTab==='publicChatAdmin'){html='<div class=card><h3>CHAT CLOUD LIVE ✅ SYNC ALL</h3><input id=chatName placeholder=Name value='+(role==='admin'?'Admin':localStorage.getItem('uh_curW')||'Guest')+'><textarea id=chatMsg></textarea><button class=btn onclick=sendChat()>Send CLOUD ALL</button> <button class=btn2 onclick=clearChat()>Clear All CLOUD</button><div id=adminChatList></div></div>';}if(curTab==='workers'){html='<div class=card><h3>Workers Payroll SYNC</h3></div>';for(var k in workers){var w=workers[k];var days=w.days?w.days.length:0;html+='<div class=card>👷 '+k+' - Days: '+days+'<br>'+(w.days?w.days.join(', '):'')+'</div>';}}if(curTab==='companyHomes'){html='<div class=card><h3>Homes DB</h3><input id=newCompanyTab placeholder=Company><button class=btn onclick=createTab()>Create Tab</button></div><div class=card><input id=homeSearch placeholder=Search oninput=renderHomes()><div id=homesList></div></div>';}if(curTab==='settings'){html='<div class=card><h3>Settings</h3>Admin:<input id=setAdmin value='+pw.admin+'><button class=btn onclick=savePw()>Save</button></div>';}if(curTab==='aboutEdit'){html='<div class=card><h3>About Edit</h3><textarea id=aboutText>'+aboutData.text+'</textarea><button class=btn onclick=saveAbout()>Save</button></div>';}if(curTab==='myJobs'){html='<div class=card><h3>My Jobs - Declan etc CLOUD<div id=myList></div></div>';}if(curTab==='addReport'){html='<div class=card><h3>Add Report - Wall etc SYNC MY DAYS</h3><input id=rChassis placeholder=Chassis><textarea id=workDone placeholder=Wall, work etc></textarea><button class=btn onclick=submitReport()>Submit CLOUD SYNC DAYS</button></div>';}if(curTab==='myDays'){var curW=(localStorage.getItem('uh_curW')||'').trim();var wObj=workers[curW]||workers[Object.keys(workers).find(function(k){return k.toLowerCase().trim()===curW.toLowerCase().trim();})];var dCount=0,dList='';if(wObj&&wObj.days){dCount=wObj.days.length;dList=wObj.days.join(', ');}html='<div class=card>👷 Worker: '+curW+'<br>Total Days: '+dCount+'<br>'+dList+'</div>';}
f.innerHTML=html;
if(curTab==='activeJobs'){var list=document.getElementById('activeList');if(list){var h='';for(var i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class=card>'+complaints[i].chassis+' → '+complaints[i].assignedTo+'</div>';list.innerHTML=h||'No active';}}
if(curTab==='transportJobs'){var list=document.getElementById('tjList');if(list){var h='';for(var i=0;i<transJobs.length;i++)if(!transJobs[i].done)h+='<div class=card>'+transJobs[i].chassis+' → '+transJobs[i].assignedTo+' <button class=btn onclick=markDone('+i+')>Done CLOUD</button></div>';list.innerHTML=h||'No pending';}}
if(curTab==='transportDone'){var list=document.getElementById('tjDone');if(list){var h='';for(var i=0;i<transJobs.length;i++)if(transJobs[i].done)h+='<div class=card>'+transJobs[i].chassis+' <button class=btn2 onclick=markDone('+i+')>Undo</button></div>';list.innerHTML=h||'No done';}}
if(curTab==='myJobs'){var list=document.getElementById('myList');if(list){var curW=(localStorage.getItem('uh_curW')||'').toLowerCase();var h='';for(var i=0;i<complaints.length;i++)if(!complaints[i].completed&&(complaints[i].assignedTo||'').toLowerCase()===curW)h+='<div class=card>MY JOB '+complaints[i].chassis+'<br><button class=btn onclick=workerCompDone('+i+')>DONE CLEAR ALL APPS CLOUD</button></div>';list.innerHTML=h||'No jobs for '+localStorage.getItem('uh_curW');}}
if(curTab==='publicChatAdmin')renderChatList();
if(curTab==='companyHomes')renderHomes();
}
function addInv(){var ch=document.getElementById('invChassis').value.trim();var amt=document.getElementById('invAmt').value.trim();if(!ch||!amt)return;if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt});renderContent();}
function delInv(ch,i){var inv=invoices[ch][i];if(inv._fid)cloudDel('invoices_cloud',inv._fid);invoices[ch].splice(i,1);if(!invoices[ch].length)delete invoices[ch];localStorage.setItem('uh_inv',JSON.stringify(invoices));renderContent();}
function adminCreateComplaint(){var o={chassis:document.getElementById('acChassis').value.trim(),assignedTo:document.getElementById('acAssign').value.trim(),completed:false,name:'Tenant',location:'',issue:''};if(!o.chassis||!o.assignedTo)return alert('Need chassis+worker');complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudAdd('complaints',o);sendNotifyFixed('🔧 New Complaint for '+o.assignedTo,o.chassis+' SYNC ALL');alert('Created for '+o.assignedTo+' SYNC ALL ✅');renderContent();}
function delComp(i){var c=complaints[i];if(c._fid)cloudDel('complaints',c._fid);complaints.splice(i,1);localStorage.setItem('uh_comp',JSON.stringify(complaints));renderContent();sendNotifyFixed('🗑️ Deleted',c.chassis+' deleted from ALL');}
function compDone(i){var c=complaints[i];c.completed=true;if(c._fid)cloudUpd('complaints',c._fid,{completed:true});completeJobs.unshift({chassis:c.chassis,completedDate:new Date().toLocaleDateString()});localStorage.setItem('uh_comp',JSON.stringify(complaints));localStorage.setItem('uh_complete',JSON.stringify(completeJobs));cloudAdd('completeJobs',{chassis:c.chassis,completedDate:new Date().toLocaleDateString()});renderContent();sendNotifyFixed('✅ Completed ALL SYNC',c.chassis+' done - cleared from ALL');}
function workerCompDone(idx){var c=complaints[idx];if(!confirm('Mark DONE? Clear from ALL apps?'))return;c.completed=true;if(c._fid)cloudUpd('complaints',c._fid,{completed:true});completeJobs.unshift({chassis:c.chassis,completedDate:new Date().toLocaleDateString()});localStorage.setItem('uh_comp',JSON.stringify(complaints));localStorage.setItem('uh_complete',JSON.stringify(completeJobs));cloudAdd('completeJobs',{chassis:c.chassis,completedDate:new Date().toLocaleDateString()});sendNotifyFixed('✅ Declan Done ALL',c.chassis+' cleared from ALL apps');alert('✅ Done - cleared from ALL apps CLOUD');renderContent();}
function submitAdminT(){var j={chassis:document.getElementById('atChassis').value,assignedTo:document.getElementById('atAssign').value.trim(),done:false};if(!j.chassis||!j.assignedTo)return alert('Need');transJobs.unshift(j);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudAdd('transJobs',j);renderContent();}
function markDone(i){var j=transJobs[i];j.done=!j.done;if(j._fid)cloudUpd('transJobs',j._fid,{done:j.done});localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));renderContent();checkFlashes();}
function savePw(){pw.admin=document.getElementById('setAdmin').value;localStorage.setItem('uh_pw',JSON.stringify(pw));alert('Saved');}
function submitReport(){var name=localStorage.getItem('uh_curW')||'Worker';var ch=document.getElementById('rChassis').value.trim();var work=document.getElementById('workDone').value.trim();if(!ch)return alert('Chassis');var dateStr=new Date().toLocaleDateString();var rep={name:name,chassis:ch,work:work,date:dateStr};reports.unshift(rep);localStorage.setItem('uh_reports',JSON.stringify(reports));cloudAdd('reports_cloud',rep);if(!workers[name])workers[name]={name:name,days:[]};if(!workers[name].days)workers[name].days=[];if(workers[name].days.indexOf(dateStr)===-1)workers[name].days.push(dateStr);localStorage.setItem('uh_workers',JSON.stringify(workers));cloudAdd('workers_cloud',{name:name,days:workers[name].days});sendNotifyFixed('📋 Report SYNC',name+' '+ch+' - My Days updated ALL');alert('Report Submitted - My Days SYNC ALL ✅');renderContent();}
function addRefurb(){var ch=document.getElementById('rfChassis').value;if(!ch)return;var o={chassis:ch};refurbs.unshift(o);localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));cloudAdd('refurbs_cloud',o);renderContent();}
function delRefurb(i){var r=refurbs[i];if(r._fid)cloudDel('refurbs_cloud',r._fid);refurbs.splice(i,1);localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));renderContent();}
function completeRefurb(i){var r=refurbs[i];r.completed=true;if(r._fid)cloudUpd('refurbs_cloud',r._fid,{completed:true});completeJobs.unshift({chassis:r.chassis,completedDate:new Date().toLocaleDateString()});localStorage.setItem('uh_complete',JSON.stringify(completeJobs));cloudAdd('completeJobs',{chassis:r.chassis,completedDate:new Date().toLocaleDateString()});renderContent();}
function addCp(){var o={chassis:document.getElementById('cpChassis').value,cpDate:document.getElementById('cpDate').value};if(!o.chassis||!o.cpDate)return alert('Need');cp12List.unshift(o);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));cloudAdd('cp12List',o);sendNotifyFixed('📅 CP12 SYNC ALL',o.chassis+' '+o.cpDate);renderContent();checkFlashes();}
function delCp(i){var c=cp12List[i];if(c._fid)cloudDel('cp12List',c._fid);cp12List.splice(i,1);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));renderContent();checkFlashes();sendNotifyFixed('🗑️ CP12 Deleted ALL SYNC',c.chassis+' deleted - flashing stops ALL');}
function createTab(){var n=document.getElementById('newCompanyTab').value.trim();if(!n)return;if(!customCompanyTabs.includes(n)){customCompanyTabs.push(n);companyHomes[n]=[];localStorage.setItem('uh_customTabs',JSON.stringify(customCompanyTabs));renderContent();}}
function getCompOpts(){var o='';for(var i=0;i<customCompanyTabs.length;i++)o+='<option value="'+customCompanyTabs[i]+'">'+customCompanyTabs[i]+'</option>';if(!o)o='<option value="General">General</option>';return o;}
function addHome(){var comp=document.getElementById('selCompany').value||'General';var obj={chassis:document.getElementById('hChassis').value.trim()};if(!obj.chassis)return;if(!companyHomes[comp])companyHomes[comp]=[];companyHomes[comp].unshift(obj);localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));renderHomes();}
function renderHomes(){var list=document.getElementById('homesList');if(!list)return;var h='';for(var c in companyHomes)for(var i=0;i<companyHomes[c].length;i++)h+='<div class=card>'+companyHomes[c][i].chassis+' <button class=btn2 onclick=delHome(\''+c+'\','+i+')>Delete</button></div>';list.innerHTML=h||'No homes';}
function delHome(c,i){companyHomes[c].splice(i,1);localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));renderHomes();}
function saveAbout(){localStorage.setItem('uh_about',JSON.stringify({text:document.getElementById('aboutText').value}));alert('Saved');}
function sendChat(){var name=document.getElementById('chatName').value.trim()||'Guest';var msg=document.getElementById('chatMsg').value.trim();if(!msg)return;var obj={name:name,msg:msg,time:new Date().toLocaleString()};chatMsgs.unshift(obj);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudAdd('chatMsgs',{name:name,msg:msg,time:new Date().toLocaleString()});document.getElementById('chatMsg').value='';renderChatList();sendNotifyFixed('💬 Chat SYNC ALL',name+': '+msg);}
function renderChatList(){var list=document.getElementById('chatList')||document.getElementById('adminChatList');if(!list)return;var h='';for(var i=0;i<chatMsgs.length;i++)h+='<div class=card><b>'+chatMsgs[i].name+'</b> '+chatMsgs[i].msg+' '+(role==='admin'?'<button class=btn2 onclick=delChat('+i+')>Delete CLOUD ALL</button>':'')+'</div>';list.innerHTML=h||'No messages';}
function delChat(i){var c=chatMsgs[i];if(c._fid)cloudDel('chatMsgs',c._fid);chatMsgs.splice(i,1);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();sendNotifyFixed('🗑️ Chat Deleted ALL','Message deleted from ALL apps');}
function clearChat(){if(!confirm('Clear ALL chat from ALL apps?'))return;for(var i=0;i<chatMsgs.length;i++)if(chatMsgs[i]._fid)cloudDel('chatMsgs',chatMsgs[i]._fid);chatMsgs=[];localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();sendNotifyFixed('🗑️ Chat Cleared ALL','All chat cleared from ALL');}
function renderPublicActive(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class=card><h3>ACTIVE JOBS CLOUD</h3><div id=pubActive></div></div>';var list=document.getElementById('pubActive');var h='';for(var i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class=card>'+complaints[i].chassis+' → '+complaints[i].assignedTo+'</div>';list.innerHTML=h||'No jobs';}
function renderPublicTransport(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class=card><h3>TRANSPORT CLOUD</h3></div>';}
function renderPublicRefurb(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class=card><h3>REFURB CLOUD</h3></div>';}
function renderPublicChat(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class=card><h3>CHAT CLOUD</h3><input id=chatName placeholder=Name><textarea id=chatMsg></textarea><button class=btn onclick=sendChat()>Send CLOUD ALL</button><div id=chatList></div></div>';renderChatList();}
checkFlashes();setInterval(checkFlashes,10000);
</script></body></html>
