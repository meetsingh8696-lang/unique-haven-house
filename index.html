function extractSmartTotal(text){if(!text)return 0;var lower=text.toLowerCase();var regex=/£?\s*(\d{1,4}\.\d{2})/g;var matches=[];var m;while((m=regex.exec(text))!==null){var v=parseFloat(m[1]);if(isNaN(v))continue;if(v<0.5||v>2000)continue;matches.push({v:v,idx:m.index});}if(matches.length===0){var regex2=/(\d+\.\d{2})/g;while((m=regex2.exec(text))!==null){var v=parseFloat(m[1]);if(v>=0.5&&v<=2000)matches.push({v:v,idx:m.index});}}if(matches.length===0)return 0;var totalIdx=lower.lastIndexOf('total');if(totalIdx===-1)totalIdx=lower.lastIndexOf('amount');if(totalIdx===-1)totalIdx=lower.lastIndexOf('balance');if(totalIdx!==-1){var best=null;var bestDist=99999;for(var i=0;i<matches.length;i++){if(matches[i].idx>=totalIdx){var dist=matches[i].idx-totalIdx;if(dist<bestDist){bestDist=dist;best=matches[i];}}}if(best)return best.v;}return matches[matches.length-1].v;}

function initHomeUpload(){function handle(files,isVideo){for(var f=0;f<files.length;f++){(function(file){var r=new FileReader();r.onload=function(ev){if(isVideo){homeVideos.push(ev.target.result);}else{homePhotos.push(ev.target.result);}var box=document.getElementById('homePrevBox');if(!box)return;if(isVideo){var v=document.createElement('video');v.src=ev.target.result;v.controls=true;v.style.width='120px';v.style.height='80px';v.style.margin='2px';box.appendChild(v);}else{var img=document.createElement('img');img.src=ev.target.result;img.style.width='70px';img.style.height='70px';img.style.objectFit='cover';img.style.borderRadius='6px';img.style.margin='2px';box.appendChild(img);}};r.readAsDataURL(file);})(files[f]);}}var cam=document.getElementById('homeCam');var lib=document.getElementById('homeLib');var vid=document.getElementById('homeVid');if(cam)cam.addEventListener('change',function(e){handle(e.target.files,false);});if(lib)lib.addEventListener('change',function(e){handle(e.target.files,false);});if(vid)vid.addEventListener('change',function(e){handle(e.target.files,true);});}

function renderHomes(){var list=document.getElementById('homesList');if(!list)return;var q=(document.getElementById('homeSearch')?.value||'').toLowerCase();var h='';for(var c in companyHomes){var filtered=companyHomes[c].filter(hm=> (hm.chassis+hm.tenant+hm.location+hm.addr).toLowerCase().includes(q));if(q && filtered.length==0)continue;h+='<div style="color:#8b5a2b;font-weight:bold;margin-top:10px">📁 '+c+' ('+filtered.length+'/'+companyHomes[c].length+') <button class="btn2" onclick="delCompany(\''+c+'\')" style="pointer-events:auto!important">Delete Company</button></div>';for(var i=0;i<filtered.length;i++){var hm=filtered[i];var idx=companyHomes[c].indexOf(filtered[i]);var mediaHtml='';if(hm.photos){for(var pp=0;pp<hm.photos.length;pp++){mediaHtml+='<img src="'+hm.photos[pp]+'" style="width:70px;height:70px;border-radius:8px;margin:2px;border:2px solid #d4a94b">';}}if(hm.videos){for(var vv=0;vv<hm.videos.length;vv++){mediaHtml+='<video src="'+hm.videos[vv]+'" controls style="width:120px;height:80px;border-radius:8px;margin:2px;border:2px solid #d4a94b"></video>';}}h+='<div class="card">🏠 <b>Chassis:'+hm.chassis+'</b> - Tenant:'+hm.tenant+'<br>📍 Loc:'+hm.location+' Post:'+hm.postcode+'<br>Addr:'+hm.addr+' Company:'+hm.company+'<br><div class="homeMedia">'+mediaHtml+'</div><br><button class="btn2" onclick="editHome(\''+c+'\','+idx+')" style="pointer-events:auto!important">Edit</button> <button class="btn2" onclick="delHome(\''+c+'\','+idx+')" style="pointer-events:auto!important">Delete</button></div>';}}list.innerHTML=h||'No homes';var sel=document.getElementById('selCompany');if(sel)sel.innerHTML=getCompOpts();}
function delCompany(c){if(confirm('Delete company '+c+'?')){delete companyHomes[c];customCompanyTabs=customCompanyTabs.filter(x=>x!==c);localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));localStorage.setItem('uh_customTabs',JSON.stringify(customCompanyTabs));renderHomes();}}
function delHome(c,i){if(confirm('Delete this home?')){companyHomes[c].splice(i,1);localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));renderHomes();}}
function editHome(c,i){var hm=companyHomes[c][i];var newCh=prompt('Chassis:',hm.chassis);if(newCh===null)return;var newLoc=prompt('Location:',hm.location);var newAddr=prompt('Address:',hm.addr);var newTenant=prompt('Tenant:',hm.tenant);var newPost=prompt('Postcode:',hm.postcode);hm.chassis=newCh||hm.chassis;hm.location=newLoc||hm.location;hm.addr=newAddr||hm.addr;hm.tenant=newTenant||hm.tenant;hm.postcode=newPost||hm.postcode;localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));renderHomes();}
function renderMy(){var curW=(localStorage.getItem('uh_curW')||'').trim();var curWLow=curW.toLowerCase();var list=document.getElementById('myList');if(!list)return;var h='';for(var i=0;i<complaints.length;i++){var c=complaints[i];var asg=(c.assignedTo||'').trim().toLowerCase();if(!c.completed && asg && asg===curWLow){var media='';if(c.photos){for(var pp=0;pp<c.photos.length;pp++)media+='<img src="'+c.photos[pp]+'" style="width:70px;height:70px;border-radius:8px;margin:2px;border:2px solid #d4a94b">';}h+='<div class="card '+(c.emergency?'emergency flashRed':'')+'"><b>📢 MY JOB</b><br>Chassis:<b>'+c.chassis+'</b> Tenant:'+c.name+'<br>Location:'+c.location+'<br>Issue:'+c.issue+'<br>Addr:'+c.addr+'<br>Phone:'+(c.phone||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="workerCompDone('+i+')" style="pointer-events:auto!important">✅ Mark Done</button></div>';}}if(!h){h='<div class="card">No jobs for <b>'+curW+'</b></div>';}list.innerHTML=h;}

function renderChatList(){var list=document.getElementById('adminChatList');if(!list)return;renderChatListPublic(true);}
function renderChatListPublic(isAdmin){
var box=document.getElementById('chatBoxPublic')||document.getElementById('adminChatList');
if(!box)return;
var html='';if(chatMsgs.length===0)html='<div style="text-align:center;color:#888;padding:20px">No messages yet - Start chatting!<br>Messages sync to Cloud LIVE ✅ FIXED</div>';
else{for(var i=0;i<chatMsgs.length;i++){var m=chatMsgs[i];html+='<div style="background:#fff;padding:8px;margin:6px 0;border-radius:8px;border:1px solid #d7ccc8;word-break:break-word"><b style="color:#8b5a2b">'+(m.name||'Guest')+':</b> '+(m.msg||m.text||'')+'<br><small style="color:#888">'+(m.time||m.date||'')+'</small> '+(role==='admin'?'<button class="btn2" onclick="delChat('+i+')" style="pointer-events:auto!important">Delete</button>':'')+'</div>';}}
box.innerHTML=html;box.scrollTop=box.scrollHeight;
}
function sendChat(){sendPublicChat();}
function sendPublicChat(){
var nameEl=document.getElementById('pubChatName')||document.getElementById('chatName');
var msgEl=document.getElementById('pubChatMsg')||document.getElementById('chatMsg');
var name=(nameEl?.value||'Guest').trim()||'Guest';var msg=(msgEl?.value||'').trim();
if(!msg){alert('Type message!');return;}
if(name)localStorage.setItem('uh_lastChatName',name);
var obj={name:name,msg:msg,text:msg,time:new Date().toLocaleString(),date:new Date().toLocaleString()};
chatMsgs.push(obj);if(chatMsgs.length>100)chatMsgs.shift();
localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));
cloudAdd('chatMsgs',{name:name,msg:msg,time:new Date().toLocaleString(),date:new Date().toLocaleString()});
if(msgEl)msgEl.value='';renderChatListPublic();
if('Notification' in window && Notification.permission==='granted'){try{new Notification('💬 '+name,{body:msg});}catch(e){}}
}
function delChat(i){if(role!=='admin')return;var ch=chatMsgs[i];var msg=ch.msg;chatMsgs.splice(i,1);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudDelete('chatMsgs','msg',msg);renderChatListPublic();}
function clearChat(){if(confirm('Clear all chat?')){chatMsgs=[];localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudDeleteAll('chatMsgs');renderChatListPublic();}}
function renderAbout(){var el=document.getElementById('aboutView');if(el)el.innerHTML='<div style="white-space:pre-wrap">'+aboutData.text+'</div>'+(aboutData.photo?'<br><img src="'+aboutData.photo+'" style="width:100%;border-radius:10px">':'');}
function initAboutUpload(){function h(f){if(!f)return;var r=new FileReader();r.onload=function(ev){aboutTmp=ev.target.result;var pr=document.getElementById('aboutPrev');if(pr){pr.src=ev.target.result;pr.style.display='block';}};r.readAsDataURL(f);}var a=document.getElementById('aboutCam');var b=document.getElementById('aboutLib');if(a)a.addEventListener('change',e=>h(e.target.files[0]));if(b)b.addEventListener('change',e=>h(e.target.files[0]));}
function saveAbout(){var txt=document.getElementById('aboutText').value;aboutData.text=txt.replace(/\n/g,'<br>');if(aboutTmp)aboutData.photo=aboutTmp;localStorage.setItem('uh_about',JSON.stringify(aboutData));alert('About Us Saved - Company name editable');renderContent();}
