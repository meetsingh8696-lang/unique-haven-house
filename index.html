ass="btn" onclick="checkPublicInvoicePw()">Unlock</button></div><div id="pagePublicInvoiceContent" style="display:none"><h3>📄 PUBLIC INVOICE</h3><select id="pubInvFolderSelect"></select><input id="pubInvChassis" placeholder="Chassis Folder Name *"><input id="pubInvCompany" placeholder="Company Name *"><input id="pubInvPerson" placeholder="Your Name *"><input id="pubInvAmt" type="number" step="0.01" placeholder="Total £ *"><input id="pubInvDesc" placeholder="Invoice Title *"><div style="display:flex;gap:6px"><div style="flex:1"><label>📷 Camera</label><input type="file" id="pubInvCam" accept="image/*" capture="environment" multiple></div><div style="flex:1"><label>🖼️ Library</label><input type="file" id="pubInvLib" accept="image/*" multiple></div></div><div id="pubInvPrevBox" style="display:flex;flex-wrap:wrap"></div><button class="btn" onclick="submitPublicInvoice()">+ SUBMIT</button><hr><div class="card" style="border:2px solid #00c851;background:#e8f5e9"><h3>👁️ MY INVOICES</h3><input id="myInvNameSearch" placeholder="Enter Your Name"><button class="btn-green" onclick="showMyPublicInvoices()">Show My Invoices</button><div id="myInvListArea"></div></div><button class="btn2" onclick="backHome()">Back</button></div></div>

function loadInvoicesSafe(){try{var d=JSON.parse(localStorage.getItem('uh_invoices')||'{}');if(Array.isArray(d)){var nd={};for(var i=0;i<d.length;i++){var c=d[i].chassis||'General';if(!nd[c])nd[c]=[];nd[c].push(d[i]);}return nd;}return d;}catch(e){return {};}}

function showNotif(title,body){var en=localStorage.getItem('uh_notif')||'off';if(en!=='on')return;showNotifToast(title+': '+body);if('Notification' in window&&Notification.permission==='granted'){try{var n=new Notification(title,{body:body,icon:'./icon-192.png'});n.onclick=function(){window.focus();};}catch(e){}if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'./icon-192.png',vibrate:[200,100,200]});});}}}
function getWorkerDayCount(name){if(!name)return 0;var nl=name.toLowerCase().trim();var now=new Date();var curM=now.getMonth();var curY=now.getFullYear();var days={};for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var dStr=(reports[i].date||'').trim();if(!dStr)continue;var dObj=new Date(dStr);if(isNaN(dObj))continue;if(dObj.getMonth()===curM&&dObj.getFullYear()===curY){days[dStr]=true;}}}return Object.keys(days).length;}
function getWorkerDaysList(name){if(!name)return [];var nl=name.toLowerCase().trim();var now=new Date();var curM=now.getMonth();var curY=now.getFullYear();var days={};for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var dStr=(reports[i].date||'').trim();if(!dStr)continue;var dObj=new Date(dStr);if(isNaN(dObj))continue;if(dObj.getMonth()===curM&&dObj.getFullYear()===curY){days[dStr]=true;}}}return Object.keys(days).sort();}
function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase().trim();if(!q)return;var a=document.getElementById('publicViewArea');var h='<div class="card"><h3>Search: '+q+'</h3></div>';var f=false;for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q)){f=true;h+='<div class="card">📢 ACTIVE: '+complaints[i].chassis+'<br>Location: '+(complaints[i].location||'')+'<br>Address: '+(complaints[i].address||complaints[i].addr||'')+'<br>Issue: '+(complaints[i].issue||'')+'<br>Plot: '+(complaints[i].plot||'')+'<br>Date: '+(complaints[i].date||'')+'</div>';}}for(var i=0;i<transJobs.length;i++){if((transJobs[i].chassis||'').toLowerCase().includes(q)){f=true;h+='<div class="card">🚚 TRANSPORT: '+transJobs[i].chassis+'<br>Full Name: '+(transJobs[i].name||'')+'<br>Tenant: '+(transJobs[i].tenant||'')+'<br>Plot: '+(transJobs[i].plot||'')+'<br>Pickup: '+(transJobs[i].pickupAddr||'')+' '+(transJobs[i].pickupPostcode||'')+' '+ (transJobs[i].pickupDate||'')+'<br>Delivery: '+(transJobs[i].deliveryAddr||'')+' '+(transJobs[i].deliveryPostcode||'')+' '+(transJobs[i].deliveryDate||'')+'<br>Phone: '+(transJobs[i].phone||'')+'</div>';}}if(!f)h+='<div class="card">No result</div>';a.innerHTML=h;}

function setTab(t){curTab=t;localStorage.setItem('uh_curTab',t);renderContent();}function startLiveSync(){if(!db)return;try{db.collection('chatMsgs').orderBy('timestamp','asc').onSnapshot(function(snap){var arr=[];var lastLen=chatMsgs.length;snap.forEach(function(doc){var d=doc.data();arr.push(d);});if(arr.length>lastLen&&lastLen>0){var curRaw=localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||(role==='admin'?'Admin':'');var curN=curRaw.toLowerCase().trim();var newMsg=arr[arr.length-1];if(newMsg){var from=(newMsg.name||'').toLowerCase().trim();var toRaw=(newMsg.to||'').toLowerCase().trim();var isForMe=false;if(toRaw===''||toRaw==='all')isForMe=true;else{var parts=toRaw.split(',').map(function(x){return x.trim().toLowerCase();});if(curN==='admin'){if(from==='admin'||parts.includes('admin'))isForMe=true;}else{if(parts.includes(curN))isForMe=true;}}if(isForMe&&from!==curN){showNotif('💬 New Chat from '+newMsg.name, (newMsg.msg||'media').substring(0,80));}}}if(arr.length>0){chatMsgs=arr;localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}document.getElementById('cloudStatus').innerHTML='☁️ Live Connected - Notif '+(localStorage.getItem('uh_notif')||'off');});db.collection('complaints').onSnapshot(function(snap){snap.forEach(function(ch){if(ch.type==='added'){var d=ch.doc.data();if(role==='admin')showNotif('📢 New Job Assigned','Chassis '+d.chassis);}});});}catch(e){}}

function renderChatList(){var curRaw=localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||(role==='admin'?'Admin':'');var curN=curRaw.toLowerCase().trim();var box=document.getElementById('adminChatList');if(!box)return;var q=(document.getElementById('chatSearchInput')&&document.getElementById('chatSearchInput').value||'').toLowerCase();var h='';for(var i=0;i<chatMsgs.length;i++){var cm=chatMsgs[i];var from=(cm.name||'').toLowerCase().trim();var toRaw=(cm.to||'').toLowerCase().trim();var isGroup=toRaw===''||toRaw==='all';var show=false;if(isGroup){show=true;}else{var parts=toRaw.split(',').map(function(x){return x.trim().toLowerCase();}).filter(function(x){return x;});if(curN==='admin'){if(from==='admin'||parts.includes('admin'))show=true;}else{if(from===curN||parts.includes(curN))show=true;}}if(!show)continue;if(q&&!((cm.msg||'').toLowerCase().includes(q)||from.includes(q)))continue;var badge=isGroup?'🌐 GROUP ALL':(from===curN?'➡️ You → '+(cm.to||''):'⬅️ '+cm.name+' → You');var toShow=toRaw===''?'All':(cm.to||'');h+='<div class="card" style="margin:6px 0;border-left:5px solid '+(isGroup?'#00c851':'#e91e63')+'"><small style="font-size:10px;font-weight:bold">'+badge+' | To: '+toShow+' | '+ (cm.time||'')+'</small><br><b>'+(cm.msg||'')+'</b>'+(cm.photo?'<br><img src="'+cm.photo+'" style="width:90%;max-height:200px;border-radius:10px;margin-top:6px" onclick="viewPic(this.src)">':'')+(cm.voice?'<br><audio src="'+cm.voice+'" controls style="width:100%"></audio>':'')+(cm.video?'<br><video src="'+cm.video+'" style="width:100%;max-height:200px;border-radius:10px" controls></video>':'')+'<br><small style="color:#888">'+(cm.date||'')+'</small> <button class="btn2" style="padding:4px 8px;font-size:11px" onclick="replyChat(\''+cm.name.replace(/'/g,'')+'\')">Reply</button> <button class="btn2" style="padding:4px 8px;font-size:11px;color:red" onclick="delChat('+i+')">Del</button></div>';}if(h==='')h='<div class="card"><b>Your Profile: '+curRaw+' - Separate Inbox</b><br function initChatMedia(){var p=document.getElementById('chatPhoto');var vo=document.getElementById('chatVoice');var vi=document.getElementById('chatVideo');var prev=document.getElementById('chatMediaPrev');function handle(f,type){for(var i=0;i<f.length;i++){(function(file){var r=new FileReader();r.onload=function(ev){if(!prev)return;if(type==='photo'){prev.dataset.photo=ev.target.result;prev.innerHTML+='<img src="'+ev.target.result+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';}if(type==='voice'){prev.dataset.voice=ev.target.result;prev.innerHTML+='<audio src="'+ev.target.result+'" controls style="width:100%"></audio>';}if(type==='video'){prev.dataset.video=ev.target.result;prev.innerHTML+='<video src="'+ev.target.result+'" style="width:70px;height:70px;border-radius:10px;margin:3px" controls></video>';}};r.readAsDataURL(file);})(f[i]);}}if(p)p.addEventListener('change',function(e){handle(e.target.files,'photo');});if(vo)vo.addEventListener('change',function(e){handle(e.target.files,'voice');});if(vi)vi.addEventListener('change',function(e){handle(e.target.files,'video');});}function adminCreateComplaint(){var o={name:document.getElementById('acName').value, chassis:document.getElementById('acChassis').value.trim(), location:document.getElementById('acLocation').value, plot:document.getElementById('acPlot').value, addr:document.getElementById('acAddr').value, address:document.getElementById('acAddr').value, phone:document.getElementById('acPhone').value, issue:document.getElementById('acIssue').value, assignedTo:document.getElementById('acAssign').value, emergency:document.getElementById('acEmerg').checked, photos:compPhotos.slice(), date:new Date().toLocaleDateString(), completed:false};if(!o.chassis){alert('Chassis needed');return;}complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudAdd('complaints',o);compPhotos=[];document.getElementById('compPrevBox').innerHTML='';showNotif('📢 New Active Job',o.chassis+' assigned to '+o.assignedTo);showToast('Job Created');renderContent();}

.target.files,'photo');});if(c)c.addEventListener('change',function(e){hf(e.target.files,'video');});if(d)d.addEventListener('change',function(e){hf(e.target.files,'video');});renderAboutPrev();}

function renderHomes(){
  var q=(document.getElementById('homeSearch')&&document.getElementById('homeSearch').value||'').toLowerCase();
  var l=document.getElementById('homesList');if(!l)return;
  var h='';
  var keys=Object.keys(companyHomes||{});
  try{
    var comps=JSON.parse(localStorage.getItem('companies')||'[]');
    for(var c=0;c<comps.length;c++){
      var cname=typeof comps[c]==='string'?comps[c]:(comps[c].name||'');
      if(cname&&keys.indexOf(cname)===-1)keys.push(cname);
    }
  }catch(e){}
  keys.sort();
  for(var k=0;k<keys.length;k++){
    var comp=keys[k];
    var arr=companyHomes[comp]||[];
    var filtered=[];
    for(var i=0;i<arr.length;i++){
      var ho=arr[i];
      if(q&&!(ho.chassis||'').toLowerCase().includes(q))continue;
      filtered.push({ho:ho,idx:i});
    }
    if(q&&filtered.length===0)continue;
    var compId='comp_'+k;
    h+='<div style="margin:14px 0; border:2px solid #8B5A2B; border-radius:14px; overflow:hidden;">';
    h+='<div onclick="var el=document.getElementById(\''+compId+'\'); var isClosed=el.style.display===\'none\'; document.querySelectorAll(\'.company-body\').forEach(b=>b.style.display=\'none\'); el.style.display=isClosed?\'block\':\'none\';" style="background:#8B5A2B; color:white; padding:14px 16px; font-weight:800; display:flex; justify-content:space-between; align-items:center; cursor:pointer;"><span>🏢 '+comp.toUpperCase()+'</span><span style="display:flex; gap:8px; align-items:center;"><span style="background:white; color:#8B5A2B; border-radius:20px; padding:4px 12px; font-size:12px;">'+filtered.length+' homes</span><span style="font-size:18px;">▼</span></span></div>';
    h+='<div id="'+compId+'" class="company-body" style="display:none; background:#fff;">';
    if(filtered.length===0){
      h+='<div style="padding:16px; text-align:center; color:#888;">No homes yet in '+comp+'<br><small>Add home with Company = '+comp+'</small><br><button onclick="delCompany(\''+comp.replace(/'/g,"\\'")+'\')" style="margin-top:10px; background:red; color:white; border:none; border-radius:8px; padding:6px 12px;">Delete Company '+comp+'</button></div>';
    }else{
      for(var j=0;j<filtered.length;j++){
        var ho=filtered[j].ho;
        var m='';
        if(ho.photos){for(var p=0;p<ho.photos.length;p++)m+='<img src="'+ho.photos[p]+'" style="width:90px;height:90px;border-radius:10px;margin:4px; border:1px solid #ddd;" onclick="viewPic(this.src)">';}
        if(ho.videos){for(var v=0;v<ho.videos.length;v++)m+='<video src="'+ho.videos[v]+'" style="width:120px;height:90px;border-radius:10px;margin:4px;" controls></video>';}
        // FULL DETAILS - show all fields
        var details='';
        for(var key in ho){
          if(key==='photos'||key==='videos'||key==='company')continue;
          if(ho[key])details+='<div style="padding:4px 0; border-bottom:1px dotted #eee;"><b style="color:#8B5A2B;">'+key.toUpperCase()+':</b> '+ho[key]+'</div>';
        }
        h+='<div class="card" style="border-bottom:2px solid #8B5A2B; margin:0; border-radius:0; padding:14px;">'+details+'<div style="margin-top:6px;"><b>Company:</b> '+(ho.company||comp)+'</div><div style="margin-top:8px;">'+m+'</div><div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;"><button onclick="editHome(\''+comp+'\','+filtered[j].idx+')" style="padding:8px 16px; border-radius:20px; border:1px solid #8B5A2B; background:white; color:#8B5A2B; font-weight:600;">Edit</button><button onclick="delHome(\''+comp+'\','+filtered[j].idx+')" style="padding:8px 16px; border-radius:20px; border:1px solid red; background:white; color:red;">Delete Home</button></div></div>';
      }
      h+='<div style="padding:12px; text-align:center;"><button onclick="delCompany(\''+comp.replace(/'/g,"\\'")+'\')" style="background:#ff4444; color:white; border:none; border-radius:8px; padding:8px 16px; width:90%;">🗑️ Delete Whole Company '+comp+' ('+filtered.length+' homes)</button></div>';
    }
    h+='</div></div>';
  }
  if(keys.length===0)h='<div style="padding:20px; text-align:center; color:#888;">No companies yet.</div>';
  l.innerHTML=h;
}

function getWorkerOpts(){var o='';for(var i=0;i<workersList.length;i++){o+='<option value="'+workersList[i]+'">'+workersList[i]+'</option>';}return o;}
function renderT(){var list=document.getElementById('tjList');if(!list)return;var html='';var hasPending=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(j.done)continue;hasPending=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border:2px solid #ff9800"><b>🚚 CHASSIS: '+j.chassis+'</b><br><b>Full Name: '+(j.name||'NO NAME')+'</b><br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver:</b> '+(j.assignedTo||j.driver||'')+'<br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="markDone('+i+')">✅ Done</button> <button class="btn2" onclick="editTrans('+i+')">Edit</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasPending)html='<div class="card">No pending transport jobs</div>';list.innerHTML=html;}
function renderTDone(){var list=document.getElementById('tjDone');if(!list)return;var html='';var hasDone=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(!j.done)continue;hasDone=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border-left:5px solid #00c853"><b>✅ DONE CHASSIS: '+j.chassis+'</b><br><b>Full Name: '+(j.name||'NO NAME')+'</b><br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver:</b> '+(j.assignedTo||j.driver||'')+'<br><b>Completed:</b> '+(j.completedDate||'')+'<br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn2" onclick="markDone('+i+')">↩️ Reopen</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasDone)html='<div class="card">No done transport jobs yet</div>';list.innerHTML=html;}
function renderWorkers(){var dash=document.getElementById('workersDash');var list=document.getElementById('allReportsList');var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});if(dash){var h='<div style="background:#fff8e1;padding:8px;border-radius:10px"><b>This Month: '+curMonth+' (auto monthly reset)</b></div>';for(var i=0;i<workersList.length;i++){var w=workersList[i];var cnt=getWorkerDayCount(w);var allCnt=getWorkerDayCountAll(w);h+='<div class="card"><b>'+w+'</b><br>This Month Days: <b style="color:#00c851">'+cnt+'</b><br>All Time Unique Days: '+allCnt+'<br>Reports Total: '+reports.filter(function(r){return (r.name||'').toLowerCase()===w.toLowerCase();}).length+'<br><button class="btn2" style="color:red" onclick="delWorker('+i+')">Delete Worker</button></div>';}dash.innerHTML=h;}if(list){var hh='';for(var i=0;i<reports.length;i++){hh+='<div class="card"><b>'+reports[i].name+'</b> '+reports[i].chassis+'<br>'+reports[i].work+'<br>Date:'+reports[i].date+' <button class="btn2" style="font-size:10px" onclick="editReport('+i+')">Edit</button> <button class="btn2" style="font-size:10px;color:red" onclick="delReport('+i+')">Del</button></div>';}list.innerHTML=hh||'<div class="card">No reports</div>';}}
function getWorkerDayCountAll(name){if(!name)return 0;var nl=name.toLowerCase().trim();var days={};for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var d=(reports[i].date||'').trim();if(d)days[d]=true;}}return Object.keys(days).length;}
function addWorker(){var n=document.getElementById('newWorkerName').value.trim();if(!n)return;if(!workersList.includes(n)){workersList.push(n);localStorage.setItem('uh_workers',JSON.stringify(workersList));showToast('Worker Added');renderWorkers();}}
function delWorker(i){if(confirm('Delete worker?')){workersList.splice(i,1);localStorage.setItem('uh_workers',JSON.stringify(workersList));renderWorkers();}}
function editReport(i){var r=reports[i];var nw=prompt('Edit Work:',r.work);if(nw===null)return;r.work=nw;var nd=prompt('Edit Date YYYY-MM-DD:',r.date);if(nd!==null)r.date=nd;localStorage.setItem('uh_reports',JSON.stringify(reports));renderContent();}
function delReport(i){if(confirm('Delete report?')){reports.splice(i,1);localStorage.setItem('uh_reports',JSON.stringify(reports));renderContent();}}
function refreshCompanySelect(){var s=document.getElementById('selCompany');if(!s)return;var o='<option value="General">General</option>';for(var i=0;i<customCompanyTabs.length;i++)o+='<option value="'+customCompanyTabs[i]+'">'+customCompanyTabs[i]+'</option>';var ks=Object.keys(companyHomes);for(var j=0;j<ks.length;j++){if(!customCompanyTabs.includes(ks[j])&&ks[j]!=='General')o+='<option value="'+ks[j]+'">'+ks[j]+'</option>';}s.innerHTML=o;}
