var firebaseConfig={apiKey:"AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.firebasestorage.app",messagingSenderId:"863147801991",appId:"1:863147801991:web:71dad5c6b88bc0367ae722"};
var db=null;var messaging=null;
try{if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig);db=firebase.firestore();messaging=firebase.messaging();}}catch(e){}
var reports=JSON.parse(localStorage.getItem('uh_reports')||'[]');var complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');var transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');var completeJobs=JSON.parse(localStorage.getItem('uh_complete')||'[]');var chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');var workersList=JSON.parse(localStorage.getItem('uh_workers')||'["Ali","Hassan","John","Manpreet"]');var cp12List=JSON.parse(localStorage.getItem('uh_cp12')||'[]');var refurbs=JSON.parse(localStorage.getItem('uh_refurbs')||'[]');var companyHomes=JSON.parse(localStorage.getItem('uh_companyHomes')||'{}');var aboutData=JSON.parse(localStorage.getItem('uh_about')||'{"text":"UNIQUE HAVEN HOUSE WE BUILD UR DREAM"}');var pw=JSON.parse(localStorage.getItem('uh_pw')||'{"admin":"admin123","worker":"worker123","transport":"trans123","invoice":"public123"}');
var role=localStorage.getItem('uh_role')||'';var curTab=localStorage.getItem('uh_curTab')||'dash';var invoices={};try{invoices=JSON.parse(localStorage.getItem('uh_invoices')||'{}');}catch(e){invoices={}}
function cloudAdd(c,o){if(!db)return;try{db.collection(c).add(o);}catch(e){}}
function cloudDelete(c,f,v){if(!db)return;try{db.collection(c).where(f,'==',v).get().then(function(s){s.forEach(function(d){d.ref.delete();});});}catch(e){}}
function showToast(m){var t=document.getElementById('successToast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
function showNotifToast(m){var t=document.getElementById('notifToast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}
function calcUnpaid(){var tot=0;for(var k in invoices){for(var i=0;i<invoices[k].length;i++){if(!invoices[k][i].paid)tot+=Number(invoices[k][i].amt)||0;}}return tot.toFixed(2);}
function enableNotif(){if(!('Notification' in window)){alert('Not supported');return;}Notification.requestPermission().then(function(p){if(p==='granted'){localStorage.setItem('uh_notif','on');updateNotifStat();registerSW();saveFCMToken();showNotif('🔔 Notifications ON','You will get alerts');showToast('Notifications ON');}else alert('Denied');});}
function disableNotif(){localStorage.setItem('uh_notif','off');updateNotifStat();showToast('OFF');}
function updateNotifStat(){var s=document.getElementById('notifStat');if(!s)return;var v=localStorage.getItem('uh_notif')||'off';s.innerText=v==='on'?'ON ✅':'OFF ❌';}
function registerSW(){if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(function(r){console.log('SW OK');}).catch(function(e){console.log('SW fail',e);});}}
function showNotif(title,body){var en=localStorage.getItem('uh_notif')||'off';if(en!=='on')return;showNotifToast(title+': '+body);if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body:body,icon:'./icon-192.png'});}catch(e){}if(navigator.serviceWorker&&navigator.serviceWorker.ready){navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'./icon-192.png',vibrate:[200,100,200]});});}}}
function pushToAll(t,b){try{var all=JSON.parse(localStorage.getItem('uh_workers')||'[]');all.push('Admin');all.forEach(function(r){if(!r)return;fetch('https://firestore.googleapis.com/v1/projects/unique-haven-house/databases/(default)/documents/fcm_tokens/'+encodeURIComponent(r.trim())+'?key=AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc').then(function(res){return res.json();}).then(function(data){var token=data.fields&&data.fields.token&&data.fields.token.stringValue;if(!token)return;fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,title:t,body:b})});}).catch(function(){});});}catch(e){}}
function saveFCMToken(){if(!messaging)return;messaging.getToken({vapidKey:"BAfIxyUMOCz33GaNTuJgW7-dITtPhz-c-g0QJlLOIEylR-jvAV7IWbUwksuIPG6-gpjlLubvCtez2dDlT5IUNo8"}).then(function(t){if(!t)return;localStorage.setItem('fcm_token',t);var u=document.getElementById('chatName')?.value||localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin';if(!u)return;if(db){db.collection('fcm_tokens').doc(u).set({token:t,user:u,updated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}fetch('https://firestore.googleapis.com/v1/projects/unique-haven-house/databases/(default)/documents/fcm_tokens/'+encodeURIComponent(u)+'?key=AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{token:{stringValue:t},user:{stringValue:u}}})});}).catch(function(e){});messaging.onMessage(function(p){var title=p.notification?.title||'New';var body=p.notification?.body||'';showNotifToast(title+': '+body);if(Notification.permission==='granted'){navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'./icon-192.png'});});}});}
function getWorkerDayCount(name){if(!name)return 0;var nl=name.toLowerCase().trim();var now=new Date();var curM=now.getMonth();var curY=now.getFullYear();var days={};for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var dStr=(reports[i].date||'').trim();if(!dStr)continue;var dObj=new Date(dStr);if(isNaN(dObj))continue;if(dObj.getMonth()===curM&&dObj.getFullYear()===curY){days[dStr]=true;}}}return Object.keys(days).length;}
function getWorkerDaysList(name){if(!name)return [];var nl=name.toLowerCase().trim();var now=new Date();var curM=now.getMonth();var curY=now.getFullYear();var days={};for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var dStr=(reports[i].date||'').trim();if(!dStr)continue;var dObj=new Date(dStr);if(isNaN(dObj))continue;if(dObj.getMonth()===curM&&dObj.getFullYear()===curY){days[dStr]=true;}}}return Object.keys(days).sort();}
function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase().trim();if(!q)return;var a=document.getElementById('publicViewArea');var h='<div class="card"><h3>Search: '+q+'</h3></div>';var f=false;for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q)){f=true;h+='<div class="card">📢 ACTIVE: '+complaints[i].chassis+'<br>Location: '+(complaints[i].location||'')+'<br>Issue: '+(complaints[i].issue||'')+'</div>';}}if(!f)h+='<div class="card">No result</div>';a.innerHTML=h;}
function goAdmin(){var p=prompt('Admin Password');if(p===pw.admin){role='admin';curTab='dash';localStorage.setItem('uh_role','admin');document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();updateNotifStat();saveFCMToken();}else alert('Wrong');}function goWorker(){var p=prompt('Worker Password');if(p!==pw.worker){alert('Wrong');return;}var name=prompt('Your Name');if(!name)return;role='worker';curTab='myJobs';localStorage.setItem('uh_role','worker');localStorage.setItem('uh_curW',name.trim());document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();saveFCMToken();}
function goTransport(){var p=prompt('Transport Password');if(p!==pw.transport){alert('Wrong');return;}var name=prompt('Driver Full Name');if(!name)return;role='transport';curTab='transportJobs';localStorage.setItem('uh_role','transport');localStorage.setItem('uh_curT',name.trim());document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();saveFCMToken();}
function backHome(){document.getElementById('app').style.display='none';document.getElementById('outside').style.display='block';document.getElementById('pageAbout').style.display='none';document.getElementById('pagePublicInvoice').style.display='none';document.getElementById('publicViewArea').innerHTML='';role='';localStorage.removeItem('uh_role');}
function initTabs(){var d=document.getElementById('tabs');if(!d)return;var h='';if(role==='admin'){h+='<button class="btn2" onclick="setTab(&apos;dash&apos;)">DASH</button><button class="btn2" onclick="setTab(&apos;complaintForm&apos;)">ADD JOB</button><button class="btn2" onclick="setTab(&apos;activeJobs&apos;)">ACTIVE</button><button class="btn2" onclick="setTab(&apos;completeJobs&apos;)">COMPLETE</button><button class="btn2" style="background:#ff9800;color:#fff" onclick="setTab(&apos;transportForm&apos;)">TRANS FORM</button><button class="btn2" onclick="setTab(&apos;transportJobs&apos;)">TRANS</button><button class="btn2" onclick="setTab(&apos;transportDone&apos;)">TRANS DONE</button><button class="btn2" onclick="setTab(&apos;refurb&apos;)">REFURB</button><button class="btn2" onclick="setTab(&apos;refurbDone&apos;)">REFURB DONE</button><button class="btn2" onclick="setTab(&apos;cp12&apos;)">CP12</button><button class="btn2" onclick="setTab(&apos;invoices&apos;)">INVOICES</button><button class="btn2" onclick="setTab(&apos;companyHomes&apos;)">HOMES</button><button class="btn2" onclick="setTab(&apos;workers&apos;)">WORKERS</button><button class="btn2" onclick="setTab(&apos;notifSettings&apos;)">NOTIF</button><button class="btn2" onclick="setTab(&apos;chat&apos;)">CHAT</button><button class="btn2" onclick="setTab(&apos;about&apos;)">ABOUT</button>';}else if(role==='worker'){h+='<button class="btn2" onclick="setTab(&apos;myJobs&apos;)">MY JOBS</button><button class="btn2" onclick="setTab(&apos;myComplete&apos;)">MY DONE</button><button class="btn2" onclick="setTab(&apos;report&apos;)">REPORT</button><button class="btn2" onclick="setTab(&apos;chat&apos;)">CHAT</button>';}else if(role==='transport'){h+='<button class="btn2" onclick="setTab(&apos;transportJobs&apos;)">MY TRANS</button><button class="btn2" onclick="setTab(&apos;transportDone&apos;)">DONE</button><button class="btn2" onclick="setTab(&apos;chat&apos;)">CHAT</button>';}d.innerHTML=h;}
function setTab(t){curTab=t;localStorage.setItem('uh_curTab',t);renderContent();}
function renderContent(){var c=document.getElementById('content');if(!c)return;var html='';if(curTab==='dash'){html+=renderDash();}else if(curTab==='complaintForm'){html+=renderComplaintForm();}else if(curTab==='activeJobs'){html+=renderActiveJobs();}else if(curTab==='completeJobs'){html+=renderCompleteJobs();}else if(curTab==='transportForm'){html+=renderTransportForm();}else if(curTab==='transportJobs'){html+=renderTransportJobs();}else if(curTab==='transportDone'){html+=renderTransportDone();}else if(curTab==='refurb'){html+=renderRefurb();}else if(curTab==='refurbDone'){html+=renderRefurbDone();}else if(curTab==='cp12'){html+=renderCP12();}else if(curTab==='invoices'){html+=renderInvoices();}else if(curTab==='companyHomes'){html+=renderCompanyHomes();}else if(curTab==='workers'){html+=renderWorkers();}else if(curTab==='notifSettings'){html+=renderNotifSettings();}else if(curTab==='chat'){html+=renderChat();}else if(curTab==='about'){html+=renderAbout();}else if(curTab==='myJobs'){html+=renderMyJobs();}else if(curTab==='myComplete'){html+=renderMyComplete();}else if(curTab==='report'){html+=renderReportForm();}c.innerHTML=html;if(curTab==='chat'){setTimeout(renderChatList,100);}}
function renderDash(){var html='<div class="card"><h3>DASHBOARD - Unpaid £'+calcUnpaid()+'</h3><div>Active:'+complaints.length+' Complete:'+completeJobs.length+' Trans:'+transJobs.length+'</div></div>';return html;}
function renderComplaintForm(){return '<div class="card"><h3>➕ ADD NEW JOB</h3><input id="compChassis" placeholder="Chassis *"><input id="compLocation" placeholder="Location *"><input id="compAddress" placeholder="Address *"><input id="compIssue" placeholder="Issue *"><button class="btn" onclick="submitComplaint()">+ SUBMIT JOB</button></div>';}
function submitComplaint(){var chassis=document.getElementById('compChassis').value.trim();var location=document.getElementById('compLocation').value.trim();if(!chassis||!location){alert('Chassis & Location required');return;}var o={id:Date.now(),chassis:chassis,location:location,address:document.getElementById('compAddress').value.trim(),issue:document.getElementById('compIssue').value.trim(),date:new Date().toISOString().split('T')[0],status:'active',name:'Admin'};complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudAdd('complaints',o);try{pushToAll('New Complaint - '+o.chassis,(o.issue||'').substring(0,80));}catch(e){}showNotif('New Job Added',chassis+' - '+location);showToast('Job Added');setTab('activeJobs');}

function markJobDone(id){var idx=complaints.findIndex(x=>x.id==id);if(idx==-1)return;var job=complaints[idx];completeJobs.unshift({...job,doneDate:new Date().toISOString().split('T')[0]});complaints.splice(idx,1);localStorage.setItem('uh_comp',JSON.stringify(complaints));localStorage.setItem('uh_complete',JSON.stringify(completeJobs));cloudAdd('completeJobs',job);cloudDelete('complaints','id',id);try{pushToAll('Job Done - '+job.chassis,job.chassis+' completed');}catch(e){}showToast('Marked Done');renderContent();}
function renderCompleteJobs(){return '<div class="card"><h3>✅ COMPLETE JOBS</h3></div>';}
function renderTransportForm(){return '<div class="card"><h3>🚚 ADD TRANSPORT JOB</h3><input id="transChassis" placeholder="Chassis No *"><input id="transName" placeholder="Full Name *"><input id="transPickupAddr" placeholder="Pickup Address"><input id="transDeliveryAddr" placeholder="Delivery Address"><button class="btn" style="background:#ff9800;color:#fff" onclick="submitTransport()">+ SUBMIT TRANSPORT</button></div>';}
function submitTransport(){var chassis=document.getElementById('transChassis').value.trim();if(!chassis){alert('Chassis required');return;}var o={id:Date.now(),chassis:chassis,name:document.getElementById('transName').value.trim(),pickupAddr:document.getElementById('transPickupAddr').value.trim(),deliveryAddr:document.getElementById('transDeliveryAddr').value.trim(),date:new Date().toISOString().split('T')[0],status:'active'};transJobs.unshift(o);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudAdd('transJobs',o);try{pushToAll('New Transport - '+o.chassis,o.name||'');}catch(e){}showNotif('New Transport',chassis);showToast('Transport Added');setTab('transportJobs');}function renderTransportJobs(){var html='<div class="card"><h3>🚚 TRANSPORT JOBS</h3>';for(var i=0;i<transJobs.length;i++){var j=transJobs[i];html+='<div class="card folder"><b>🚚 '+j.chassis+'</b><br>'+(j.name||'')+'<br><button class="btn-green" onclick="markTransDone('+j.id+')">✅ Done</button></div>';}html+='</div>';return html;}
function markTransDone(id){var idx=transJobs.findIndex(x=>x.id==id);if(idx==-1)return;var job=transJobs[idx];transJobs.splice(idx,1);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));try{pushToAll('Transport Done - '+job.chassis,job.chassis);}catch(e){}showToast('Transport Done');renderContent();}
function renderTransportDone(){return '<div class="card"><h3>✅ TRANSPORT DONE</h3></div>';}
function renderRefurb(){return '<div class="card"><h3>🏠 REFURB HOMES</h3><input id="refurbChassis" placeholder="Chassis"><input id="refurbAddr" placeholder="Address"><input id="refurbWork" placeholder="Work"><button class="btn" onclick="addRefurb()">+ ADD REFURB</button></div>';}
function addRefurb(){var c=document.getElementById('refurbChassis').value.trim();if(!c)return;var o={id:Date.now(),chassis:c,address:document.getElementById('refurbAddr').value.trim(),work:document.getElementById('refurbWork').value.trim(),date:new Date().toISOString().split('T')[0]};refurbs.unshift(o);localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));try{pushToAll('New Refurb - '+c,o.work||'');}catch(e){}showToast('Refurb Added');renderContent();}
function renderRefurbDone(){return '<div class="card"><h3>🏠 REFURB DONE</h3></div>';}
function renderCP12(){return '<div class="card"><h3>📋 CP12</h3><input id="cp12Chassis" placeholder="Chassis"><button class="btn" onclick="addCP12()">+ ADD</button></div>';}
function addCP12(){var o={id:Date.now(),chassis:document.getElementById('cp12Chassis').value.trim(),date:new Date().toISOString().split('T')[0]};cp12List.unshift(o);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));showToast('CP12 Added');renderContent();}
function renderInvoices(){return '<div class="card"><h3>📄 INVOICES - Unpaid £'+calcUnpaid()+'</h3><input id="invChassis" placeholder="Chassis Folder"><input id="invCompany" placeholder="Company"><input id="invAmt" type="number" placeholder="Amount"><button class="btn" onclick="addInvoice()">+ ADD</button></div>';}
function addInvoice(){var ch=document.getElementById('invChassis').value.trim();if(!ch)return;var obj={id:Date.now(),chassis:ch,company:document.getElementById('invCompany').value.trim(),amt:document.getElementById('invAmt').value,desc:'Invoice',date:new Date().toISOString().split('T')[0],paid:false};if(!invoices[ch])invoices[ch]=[];invoices[ch].unshift(obj);localStorage.setItem('uh_invoices',JSON.stringify(invoices));try{pushToAll('New Invoice - '+ch,obj.company||'');}catch(e){}showToast('Invoice Added');renderContent();}
function renderCompanyHomes(){return '<div class="card"><h3>🏠 COMPANY HOMES</h3></div>';}
function renderWorkers(){return '<div class="card"><h3>👷 WORKERS - '+workersList.length+'</h3><input id="newWorkerName" placeholder="New Worker"><button class="btn" onclick="addWorker()">+ Add</button></div>';}
function addWorker(){var n=document.getElementById('newWorkerName').value.trim();if(!n)return;workersList.push(n);localStorage.setItem('uh_workers',JSON.stringify(workersList));showToast('Worker Added');renderContent();}
function renderNotifSettings(){return '<div class="card"><h3>🔔 Notification Settings</h3><button class="btn" onclick="enableNotif()">Enable Notifications</button></div>';}
function renderChat(){return '<div class="card"><h3>💬 CHAT - Private + Group</h3><input id="chatName" placeholder="Your Name" value="'+(localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin')+'"><input id="chatTo" placeholder="To (Name or All)"><button class="btn2" onclick="setChatToAll()">To All</button><input id="chatMsg" placeholder="Message"><button class="btn" onclick="sendPublicChat()">📤 SEND - Off App Push</button><div id="chatList" style="max-height:400px;overflow:auto"></div></div>';}
function setChatToAll(){var e=document.getElementById('chatTo');if(e)e.value='All';}
function renderChatList(){var l=document.getElementById('chatList');if(!l)return;var cur=(document.getElementById('chatName')?.value||localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin').toLowerCase().trim();var html='';for(var i=chatMsgs.length-1;i>=0;i--){var m=chatMsgs[i];var from=(m.name||'').toLowerCase().trim();var to=(m.to||'').toLowerCase().trim();var isPrivate=to&&to!=='all';var show=true;if(isPrivate){if(from!==cur&&to.indexOf(cur)===-1)show=false;}if(!show)continue;html+='<div class="card" style="padding:8px;margin:4px 0;background:'+(from===cur?'#e8f5e9':'#fff')+'"><b>'+m.name+'</b> '+(isPrivate?'<small style="color:#c00">→ '+m.to+'</small>':'<small style="color:#00c851">→ All</small>')+'<br>'+(m.msg||'')+'<br><small>'+(m.time||'')+'</small></div>';}l.innerHTML=html;}
function sendPublicChat(){var name=document.getElementById('chatName').value.trim();var to=document.getElementById('chatTo').value.trim();var msg=document.getElementById('chatMsg').value.trim();if(!name||!msg){alert('Enter message');return;}var obj={id:Date.now(),name:name,to:to||'All',msg:msg,time:new Date().toLocaleString()};chatMsgs.push(obj);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudAdd('chatMsgs',obj);renderChatList();try{var recipients=[];if(!to||to.toLowerCase()==='all'){var all=JSON.parse(localStorage.getItem('uh_workers')||'[]');all.push('Admin');recipients=all.filter(function(u){return u.toLowerCase()!==name.toLowerCase();});}else{recipients=to.split(',').map(function(x){return x.trim();}).filter(function(x){return x;});}recipients.forEach(function(r){fetch('https://firestore.googleapis.com/v1/projects/unique-haven-house/databases/(default)/documents/fcm_tokens/'+encodeURIComponent(r)+'?key=AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc').then(function(res){return res.json();}).then(function(data){var token=data.fields&&data.fields.token&&data.fields.token.stringValue;if(!token)return;fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,title:(!to||to.toLowerCase()==='all')?'Group: '+name:'New from '+name,body:msg})});});});}catch(e){}document.getElementById('chatMsg').value='';showToast('Sent - Off App Push');}
function renderMyJobs(){var html='<div class="card"><h3>👷 MY JOBS</h3>';for(var i=0;i<complaints.length;i++){html+='<div class="card folder"><b>'+complaints[i].chassis+'</b><br>'+(complaints[i].location||'')+'</div>';}html+='</div>';return html;}function renderMyComplete(){return '<div class="card"><h3>✅ MY DONE</h3></div>';}
function renderReportForm(){return '<div class="card"><h3>📝 REPORT</h3><input id="repChassis" placeholder="Chassis"><textarea id="repWork" placeholder="Work Done"></textarea><button class="btn" onclick="submitReport()">Submit</button></div>';}
function submitReport(){var chassis=document.getElementById('repChassis').value.trim();var obj={id:Date.now(),chassis:chassis,work:document.getElementById('repWork').value.trim(),date:new Date().toISOString().split('T')[0],name:localStorage.getItem('uh_curW')||''};reports.push(obj);localStorage.setItem('uh_reports',JSON.stringify(reports));showToast('Report Submitted');setTab('myComplete');}
function renderAbout(){return '<div class="card"><h3>ℹ️ ABOUT US - UNIQUE HAVEN HOUSE WE BUILD UR DREAM</h3><textarea id="aboutText">'+(aboutData.text||'')+'</textarea><button class="btn" onclick="saveAbout()">Save</button></div>';}
function saveAbout(){aboutData.text=document.getElementById('aboutText').value;localStorage.setItem('uh_about',JSON.stringify(aboutData));showToast('Saved');}
function openPublicActive(){var a=document.getElementById('publicViewArea');var h='<div class="card"><h3>👀 PUBLIC ACTIVE JOBS</h3>';for(var i=0;i<complaints.length;i++)h+='<div class="card folder">'+complaints[i].chassis+' - '+complaints[i].location+'</div>';h+='</div>';a.innerHTML=h;}
function openPublicTransport(){var a=document.getElementById('publicViewArea');var h='<div class="card"><h3>🚚 PUBLIC TRANSPORT</h3>';for(var i=0;i<transJobs.length;i++)h+='<div class="card folder">'+transJobs[i].chassis+'</div>';h+='</div>';a.innerHTML=h;}
function openPublicRefurb(){var a=document.getElementById('publicViewArea');var h='<div class="card"><h3>🏠 REFURB</h3></div>';a.innerHTML=h;}
function openPublicInvoice(){document.getElementById('outside').style.display='none';document.getElementById('pagePublicInvoice').style.display='block';}
function openPublicChat(){var a=document.getElementById('publicViewArea');a.innerHTML='<div class="card"><h3>💬 PUBLIC CHAT - All only</h3></div>';}
function openAbout(){document.getElementById('outside').style.display='none';document.getElementById('pageAbout').style.display='block';document.getElementById('aboutView').innerText=aboutData.text||'UNIQUE HAVEN HOUSE';}
function checkPublicInvoicePw(){var p=document.getElementById('publicInvoicePwInput').value;if(p===pw.invoice||p==='public123'){document.getElementById('publicInvoicePwBox').style.display='none';document.getElementById('pagePublicInvoiceContent').style.display='block';}else alert('Wrong');}
function submitPublicInvoice(){var ch=document.getElementById('pubInvChassis').value.trim();if(!ch){alert('Chassis required');return;}var obj={id:Date.now(),chassis:ch,company:document.getElementById('pubInvCompany').value.trim(),person:document.getElementById('pubInvPerson').value.trim(),amt:document.getElementById('pubInvAmt').value,desc:document.getElementById('pubInvDesc').value.trim(),date:new Date().toISOString().split('T')[0]};var key='pubInv_'+ch;var arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift(obj);localStorage.setItem(key,JSON.stringify(arr));cloudAdd('publicInvoices',obj);showToast('Invoice Submitted');}
function deleteComplaint(id){if(!confirm('Delete?'))return;complaints=complaints.filter(x=>x.id!=id);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudDelete('complaints','id',id);renderContent();}
function deleteTrans(id){if(!confirm('Delete?'))return;transJobs=transJobs.filter(x=>x.id!=id);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudDelete('transJobs','id',id);renderContent();}
function startLiveSync(){if(!db)return;try{db.collection('complaints').onSnapshot(function(s){s.docChanges().forEach(function(ch){if(ch.type==='added'){var d=ch.doc.data();if(!complaints.find(x=>x.id==d.id)){complaints.unshift(d);localStorage.setItem('uh_comp',JSON.stringify(complaints));if(role)renderContent();}}});});db.collection('chatMsgs').onSnapshot(function(s){s.docChanges().forEach(function(ch){if(ch.type==='added'){var d=ch.doc.data();if(!chatMsgs.find(x=>x.id==d.id)){chatMsgs.push(d);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));if(curTab==='chat')renderChatList();var to=(d.to||'').toLowerCase();var cur=(localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'').toLowerCase();if(to==='all'||to.indexOf(cur)!==-1){showNotif('New Message from '+d.name,d.msg||'');}}});});}catch(e){}}
window.addEventListener('load',function(){updateNotifStat();registerSW();if(role){document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();startLiveSync();}});
</script>
