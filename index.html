<script>
var firebaseConfig={apiKey:"AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.firebasestorage.app",messagingSenderId:"863147801991",appId:"1:863147801991:web:71dad5c6b88bc0367ae722"};
var db=null,messaging=null;try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();messaging=firebase.messaging();}catch(e){}
var complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');var transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');var chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');var workersList=JSON.parse(localStorage.getItem('uh_workers')||'["Ali","Hassan","John","Manpreet"]');var pw=JSON.parse(localStorage.getItem('uh_pw')||'{"admin":"admin123","worker":"worker123","transport":"trans123"}');var role=localStorage.getItem('uh_role')||'';var curTab='dash';
function showToast(m){var t=document.getElementById('successToast');t.innerText=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500);}
function showNotifToast(m){var t=document.getElementById('notifToast');t.innerText=m;t.style.display='block';setTimeout(function(){t.style.display='none'},4000);}
function updateNotifStat(){var s=document.getElementById('notifStat');if(s)s.innerText=(localStorage.getItem('uh_notif')||'off')==='on'?'ON ✅':'OFF ❌';}
function registerSW(){if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');}
function showNotif(t,b){if((localStorage.getItem('uh_notif')||'off')!=='on')return;showNotifToast(t+': '+b);if(Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(function(r){r.showNotification(t,{body:b});});}}function pushToAll(t,b){
 try{
  var all=JSON.parse(localStorage.getItem('uh_workers')||'[]');
  all.push('Admin');
  all.forEach(function(r){
   var url='https://firestore.googleapis.com/v1/projects/unique-haven-house/databases/(default)/documents/fcm_tokens/'+encodeURIComponent(r.trim())+'?key=AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc';
   fetch(url).then(function(res){return res.json()}).then(function(d){
    var token=d.fields&&d.fields.token&&d.fields.token.stringValue;
    if(!token)return;
    fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,title:t,body:b})});
   });
  });
 }catch(e){}
}
function saveFCMToken(){
 if(!messaging)return;
 messaging.getToken({vapidKey:"BAfIxyUMOCz33GaNTuJgW7-dITtPhz-c-g0QJlLOIEylR-jvAV7IWbUwksuIPG6-gpjlLubvCtez2dDlT5IUNo8"}).then(function(t){

  localStorage.setItem('fcm_token',t);
  var u=document.getElementById('chatName')?.value||localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin';
  if(db&&u)db.collection('fcm_tokens').doc(u).set({token:t,user:u},{merge:true});
 });

function enableNotif(){
 Notification.requestPermission().then(function(p){
  if(p==='granted'){
   localStorage.setItem('uh_notif','on');
   updateNotifStat();registerSW();saveFCMToken();showToast('Notifications ON - Off App Enabled');
  }
 });
}

function backHome(){document.getElementById('app').style.display='none';document.getElementById('outside').style.display='block';role='';localStorage.removeItem('uh_role')}
function initTabs(){
 var d=document.getElementById('tabs');if(!d)return;var h='';
 if(role==='admin'){h+='<button class="btn2" onclick="setTab(\'dash\')">DASH</button><button class="btn2" onclick="setTab(\'complaintForm\')">ADD JOB</button><button class="btn2" onclick="setTab(\'activeJobs\')">ACTIVE</button><button class="btn2" onclick="setTab(\'chat\')">CHAT</button>'}
 else if(role==='worker'){h+='<button class="btn2" onclick="setTab(\'myJobs\')">MY JOBS</button><button class="btn2" onclick="setTab(\'chat\')">CHAT</button>'}
 else if(role==='transport'){h+='<button class="btn2" onclick="setTab(\'transportJobs\')">TRANS</button><button class="btn2" onclick="setTab(\'chat\')">CHAT</button>'}
 d.innerHTML=h;
}
function setTab(t){curTab=t;localStorage.setItem('uh_curTab',t);renderContent()}function renderContent(){
 var c=document.getElementById('content');if(!c)return;var html='';
 if(curTab==='dash'){html+='<div class="card"><h3>DASH - Active:'+complaints.length+'</h3><button class="btn" onclick="setTab(\'complaintForm\')">Add Job</button></div>'}
 else if(curTab==='complaintForm'){html+='<div class="card"><h3>Add Job</h3><input id="compChassis" placeholder="Chassis *"><input id="compLocation" placeholder="Location *"><input id="compIssue" placeholder="Issue *"><button class="btn" onclick="submitComplaint()">Submit</button></div>'}
 else if(curTab==='activeJobs'){html+='<div class="card"><h3>Active Jobs ('+complaints.length+')</h3>';for(var i=0;i<complaints.length;i++)html+='<div class="card">'+complaints[i].chassis+' - '+complaints[i].location+'</div>';html+='</div>'}
 else if(curTab==='transportJobs'){html+='<div class="card"><h3>Transport Jobs</h3>';for(var i=0;i<transJobs.length;i++)html+='<div class="card">'+transJobs[i].chassis+'</div>';html+='</div>'}
 else if(curTab==='chat'){html+='<div class="card"><h3>Chat - Private (To Name) + Group (To All)</h3><input id="chatName" placeholder="Your Name" value="'+(localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin')+'"><input id="chatTo" placeholder="To: All or Name e.g. Ali"><input id="chatMsg" placeholder="Message"><button class="btn" onclick="sendPublicChat()">Send - Off App Push</button><div id="chatList" style="max-height:400px;overflow:auto"></div></div>'}
 else if(curTab==='myJobs'){html+='<div class="card"><h3>My Jobs</h3>';for(var i=0;i<complaints.length;i++)html+='<div class="card">'+complaints[i].chassis+'</div>';html+='</div>'}
 c.innerHTML=html;if(curTab==='chat')setTimeout(renderChatList,200);
}
function submitComplaint(){
 var ch=document.getElementById('compChassis').value.trim();if(!ch){alert('Chassis required');return}
 var o={id:Date.now(),chassis:ch,location:document.getElementById('compLocation').value.trim(),issue:document.getElementById('compIssue').value.trim(),date:new Date().toISOString().split('T')[0]};
 complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));
 try{pushToAll('New Job - '+ch,o.issue)}catch(e){}
 showToast('Added - Push Sent to All');setTab('activeJobs');

function renderChatList(){
 var l=document.getElementById('chatList');if(!l)return;var html='';
 for(var i=chatMsgs.length-1;i>=0;i--){var m=chatMsgs[i];html+='<div class="card"><b>'+m.name+'</b> → '+(m.to||'All')+'<br>'+m.msg+'<br><small>'+m.time+'</small></div>'}
 l.innerHTML=html;
}function sendPublicChat(){
 var name=document.getElementById('chatName').value.trim();
 var to=document.getElementById('chatTo').value.trim()||'All';
 var msg=document.getElementById('chatMsg').value.trim();
 if(!name||!msg){alert('Name & Message required');return}
 var obj={id:Date.now(),name:name,to:to,msg:msg,time:new Date().toLocaleString()};
 chatMsgs.push(obj);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();
 try{
  var rec=[];
  if(to.toLowerCase()==='all'){
   var all=JSON.parse(localStorage.getItem('uh_workers')||'[]');all.push('Admin');
   rec=all.filter(function(u){return u.toLowerCase()!==name.toLowerCase()});
  }else{rec=to.split(',').map(function(x){return x.trim()});}
  rec.forEach(function(r){
   var url='https://firestore.googleapis.com/v1/projects/unique-haven-house/databases/(default)/documents/fcm_tokens/'+encodeURIComponent(r)+'?key=AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc';
   fetch(url).then(function(res){return res.json()}).then(function(d){

    fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,title:to.toLowerCase()==='all'?'Group: '+name:'From '+name,body:msg})});
   });
  });
 }catch(e){}
 document.getElementById('chatMsg').value='';showToast('Sent - Off App Push Sent');
}
