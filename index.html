function sendPublicChat(){var name=document.getElementById('chatName').value.trim();var to=document.getElementById('chatTo').value.trim();var msg=document.getElementById('chatMsg').value.trim();if(!name){alert('Enter Your Name');return;}if(!msg&&!chatTmp){alert('Enter message');return;}var obj={id:Date.now(),name:name,to:to||'All',msg:msg,photo:chatTmp||'',time:new Date().toLocaleString()};chatMsgs.push(obj);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudAdd('chatMsgs',obj);renderChatList();try{var recipients=[];if(!to||to.toLowerCase()==='all'||to===''){var all=JSON.parse(localStorage.getItem('uh_workers')||'[]');all.push('Admin');recipients=all.filter(function(u){return u.toLowerCase()!==name.toLowerCase();});}else{recipients=to.split(',').map(function(x){return x.trim();}).filter(function(x){return x;});}recipients.forEach(function(r){fetch('https://firestore.googleapis.com/v1/projects/unique-haven-house/databases/(default)/documents/fcm_tokens/'+encodeURIComponent(r)+'?key=AIzaSyC8pET9aGyiCLEQB0S1AyW0uxeeD_bN5Zc').then(function(res){return res.json();}).then(function(data){var token=data.fields&&data.fields.token&&data.fields.token.stringValue;if(!token)return;fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,title:(!to||to.toLowerCase()==='all')?'Group: '+name:'New from '+name,body:msg||'Media'})});});});}catch(e){}document.getElementById('chatMsg').value='';chatTmp=null;showToast('Sent');}

function submitPublicInvoice(){var ch=document.getElementById('pubInvChassis').value.trim();if(!ch){alert('Chassis required');return;}var obj={id:Date.now(),chassis:ch,company:document.getElementById('pubInvCompany').value.trim(),person:document.getElementById('pubInvPerson').value.trim(),amt:document.getElementById('pubInvAmt').value,desc:document.getElementById('pubInvDesc').value.trim(),date:new Date().toISOString().split('T')[0],photos:pubInvTmp||[]};var key='pubInv_'+ch;var arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift(obj);localStorage.setItem(key,JSON.stringify(arr));cloudAdd('publicInvoices',obj);showToast('Invoice Submitted');pubInvTmp=[];}

// Image handlers
document.addEventListener('change',function(e){var id=e.target.id;if(id==='compCam'||id==='compLib'){handleFiles(e.target.files,function(d){compPhotos.push(d);});}if(id==='transCam'||id==='transLib'){handleFiles(e.target.files,function(d){transPhotos.push(d);});}if(id==='invCam'||id==='invLib'){handleFiles(e.target.files,function(d){invTmp.push(d);});}if(id==='pubInvCam'||id==='pubInvLib'){handleFiles(e.target.files,function(d){pubInvTmp.push(d);});}if(id==='chatCam'||id==='chatLib'){handleFilesSingle(e.target.files,function(d){chatTmp=d;});}});
function handleFiles(files,cb){for(var i=0;i<files.length;i++){var r=new FileReader();r.onload=function(ev){cb(ev.target.result);};r.readAsDataURL(files[i]);}}
function handleFilesSingle(files,cb){if(files[0]){var r=new FileReader();r.onload=function(ev){cb(ev.target.result);};r.readAsDataURL(files[0]);}}

function exportAll(){var data={reports:reports,complaints:complaints,transJobs:transJobs,completeJobs:completeJobs,chatMsgs:chatMsgs,workers:workersList,invoices:invoices};var blob=new Blob([JSON.stringify(data)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='backup.json';a.click();}
function importAll(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d.complaints){complaints=d.complaints;localStorage.setItem('uh_comp',JSON.stringify(complaints));}if(d.transJobs){transJobs=d.transJobs;localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));}if(d.chatMsgs){chatMsgs=d.chatMsgs;localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));}showToast('Imported');renderContent();}catch(err){alert('Invalid file');}};r.readAsText(f);}

function startLiveSync(){if(!db)return;try{db.collection('complaints').onSnapshot(function(s){s.docChanges().forEach(function(ch){if(ch.type==='added'){var d=ch.doc.data();if(!complaints.find(x=>x.id==d.id)){complaints.unshift(d);localStorage.setItem('uh_comp',JSON.stringify(complaints));if(role)renderContent();}}});});db.collection('transJobs').onSnapshot(function(s){s.docChanges().forEach(function(ch){if(ch.type==='added'){var d=ch.doc.data();if(!transJobs.find(x=>x.id==d.id)){transJobs.unshift(d);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));if(role)renderContent();}}});});db.collection('chatMsgs').onSnapshot(function(s){s.docChanges().forEach(function(ch){if(ch.type==='added'){var d=ch.doc.data();if(!chatMsgs.find(x=>x.id==d.id)){chatMsgs.push(d);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));if(curTab==='chat')renderChatList();var to=(d.to||'').toLowerCase();var cur=(localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'').toLowerCase();if(to==='all'||to.indexOf(cur)!==-1){showNotif('New Message from '+d.name,d.msg||'Media');}}});});}catch(e){}}

// Delete helpers
function deleteComplaint(id){if(!confirm('Delete?'))return;complaints=complaints.filter(x=>x.id!=id);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudDelete('complaints','id',id);renderContent();}
function deleteTrans(id){if(!confirm('Delete?'))return;transJobs=transJobs.filter(x=>x.id!=id);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudDelete('transJobs','id',id);renderContent();}
function viewJobPhotos(id){var j=complaints.find(x=>x.id==id);if(!j||!j.photos||!j.photos.length){alert('No photos');return;}var html='<div class="card">';for(var i=0;i<j.photos.length;i++){html+='<img src="'+j.photos[i]+'" style="width:100px;height:100px;object-fit:cover;margin:4px;border-radius:8px" onclick="viewPic(this.src)">';}html+='</div>';var a=document.getElementById('publicViewArea');if(a)a.innerHTML=html;else alert('Photos: '+j.photos.length);}
function filterActiveJobs(){var q=(document.getElementById('activeSearch')?.value||'').toLowerCase();var list=document.getElementById('activeJobsList');if(!list)return;var h='';for(var i=0;i<complaints.length;i++){var c=complaints[i];if((c.chassis||'').toLowerCase().includes(q)||(c.location||'').toLowerCase().includes(q)){h+='<div class="card folder"><b>'+c.chassis+'</b><br>'+(c.location||'')+'<br>'+(c.issue||'')+'</div>';}}list.innerHTML=h;}
