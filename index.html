function initHomeUpload(){function h(files){if(!files||!files.length)return;for(var i=0;i<files.length;i++){if(files[i].size>3145728){showToast('Large file skipped');continue;}var r=new FileReader();r.onload=function(ev){homePhotos.push(ev.target.result);renderHomePreview();};r.readAsDataURL(files[i]);}function vh(files){for(var i=0;i<files.length;i++){var r=new FileReader();r.onload=function(ev){homeVideos.push(ev.target.result);renderHomePreview();};r.readAsDataURL(files[i]);}}var ac=document.getElementById('homeCam');var al=document.getElementById('homeLib');var av=document.getElementById('homeVid');var avl=document.getElementById('homeVidLib');if(ac)ac.addEventListener('change',e=>h(e.target.files));if(al)al.addEventListener('change',e=>h(e.target.files));if(av)av.addEventListener('change',e=>vh(e.target.files));if(avl)avl.addEventListener('change',e=>vh(e.target.files));}function renderHomePreview(){var box=document.getElementById('homePrevBox');if(!box)return;var h='';for(var i=0;i<homePhotos.length;i++)h+='<div style="position:relative;display:inline-block"><img src="'+homePhotos[i]+'" style="width:70px;height:70px;border-radius:10px;margin:2px"><button onclick="homePhotos.splice('+i+',1);renderHomePreview()" style="position:absolute;top:0;right:0;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px">x</button></div>';for(var j=0;j<homeVideos.length;j++)h+='<div style="position:relative;display:inline-block"><video src="'+homeVideos[j]+'" style="width:70px;height:70px;border-radius:10px;margin:2px" muted></video><button onclick="homeVideos.splice('+j+',1);renderHomePreview()" style="position:absolute;top:0;right:0;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px">x</button></div>';box.innerHTML=h||'Preview';}
function renderHomes(){var sel=document.getElementById('selCompany');var q=(document.getElementById('homeSearch')?.value||'').toLowerCase();if(!sel)return;var comp=sel.value;var list=companyHomes[comp]||[];var out=document.getElementById('homesList');if(!out)return;var html='';for(var i=0;i<list.length;i++){var h=list[i];if(q &&!(h.chassis.toLowerCase().includes(q)||(h.tenant||'').toLowerCase().includes(q)||(h.location||'').toLowerCase().includes(q)))continue;var media='';if(h.photos){for(var p=0;p<h.photos.length;p++)media+='<img src="'+h.photos[p]+'" style="width:80px;height:80px;border-radius:10px;margin:2px;border:2px solid #8d6e63" onclick="viewPic(this.src)">';}if(h.videos){for(var v=0;v<h.videos.length;v++)media+='<video src="'+h.videos[v]+'" controls style="width:80px;height:80px;border-radius:10px;margin:2px"></video>';}html+='<div class="card" style="border:2px solid #6d4c41"><b>CHASSIS: '+h.chassis+'</b><br><b>Company:</b> '+(h.company||comp)+'<br><b>Location:</b> '+(h.location||'')+'<br><b>Address:</b> '+(h.addr||'')+'<br><b>Tenant:</b> '+(h.tenant||'')+'<br><b>Phone:</b> '+(h.phone||'')+'<br><b>Postcode:</b> '+(h.postcode||'')+'<br><div style="display:flex;flex-wrap:wrap;background:#fff8e1;padding:6px;border-radius:12px;margin:6px 0">'+media+'</div><button class="btn2" onclick="editHome(\''+comp+'\','+i+')">Edit</button> <button class="btn2" style="color:red" onclick="delHome(\''+comp+'\','+i+')">Delete</button> <button class="btn2" onclick="shareHome(\''+comp+'\','+i+')">Share</button></div>';}out.innerHTML=html||'<div class="card">No homes</div>';}
function editHome(comp,i){var h=companyHomes[comp][i];var box=document.getElementById('editHomeBox');box.style.display='block';box.innerHTML='<h3>Edit Home</h3><input id="ehChassis" value="'+h.chassis+'"><input id="ehLocation" value="'+(h.location||'')+'"><input id="ehAddr" value="'+(h.addr||'')+'"><input id="ehTenant" value="'+(h.tenant||'')+'"><input id="ehPhone" value="'+(h.phone||'')+'"><input id="ehPost" value="'+(h.postcode||'')+'"><input id="ehCompany" value="'+(h.company||'')+'"><button class="btn" onclick="saveEditHome(\''+comp+'\','+i+')">Save</button> <button class="btn2" onclick="document.getElementById(\'editHomeBox\').style.display=\'none\'">Close</button>';}
function saveEditHome(comp,i){var h=companyHomes[comp][i];h.chassis=document.getElementById('ehChassis').value;h.location=document.getElementById('ehLocation').value;h.addr=document.getElementById('ehAddr').value;h.tenant=document.getElementById('ehTenant').value;h.phone=document.getElementById('ehPhone').value;h.postcode=document.getElementById('ehPost').value;h.company=document.getElementById('ehCompany').value;localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));document.getElementById('editHomeBox').style.display='none';renderHomes();}
function delHome(comp,i){if(confirm('Delete?')){var ch=companyHomes[comp][i].chassis;companyHomes[comp].splice(i,1);localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));cloudDelete('companyHomes','chassis',ch);renderHomes();}}
function shareHome(comp,i){var h=companyHomes[comp][i];var txt='Home: '+h.chassis+' Tenant:'+h.tenant+' Phone:'+h.phone+' Addr:'+h.addr;if(navigator.share)navigator.share({title:h.chassis,text:txt});else{prompt('Copy:',txt);}}
function renderWorkersList(){var box=document.getElementById('workersList');if(!box)return;var html='';for(var w in workers){var days=workers[w].days||[];var cnt=days.length;html+='<div class="card" style="border:2px solid #6d4c41"><b>'+w+'</b> - Days Worked: <span style="background:#7a4a2e;color:#fff;padding:4px 10px;border-radius:20px;font-weight:bold">'+cnt+'</span> Total Reports: '+workers[w].reports.length+'<br><small>Dates: '+(days.join(', ')||'none')+'</small><br><button class="btn2" onclick="viewWorkerDays(\''+w+'\')">View Days</button> <button class="btn2" style="color:red" onclick="delWorker(\''+w+'\')">Delete Worker</button></div>';}box.innerHTML=html||'No workers';}function viewWorkerDays(name){var w=workers[name];if(!w)return;alert(name+' Days: '+(w.days||[]).join(', ')+'\nTotal: '+(w.days||[]).length);}
function addWorker(){var n=document.getElementById('newWorkerName').value.trim();if(!n)return;if(!workers[n])workers[n]={name:n,reports:[],days:[]};localStorage.setItem('uh_workers',JSON.stringify(workers));showToast('Worker added');renderWorkersList();}
function delWorker(name){if(confirm('Delete worker '+name+'?')){delete workers[name];localStorage.setItem('uh_workers',JSON.stringify(workers));renderWorkersList();}}
function adminCreateComplaint(){var p=document.getElementById('acPhone').value.trim();if(!p){alert('Phone required boss');return;}var o={name:document.getElementById('acName').value.trim(),chassis:document.getElementById('acChassis').value.trim(),location:document.getElementById('acLocation').value.trim(),plot:document.getElementById('acPlot').value.trim(),addr:document.getElementById('acAddr').value.trim(),issue:document.getElementById('acIssue').value.trim(),assignedTo:document.getElementById('acAssign').value.trim(),phone:p,emergency:document.getElementById('acEmerg').checked,date:new Date().toISOString().split('T')[0],time:new Date().toLocaleTimeString(),photos:compPhotos.slice(),completed:false};if(!o.chassis||!o.issue||!o.name){alert('Fill * fields');return;}complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudAdd('complaints',o);compPhotos=[];var b=document.getElementById('compPrevBox');if(b)b.innerHTML='Preview';showToast('Created');renderContent();}
function viewPic(src){document.getElementById('viewImg').src=src;document.getElementById('viewModal').style.display='block';}
function showToast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function closeAbout(){closeLogin();}
function showAbout(){var m=document.getElementById('aboutModal');if(m){m.style.display='block';var txt=document.getElementById('aboutContent');if(txt)txt.innerHTML='<h3 style="color:#7a4a2e">About Unique Haven House Ltd</h3><p style="white-space:pre-wrap">'+(aboutData.text||'We provide quality park homes and services.')+'</p>'+(aboutData.photo?'<img src="'+aboutData.photo+'" style="width:100%;border-radius:14px;margin-top:10px">':'');}}
document.addEventListener('DOMContentLoaded',function(){var y=document.getElementById('curYear');if(y)y.textContent=new Date().getFullYear();showAbout();});
function closePubInvModal(){document.getElementById('publicInvoiceModal').style.display='none';}
function checkPublicInvoicePw(){var v=document.getElementById('publicInvoicePwInput').value.trim();if(v===(pw.publicInvoice||'public123')||v===pw.invoice||v===pw.admin){document.getElementById('publicInvoicePwBox').style.display='none';document.getElementById('publicInvoiceContent').style.display='block';}else{alert('Wrong password - ask admin');}}
function renderPublicAbout(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class="card"><h3>About</h3><p style="white-space:pre-wrap">'+(aboutData.text||'')+'</p>'+(aboutData.photo?'<img src="'+aboutData.photo+'" style="width:100%;border-radius:14px">':'')+'</div>';}
function renderPublicSearch(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class="card"><h3>Search</h3><input id="publicSearchInput" placeholder="Search chassis, address, tenant..." oninput="doPublicSearch()"><div id="publicSearchResults"></div></div>';}
function doPublicSearch(){var q=(document.getElementById('publicSearchInput').value||'').toLowerCase();var res=document.getElementById('publicSearchResults');if(!q){res.innerHTML='';return;}var html='';for(var i=0;i<complaints.length;i++){var c=complaints[i];if(c.completed)continue;if(c.chassis.toLowerCase().includes(q)||(c.addr||'').toLowerCase().includes(q)||(c.name||'').toLowerCase().includes(q))html+='<div class="card"><b>Complaint:</b> '+c.chassis+' - '+c.issue+'</div>';}for(var j=0;j<transJobs.length;j++){var tj=transJobs[j];if(tj.done)continue;if(tj.chassis.toLowerCase().includes(q))html+='<div class="card"><b>Transport:</b> '+tj.chassis+'</div>';}for(var k in companyHomes){var lst=companyHomes[k];for(var l=0;l<lst.length;l++){var hh=lst[l];if(hh.chassis.toLowerCase().includes(q))html+='<div class="card"><b>Home:</b> '+hh.chassis+' '+hh.tenant+'</div>';}}res.innerHTML=html||'<div class="card">No results</div>';}
</script>
</body>
