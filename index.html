function getWorkerDayCount(n){if(!n)return 0;var days={};var nn=n.toLowerCase().trim();for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nn||rn.includes(nn)||nn.includes(rn)){var d=(reports[i].date||'').trim();if(d)days[d]=true;}}return Object.keys(days).length;}

function renderInvoices(){var l=document.getElementById('invoicesList');if(!l)return;var q=(document.getElementById('invFolderSearch')&&document.getElementById('invFolderSearch').value||'').toLowerCase();var h='';for(var ch in invoices){if(q&&ch.toLowerCase().indexOf(q)===-1){var match=false;for(var i=0;i<invoices[ch].length;i++){if((invoices[ch][i].person||'').toLowerCase().includes(q)||(invoices[ch][i].company||'').toLowerCase().includes(q)){match=true;break;}}if(!match)continue;}var tot=0;var unp=0;for(var i=0;i<invoices[ch].length;i++){tot+=Number(invoices[ch][i].amt)||0;if(!invoices[ch][i].paid)unp+=Number(invoices[ch][i].amt)||0;}h+='<div class="folder"><div style="display:flex;justify-content:space-between;align-items:center" onclick="toggleF(\''+ch+'\')"><b>📁 '+ch+'</b><span>'+invoices[ch].length+' inv</span></div><div style="font-size:12px">Total: £'+tot.toFixed(2)+' Unpaid: £'+unp.toFixed(2)+'</div><div id="fold_'+ch+'" style="display:none">';for(var i=0;i<invoices[ch].length;i++){var inv=invoices[ch][i];var m='';if(inv.photos){for(var p=0;p<inv.photos.length;p++)m+='<img src="'+inv.photos[p]+'" style="width:70px;height:70px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}h+='<div class="card" style="margin:6px 0"><b>'+inv.desc+'</b> £'+inv.amt+' '+ (inv.paid?'<span class="badge paid">PAID</span>':'<span class="badge unpaid">UNPAID</span>')+'<br>Company:'+inv.company+'<br>Person:'+inv.person+'<br>Date:'+inv.date+'<br><div style="display:flex;flex-wrap:wrap">'+m+'</div><br><button class="btn2" onclick="togPaid(\''+ch+'\','+i+')">'+(inv.paid?'Mark Unpaid':'Mark Paid')+'</button> <button class="btn2" onclick="editInvoice(\''+ch+'\','+i+')">Edit</button> <button class="btn2" style="color:red" onclick="delInv(\''+ch+'\','+i+')">Del</button></div>';}h+='</div></div>';}l.innerHTML=h||'<div class="card">No invoices</div>';}

function editRefurbDone(i){var nn=prompt('Edit Note:',refurbs[i].doneNote||'');if(nn===null)return;refurbs[i].doneNote=nn;localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));renderContent();}
function editRefurb(i){var r=refurbs[i];var nc=prompt('Edit Chassis:',r.chassis);if(nc===null)return;r.chassis=nc;var nl=prompt('Edit Location:',r.location);if(nl!==null)r.location=nl;localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));renderContent();}
function initAboutMediaUpload(){function hf(files,type){for(var i=0;i<files.length;i++){(function(file){var r=new FileReader();r.onload=function(ev){if(type==='photo'){aboutTmpPhotos.push(ev.target.result);}else{aboutTmpVideos.push(ev.target.result);}renderAboutPrev();};r.readAsDataURL(file);})(files[i]);}}function renderAboutPrev(){var b=document.getElementById('aboutMediaPrev');var e=document.getElementById('aboutExistingList');if(b){var h='';for(var i=0;i<aboutTmpPhotos.length;i++)h+='<img src="'+aboutTmpPhotos[i]+'" style="width:70px;height:70px;border-radius:10px;margin:3px;border:2px solid #00c853">';for(var j=0;j<aboutTmpVideos.length;j++)h+='<video src="'+aboutTmpVideos[j]+'" style="width:70px;height:70px;border-radius:10px;margin:3px;border:2px solid #2196f3" controls></video>';b.innerHTML=h||'New Preview';}if(e){var html='';var ph=aboutData.photos||[];for(var k=0;k<ph.length;k++){html+='<div style="display:inline-block;position:relative"><img src="'+ph[k]+'" style="width:70px;height:70px;border-radius:10px;margin:3px"><button onclick="delAboutPhoto('+k+')" style="position:absolute;top:0;right:0;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px">x</button></div>';}var vd=aboutData.videos||[];for(var l=0;l<vd.length;l++){html+='<div style="display:inline-block;position:relative"><video src="'+vd[l]+'" style="width:70px;height:70px;border-radius:10px;margin:3px" controls></video><button onclick="delAboutVideo('+l+')" style="position:absolute;top:0;right:0;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px">x</button></div>';}e.innerHTML=html||'No existing';}}window.renderAboutPrev=renderAboutPrev;var a=document.getElementById('aboutCamPhoto');var b=document.getElementById('aboutLibPhoto');var c=document.getElementById('aboutCamVideo');var d=document.getElementById('aboutLibVideo');if(a)a.addEventListener('change',function(e){hf(e.target.files,'photo');});if(b)b.addEventListener('change',function(e){hf(e.target.files,'photo');});if(c)c.addEventListener('change',function(e){hf(e.target.files,'video');});if(d)d.addEventListener('change',function(e){hf(e.target.files,'video');});renderAboutPrev();}
function delAboutPhoto(i){if(confirm('Delete photo?')){aboutData.photos.splice(i,1);localStorage.setItem('uh_about',JSON.stringify(aboutData));initAboutMediaUpload();renderAbout();}}
function delAboutVideo(i){if(confirm('Delete video?')){aboutData.videos.splice(i,1);localStorage.setItem('uh_about',JSON.stringify(aboutData));initAboutMediaUpload();renderAbout();}}
function clearAboutMedia(){if(confirm('Clear all media?')){aboutData.photos=[];aboutData.videos=[];aboutTmpPhotos=[];aboutTmpVideos=[];localStorage.setItem('uh_about',JSON.stringify(aboutData));initAboutMediaUpload();renderAbout();}}
function saveAbout(){var txt=document.getElementById('aboutText').value;aboutData.text=txt.replace(/\n/g,'<br>');if(!aboutData.photos)aboutData.photos=[];if(!aboutData.videos)aboutData.videos=[];for(var i=0;i<aboutTmpPhotos.length;i++)aboutData.photos.push(aboutTmpPhotos[i]);for(var j=0;j<aboutTmpVideos.length;j++)aboutData.videos.push(aboutTmpVideos[j]);aboutTmpPhotos=[];aboutTmpVideos=[];localStorage.setItem('uh_about',JSON.stringify(aboutData));showToast('About Saved');renderAbout();}
function startLive(){try{if(!db)return;db.collection('reports').onSnapshot(function(s){var a=[];s.forEach(function(d){a.push(d.data())});if(a.length>0){if(a.length>lastCounts.reports&&lastCounts.reports>0){triggerNotify('New Report',a[0].name+' '+a[0].chassis);}lastCounts.reports=a.length;reports=a;localStorage.setItem('uh_reports',JSON.stringify(reports));if(document.getElementById('workersList'))renderWorkersList();if(document.getElementById('myReportsList'))renderMyReports();if(document.getElementById('myDaysList'))renderMyDays();}});db.collection('complaints').onSnapshot(function(s){var a=[];s.forEach(function(d){a.push(d.data())});if(a.length>0){if(a.length>lastCounts.complaints&&lastCounts.complaints>0){triggerNotify('New Job',a[0].chassis);}lastCounts.complaints=a.length;complaints=a;localStorage.setItem('uh_comp',JSON.stringify(complaints));}});db.collection('transJobs').onSnapshot(function(s){var a=[];s.forEach(function(d){a.push(d.data())});if(a.length>0){if(a.length>lastCounts.trans&&lastCounts.trans>0){triggerNotify('New Transport',a[0].chassis);}lastCounts.trans=a.length;transJobs=a;localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));}});db.collection('chatMsgs').onSnapshot(function(s){var a=[];s.forEach(function(d){a.push(d.data())});if(a.length>0){if(a.length>lastCounts.chat&&lastCounts.chat>0){var last=a[a.length-1];var cur=(localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'').toLowerCase();var toLow=(last.to||'').toLowerCase();var isForMe=toLow===''||toLow==='all'||toLow.split(',').map(function(x){return x.trim();}).includes(cur);if(isForMe){triggerNotify((toLow===''?'Group':'Private')+' Chat',last.name+': '+(last.msg||'').substring(0,30));}}lastCounts.chat=a.length;chatMsgs=a;localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));if(document.getElementById('adminChatList'))renderChatList();}});}catch(e){}}setTimeout(function(){lastCounts={reports:reports.length,complaints:complaints.length,trans:transJobs.length,chat:chatMsgs.length};startLive();},2000);
window.addEventListener('load',function(){loadInvoicesSafe();setTimeout(function(){initPubInvUpload();lastCounts={reports:reports.length,complaints:complaints.length,trans:transJobs.length,chat:chatMsgs.length};},800);});
</script></body></html>
