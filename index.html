<script>
var firebaseConfig={apiKey:"AIzaSyB3u3U09Nq5MZ5n2v5j9Z4Q7k8L1M2N3O4",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
var db=null;try{if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig);db=firebase.firestore();}}catch(e){}
var reports=JSON.parse(localStorage.getItem('uh_reports')||'[]');var complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');var transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');var completeJobs=JSON.parse(localStorage.getItem('uh_complete')||'[]');var chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');var workersList=JSON.parse(localStorage.getItem('uh_workers')||'[]');var cp12List=JSON.parse(localStorage.getItem('uh_cp12')||'[]');var refurbs=JSON.parse(localStorage.getItem('uh_refurbs')||'[]');var companyHomes=JSON.parse(localStorage.getItem('uh_companyHomes')||'{}');var customCompanyTabs=JSON.parse(localStorage.getItem('uh_customTabs')||'[]');var aboutData=JSON.parse(localStorage.getItem('uh_about')||'{"text":"UNIQUE HAVEN HOUSE\\nWE BUILD UR DREAM","photo":""}');var pw=JSON.parse(localStorage.getItem('uh_pw')||'{"admin":"admin123","worker":"worker123","transport":"trans123","invoice":"inv123"}');var role=localStorage.getItem('uh_role')||'';var curTab=localStorage.getItem('uh_curTab')||'dash';var invoices={};var invTmp=[];var homePhotos=[];var homeVideos=[];var compPhotos=[];var transPhotos=[];var aboutTmp='';var pubInvTmp=[];

function loadInvoicesSafe(){try{var main=localStorage.getItem('uh_invoices');if(main&&main.length>10){invoices=JSON.parse(main);} }catch(e){invoices={};}}loadInvoicesSafe();
function saveInvoicesSafe(){try{var str=JSON.stringify(invoices);localStorage.setItem('uh_invoices',str);localStorage.setItem('uh_invoices_b1',str);if(db){db.collection('invoices_backup').doc('all').set({data:invoices}).catch(()=>{});}}catch(e){}}
function cloudAdd(col,obj){if(!db)return;db.collection(col).add(obj).catch(()=>{});}function cloudDelete(col,field,val){if(!db)return;db.collection(col).where(field,'==',val).get().then(s=>{s.forEach(d=>d.ref.delete());}).catch(()=>{});}
function showToast(m){var t=document.getElementById('successToast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}
function calcUnpaid(){var tot=0;for(var k in invoices){for(var i=0;i<invoices[k].length;i++){if(!invoices[k][i].paid)tot+=Number(invoices[k][i].amt)||0;}}return tot.toFixed(2);}
function countInvoicesPhotos(){var inv=0;var tot=0;var unpaid=0;for(var k in invoices){inv+=invoices[k].length;for(var i=0;i<invoices[k].length;i++){var a=Number(invoices[k][i].amt)||0;tot+=a;if(!invoices[k][i].paid)unpaid+=a;}}return{inv:inv,total:tot,unpaid:unpaid};}
function getWorkerDayCount(name){var days={};for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===name.toLowerCase()){var d=reports[i].date||'';if(d)days[d]=true;}}return Object.keys(days).length;}function getWorkerDaysList(name){var days={};for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===name.toLowerCase()){var d=reports[i].date||'';if(d)days[d]=true;}}return Object.keys(days);}
function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase().trim();if(!q)return;var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>Search: '+q+'</h3></div>';var found=false;for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">'+complaints[i].chassis+' '+(complaints[i].issue||'')+'</div>';}}for(var i=0;i<transJobs.length;i++){if((transJobs[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">Transport '+transJobs[i].chassis+'</div>';}}if(!found)html+='<div class="card">No result</div>';area.innerHTML=html;}
function goAdmin(){var p=prompt('Admin Password');if(p===pw.admin){role='admin';localStorage.setItem('uh_role','admin');document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function goWorker(){var p=prompt('Worker Password');if(p===pw.worker){var name=prompt('Your Name');if(!name)return;role='worker';localStorage.setItem('uh_role','worker');localStorage.setItem('uh_curW',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function goTransport(){var p=prompt('Transport Password');if(p===pw.transport){var name=prompt('Driver Name');if(!name)return;role='transport';localStorage.setItem('uh_role','transport');localStorage.setItem('uh_curT',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function backHome(){document.getElementById('app').style.display='none';document.getElementById('outside').style.display='block';document.getElementById('pageAbout').style.display='none';document.getElementById('publicViewArea').innerHTML='';role='';localStorage.removeItem('uh_role');}
function initTabs(){var tabsDiv=document.getElementById('tabs');var html='';if(role==='admin'){html+='<button class="btn2" onclick="setTab(\'dash\')">DASH</button>';html+='<button class="btn2" onclick="setTab(\'reports\')">REPORTS</button>';html+='<button class="btn2" onclick="setTab(\'activeJobs\')">ACTIVE</button>';html+='<button class="btn2" onclick="setTab(\'completeJobs\')">COMPLETE</button>';html+='<button class="btn2" style="background:#ff9800;color:#fff;border:2px solid #000" onclick="setTab(\'transportForm\')">+ TRANSPORT FORM</button>';html+='<button class="btn2" onclick="setTab(\'transportJobs\')">TRANSPORT</button>';html+='<button class="btn2" onclick="setTab(\'transportDone\')">TRANS DONE</button>';html+='<button class="btn2" onclick="setTab(\'refurb\')">REFURB</button>';html+='<button class="btn2" onclick="setTab(\'refurbDone\')">REFURB DONE</button>';html+='<button class="btn2" onclick="setTab(\'cp12\')">CP12</button>';html+='<button class="btn2" onclick="setTab(\'invoices\')">INVOICES</button>';html+='<button class="btn2" onclick="setTab(\'companyHomes\')">HOMES</button>';html+='<button class="btn2" onclick="setTab(\'complaints\')">COMPLAINTS</button>';html+='<button class="btn2" onclick="setTab(\'workers\')">WORKERS</button>';html+='<button class="btn2" onclick="setTab(\'publicChatAdmin\')">CHAT</button>';html+='<button class="btn2" onclick="setTab(\'aboutEdit\')">ABOUT</button>';html+='<button class="btn2" onclick="setTab(\'settings\')">SETTINGS</button>';}else if(role==='worker'){html+='<button class="btn2" onclick="setTab(\'myJobs\')">MY JOBS</button>';html+='<button class="btn2" onclick="setTab(\'addReport\')">ADD REPORT</button>';html+='<button class="btn2" onclick="setTab(\'myDays\')">MY DAYS</button>';}else if(role==='transport'){html+='<button class="btn2" onclick="setTab(\'transportJobs\')">JOBS</button>';html+='<button class="btn2" onclick="setTab(\'transportDone\')">DONE</button>';}tabsDiv.innerHTML=html;}
function setTab(t){curTab=t;localStorage.setItem('uh_curTab',t);renderContent();}
function refreshPubInvFolders(){var sel=document.getElementById('pubInvFolderSelect');if(!sel)return;var opts='<option value="">-- Select Existing Folder --</option>';var keys=Object.keys(invoices);for(var i=0;i<keys.length;i++){opts+='<option value="'+keys[i]+'">'+keys[i]+' ('+invoices[keys[i]].length+')</option>';}sel.innerHTML=opts;sel.onchange=function(){if(this.value)document.getElementById('pubInvChassis').value=this.value;};}function renderActive(){var list=document.getElementById('activeList');if(!list)return;var html='';if(complaints.filter(c=>!c.completed).length===0)html+='<div class="card">No active</div>';for(var i=0;i<complaints.length;i++){var c=complaints[i];if(c.completed)continue;var media='';if(c.photos){for(var p=0;p<c.photos.length;p++)media+='<img src="'+c.photos[p]+'" style="width:80px;height:80px;border-radius:10px;margin:3px">';}html+='<div class="card"><b>CHASSIS: '+c.chassis+'</b><br><b>NAME:</b> '+(c.name||'')+'<br><b>PHONE:</b> '+(c.phone||'')+'<br><b>ISSUE:</b> '+(c.issue||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="compDone('+i+')">Done</button></div>';}list.innerHTML=html;}
function renderT(){var list=document.getElementById('tjList');if(!list)return;var html='';var pending=transJobs.filter(j=>!j.done&&j.status!=='done'&&!j.completed);if(pending.length===0)html+='<div class="card">No pending</div>';for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(j.done||j.status==='done'||j.completed)continue;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px">';}html+='<div class="card" style="border:2px solid #ff9800"><b>'+j.chassis+'</b><br><b>Pickup:</b> '+(j.pickupAddr||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="markDone('+i+')">Done</button></div>';}list.innerHTML=html;}
function renderTDone(){var list=document.getElementById('tjDone');if(!list)return;var html='';var doneJobs=transJobs.filter(j=>j.done||j.status==='done'||j.completed);if(doneJobs.length===0)html+='<div class="card">No done</div>';for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(!j.done&&j.status!=='done'&&!j.completed)continue;html+='<div class="card" style="border-left:5px solid #00c853"><b>DONE '+j.chassis+'</b><br><b>Driver:</b> '+(j.assignedTo||'')+'<br><b>Completed:</b> '+(j.completedDate||'')+'</div>';}list.innerHTML=html;}
function submitAdminT(){var j={chassis:document.getElementById('atChassis').value.trim(),plot:document.getElementById('atPlot').value.trim(),tenant:document.getElementById('atTenant').value.trim(),name:document.getElementById('atTenant').value.trim(),phone:document.getElementById('atPhone').value.trim(),pickupAddr:document.getElementById('atPickupAddr').value.trim(),pickupPostcode:document.getElementById('atPickupPost').value.trim(),pickupDate:document.getElementById('atPickupDate').value.trim(),deliveryAddr:document.getElementById('atDeliverAddr').value.trim(),deliveryPostcode:document.getElementById('atDeliverPost').value.trim(),deliveryDate:document.getElementById('atDeliverDate').value.trim(),assignedTo:document.getElementById('atAssign').value.trim(),driver:document.getElementById('atAssign').value.trim(),photos:transPhotos.slice(),done:false,completed:false,status:'pending',date:new Date().toLocaleDateString()};if(!j.chassis||!j.assignedTo){alert('Chassis + Driver needed');return;}transJobs.unshift(j);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudAdd('transJobs',j);transPhotos=[];var box=document.getElementById('transPrevBox');if(box)box.innerHTML='Preview';showToast('Transport Created');renderContent();}
function markDone(i){transJobs[i].done=!transJobs[i].done;transJobs[i].completed=transJobs[i].done;transJobs[i].status=transJobs[i].done?'done':'pending';if(transJobs[i].done)transJobs[i].completedDate=new Date().toLocaleDateString();localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));renderContent();}
function delTrans(i){if(confirm('Delete?')){transJobs.splice(i,1);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));renderContent();}}
function initPubInvUpload(){function h(files){for(var i=0;i<files.length;i++){(function(f){var r=new FileReader();r.onload=function(ev){pubInvTmp.push(ev.target.result);renderPubPrev();};r.readAsDataURL(f);})(files[i]);}}function renderPubPrev(){var box=document.getElementById('pubInvPrevBox');if(!box)return;var html='';for(var i=0;i<pubInvTmp.length;i++)html+='<img src="'+pubInvTmp[i]+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';box.innerHTML=html;}window.renderPubPrev=renderPubPrev;var a=document.getElementById('pubInvCam');var b=document.getElementById('pubInvLib');if(a)a.addEventListener('change',function(e){h(e.target.files);});if(b)b.addEventListener('change',function(e){h(e.target.files);});}
function initTransUpload(){function h(files){for(var i=0;i<files.length;i++){(function(f){var r=new FileReader();r.onload=function(ev){transPhotos.push(ev.target.result);renderTransPrev();};r.readAsDataURL(f);})(files[i]);}}function renderTransPrev(){var box=document.getElementById('transPrevBox');if(!box)return;var html='';for(var i=0;i<transPhotos.length;i++)html+='<img src="'+transPhotos[i]+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';box.innerHTML=html||'Preview';}var a=document.getElementById('transCam');var b=document.getElementById('transLib');if(a)a.addEventListener('change',function(e){h(e.target.files);});if(b)b.addEventListener('change',function(e){h(e.target.files);});}
function initInvUpload(){function h(files){for(var i=0;i<files.length;i++){(function(f){var r=new FileReader();r.onload=function(ev){invTmp.push(ev.target.result);renderInvPrev();};r.readAsDataURL(f);})(files[i]);}}function renderInvPrev(){var box=document.getElementById('invPrevBox');if(!box)return;var html='';for(var i=0;i<invTmp.length;i++)html+='<img src="'+invTmp[i]+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';box.innerHTML=html;}window.renderInvPrev=renderInvPrev;var a=document.getElementById('invCam');var b=document.getElementById('invLib');if(a)a.addEventListener('change',function(e){h(e.target.files);});if(b)b.addEventListener('change',function(e){h(e.target.files);});}// FIXED PUBLIC INVOICE SUBMIT - PHOTOS NOW SHOW IN ADMIN
function submitPublicInvoice(){
var chassis=document.getElementById('pubInvChassis').value.trim();
var company=document.getElementById('pubInvCompany').value.trim();
var person=document.getElementById('pubInvPerson').value.trim();
var amt=parseFloat(document.getElementById('pubInvAmt').value)||0;
var desc=document.getElementById('pubInvDesc').value.trim()||'Invoice';
if(!chassis||!company||!person||!amt){alert('All fields needed');return;}
if(!invoices[chassis])invoices[chassis]=[];
var obj={chassis:chassis,company:company,person:person,amt:amt,desc:desc,photos:pubInvTmp.slice(),date:new Date().toLocaleDateString(),paid:false,fromPublic:true};
invoices[chassis].unshift(obj);
saveInvoicesSafe();
pubInvTmp=[];document.getElementById('pubInvPrevBox').innerHTML='';
document.getElementById('pubInvChassis').value='';document.getElementById('pubInvCompany').value='';document.getElementById('pubInvPerson').value='';document.getElementById('pubInvAmt').value='';document.getElementById('pubInvDesc').value='';
showToast('Submitted - Admin will see photos');
refreshPubInvFolders();showMyPublicInvoices();
}

function addInv(){var chassis=document.getElementById('invChassis').value.trim();var company=document.getElementById('invCompany').value.trim();var person=document.getElementById('invPerson').value.trim();var amt=parseFloat(document.getElementById('invAmt').value)||0;var desc=document.getElementById('invDesc').value.trim()||'Invoice';if(!chassis){alert('Chassis needed');return;}if(!invoices[chassis])invoices[chassis]=[];var obj={chassis:chassis,company:company,person:person,amt:amt,desc:desc,photos:invTmp.slice(),date:new Date().toLocaleDateString(),paid:false};invoices[chassis].unshift(obj);saveInvoicesSafe();invTmp=[];document.getElementById('invPrevBox').innerHTML='';showToast('Invoice Added');renderContent();}
function togPaid(ch,idx){if(invoices[ch]&&invoices[ch][idx]){invoices[ch][idx].paid=!invoices[ch][idx].paid;saveInvoicesSafe();renderContent();}}
function delInv(ch,idx){if(confirm('Delete?')){if(invoices[ch]){invoices[ch].splice(idx,1);if(invoices[ch].length===0)delete invoices[ch];saveInvoicesSafe();renderContent();}}}
function toggleF(ch){var el=document.getElementById('fold_'+ch);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function showMyPublicInvoices(){var name=(document.getElementById('myInvNameSearch').value||'').toLowerCase().trim();if(!name){alert('Enter name');return;}var area=document.getElementById('myInvListArea');var html='';var total=0;var count=0;for(var k in invoices){for(var i=0;i<invoices[k].length;i++){var inv=invoices[k][i];if((inv.person||'').toLowerCase().includes(name)){count++;total+=Number(inv.amt)||0;var media='';if(inv.photos){for(var p=0;p<inv.photos.length;p++)media+='<img src="'+inv.photos[p]+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';}html+='<div class="card" style="border:1px solid '+(inv.paid?'green':'red')+'"><b>'+inv.chassis+'</b> '+inv.desc+' £'+inv.amt+'<br>'+media+'</div>';}}}area.innerHTML=html||'<div class="card">No invoices</div>';}function openPublicActive(){var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>ACTIVE JOBS PUBLIC</h3></div>';for(var i=0;i<complaints.length;i++){if(!complaints[i].completed)html+='<div class="card"><b>'+complaints[i].chassis+'</b> '+(complaints[i].issue||'')+'</div>';}area.innerHTML=html;}
function openPublicTransport(){var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>TRANSPORT PUBLIC</h3></div>';var pend=transJobs.filter(j=>!j.done);for(var i=0;i<pend.length;i++)html+='<div class="card"><b>'+pend[i].chassis+'</b> '+(pend[i].tenant||'')+'</div>';area.innerHTML=html;}
function openPublicRefurb(){var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>REFURB PUBLIC</h3></div>';for(var i=0;i<refurbs.length;i++){if(!refurbs[i].completed)html+='<div class="card"><b>'+refurbs[i].chassis+'</b> '+refurbs[i].location+'</div>';}area.innerHTML=html;}
function openPublicChat(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class="card"><h3>PUBLIC CHAT</h3><div id="chatBoxPublic" style="height:300px;overflow:auto;background:#fff8e1;padding:10px;border-radius:10px"></div><input id="pubChatName" placeholder="Name"><textarea id="pubChatMsg" placeholder="Message"></textarea><button class="btn" onclick="sendPublicChat()">SEND</button></div>';}
function openAbout(){document.getElementById('outside').style.display='none';document.getElementById('pageAbout').style.display='block';document.getElementById('aboutView').innerHTML=aboutData.text+(aboutData.photo?'<br><img src="'+aboutData.photo+'" style="width:100%">':'');}
function openPublicInvoice(){refreshPubInvFolders();document.getElementById('publicViewArea').scrollIntoView();}
function compDone(i){complaints.splice(i,1);localStorage.setItem('uh_comp',JSON.stringify(complaints));renderContent();}
function renderContent(){
var f=document.getElementById('content');var html='';
if(curTab==='dash'){var c=countInvoicesPhotos();html='<div class="card"><h3>Dashboard</h3>Reports:'+reports.length+' Transport:'+transJobs.length+' Complaints:'+complaints.length+' Invoices:'+c.inv+'</div><div class="totalBox">Unpaid £'+c.unpaid.toFixed(2)+' | Total £'+c.total.toFixed(2)+'</div>';}
if(curTab==='activeJobs'){html='<div class="card"><h3>Active Jobs</h3><div id="activeList"></div></div>';}
if(curTab==='transportJobs'){html='<div class="card"><h3>Transport Pending</h3><div id="tjList"></div></div>';}
if(curTab==='transportDone'){html='<div class="card"><h3>Transport Done</h3><div id="tjDone"></div></div>';}
if(curTab==='transportForm'){html='<div class="card" style="border:3px solid #ff9800"><h3>TRANSPORT FORM - ADMIN</h3><input id="atPickupAddr" placeholder="Pickup Address *"><input id="atPickupDate" type="date"><input id="atPickupPost" placeholder="Pickup Postcode *"><input id="atChassis" placeholder="Chassis *"><input id="atDeliverPost" placeholder="Delivery Postcode *"><input id="atTenant" placeholder="Tenant *"><input id="atDeliverAddr" placeholder="Delivery Address *"><input id="atPhone" placeholder="Phone *"><input id="atPlot" placeholder="Plot"><input id="atDeliverDate" type="date"><input id="atAssign" placeholder="Driver *"><div style="display:flex;gap:8px"><div style="flex:1"><label>Camera</label><input type="file" id="transCam" accept="image/*" capture="environment" multiple></div><div style="flex:1"><label>Library</label><input type="file" id="transLib" accept="image/*" multiple></div></div><div id="transPrevBox" style="border:2px dashed #8d6e63;padding:6px;background:#fff8e1;border-radius:12px;margin-top:8px">Preview</div><button class="btn" onclick="submitAdminT()">SUBMIT</button></div>';}if(curTab==='invoices'){
var folderOptions='<option value="">-- Select Folder --</option>';var keys=Object.keys(invoices);for(var ff=0;ff<keys.length;ff++){folderOptions+='<option value="'+keys[ff]+'">'+keys[ff]+' ('+invoices[keys[ff]].length+')</option>';}
var tot=countInvoicesPhotos();
html='<div class="totalBox">Unpaid £'+tot.unpaid.toFixed(2)+' | Total £'+tot.total.toFixed(2)+' | Inv:'+tot.inv+'</div><div class="card" style="border:2px solid #a1887f"><h3>Invoices - Admin (FIXED - Shows Public Photos)</h3><select id="invFolderSelect" onchange="if(this.value)document.getElementById(\'invChassis\').value=this.value;">'+folderOptions+'</select><input id="invChassis" placeholder="Chassis *"><input id="invCompany" placeholder="Company *"><input id="invPerson" placeholder="Person *"><input id="invAmt" type="number" step="0.01" placeholder="Amount £ *"><input id="invDesc" placeholder="Title"><div style="display:flex;gap:8px"><div style="flex:1"><label>Camera</label><input type="file" id="invCam" accept="image/*" capture="environment" multiple></div><div style="flex:1"><label>Library</label><input type="file" id="invLib" accept="image/*" multiple></div></div><div id="invPrevBox" style="display:flex;flex-wrap:wrap;gap:4px;border:2px dashed #8d6e63;padding:6px;border-radius:12px;background:#fff"></div><button class="btn" onclick="addInv()">+ Add Invoice</button></div>';
var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var ch=keys[k];var list=invoices[ch];var totAmt=0;for(var t=0;t<list.length;t++)totAmt+=Number(list[t].amt)||0;html+='<div class="folder"><b>📁 '+ch+'</b> '+list.length+' invoices £'+totAmt.toFixed(2)+'<br><button class="btn2" onclick="toggleF(\''+ch+'\')">Open</button><div id="fold_'+ch+'" style="display:none">';for(var j=0;j<list.length;j++){var inv=list[j];var media='';if(inv.photos){for(var p=0;p<inv.photos.length;p++)media+='<img src="'+inv.photos[p]+'" style="width:90px;height:90px;border-radius:10px;margin:3px;border:2px solid #8d6e63" onclick="window.open(this.src)">';}html+='<div style="background:#fff;padding:10px;margin:6px 0;border-radius:12px;border:1px solid '+(inv.paid?'green':'red')+'"><b>Chassis:</b> '+inv.chassis+'<br><b>Company:</b> '+inv.company+'<br><b>Person:</b> '+inv.person+' '+(inv.fromPublic?'<span style="background:#ff9800;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">PUBLIC</span>':'')+'<br><b>'+inv.desc+'</b> £'+inv.amt+' <span class="badge '+(inv.paid?'paid':'unpaid')+'">'+(inv.paid?'PAID':'UNPAID')+'</span><br><b>Date:</b> '+inv.date+'<br><div style="display:flex;flex-wrap:wrap;background:#fff8e1;padding:6px;border-radius:10px;margin-top:6px">'+media+'</div><br><button class="btn2" onclick="togPaid(\''+ch+'\','+j+')">Toggle Paid</button> <button class="btn2" onclick="delInv(\''+ch+'\','+j+')">Delete</button></div>';}html+='</div></div>';}
}
f.innerHTML=html;
if(curTab==='activeJobs')setTimeout(renderActive,100);
if(curTab==='transportJobs')setTimeout(renderT,100);
if(curTab==='transportDone')setTimeout(renderTDone,100);
if(curTab==='transportForm')setTimeout(initTransUpload,150);
if(curTab==='invoices'){setTimeout(function(){initInvUpload();refreshPubInvFolders();},150);}
}
window.addEventListener('load',function(){loadInvoicesSafe();setTimeout(function(){initPubInvUpload();refreshPubInvFolders();},800);});
</script></body></html>
