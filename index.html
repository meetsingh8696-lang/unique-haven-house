h3>SELECT ACCESS</h3><button class="btn" onclick="goAdmin()">ADMIN</button><button class="btn" onclick="goWorker()">WORKER</button><button class="btn" onclick="goTransport()">TRANSPORT</button><hr><div class="card" style="border:2px solid #8b5a2b;background:#fff8e1;text-align:left"><h3 style="color:#8b5a2b;text-align:center">🔍 SEARCH ANY JOB</h3><input id="outsideSearchInput" placeholder="Enter Chassis No..." oninput="outsideSearch()" style="font-size:16px;font-weight:bold"><button class="btn" onclick="outsideSearch()">SEARCH BY CHASSIS</button></div><div id="outsideTabs"><button class="btn2" onclick="openPublicActive()">👀 ACTIVE JOBS - PUBLIC</button><button class="btn2" onclick="openPublicTransport()">🚚 TRANSPORT JOBS - PUBLIC</button><button class="btn2" onclick="openPublicRefurb()">🏠 REFURB HOMES - PUBLIC</button><button class="btn2" onclick="openPublicInvoice()">📄 PUBLIC INVOICE</button><button class="btn2" onclick="openPublicChat()">💬 PUBLIC CHAT</button><button class="btn2" onclick="askNotify()">🔔 Enable Notifications</button><button class="btn2" onclick="showNotifyFix()">❗ Fix Notification</button><button class="btn2" onclick="openAbout()">ℹ️ ABOUT US</button></div></div><div id="publicViewArea"></div></div><div id="app" style="display:none"><div id="tabs"></div><div id="content"></div><button class="btn2" onclick="backHome()" style="margin-bottom:250px;width:100%">⬅️ Back to Home</button></div><div id="pageAbout" style="display:none" class="card"><h3>About Us</h3><div id="aboutView"></div><button class="btn2" onclick="backHome()">Back</button></div><div id="pagePublicInvoice" style="display:none" class="card"><h3>📄 PUBLIC INVOICE</h3><label>Select Existing Folder</label><select id="pubInvFolderSelect"></select><input id="pubInvChassis" placeholder="Chassis Folder Name *"><input id="pubInvCompany" placeholder="Company Name *"><input id="pubInvPerson" placeholder="Your Name *"><input id="pubInvAmt" type="number" step="0.01" placeholder="Total £ *"><input id="pubInvDesc" placeholder="Invoice Title *"><div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1"><label>📷 Camera</label><input type="file" id="pubInvCam" accept="image/*" capture="environment" multiple></div><div style="flex:1"><label>🖼️ Library</label><input type="file" id="pubInvLib" accept="image/*" multiple></div></div><div id="pubInvPrevBox" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px"></div><div id="pubOcrStatus" style="color:#8b5a2b;margin-top:4px;background:#fff8e1;padding:8px;border-radius:8px"></div><div id="pubOcrBreakdown" style="color:#3e2723;margin-top:6px;font-size:13px;background:#fff8e1;padding:8px;border-radius:8px"></div><button class="btn" onclick="submitPublicInvoice()">+ SUBMIT INVOICE</button><hr><div class="card" style="border:2px solid #00c851;background:#e8f5e9"><h3 style="color:#00c851">👁️ MY INVOICES</h3><input id="myInvNameSearch" placeholder="Enter Your Name"><button class="btn-green" onclick="showMyPublicInvoices()">👁️ Show My Invoices</button><div id="myInvListArea"></div></div><button class="btn2" onclick="backHome()" style="margin-bottom:80px">Back to Home</button></div>

<script>var firebaseConfig={apiKey:"AIzaSyB3u3U09Nq5MZ5n2v5j9Z4Q7k8L1M2N3O4",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
var db=null;try{if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig);db=firebase.firestore();}}catch(e){}
var reports=JSON.parse(localStorage.getItem('uh_reports')||'[]');var complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');var transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');var completeJobs=JSON.parse(localStorage.getItem('uh_complete')||'[]');var chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');var workersList=JSON.parse(localStorage.getItem('uh_workers')||'[]');var cp12List=JSON.parse(localStorage.getItem('uh_cp12')||'[]');var refurbs=JSON.parse(localStorage.getItem('uh_refurbs')||'[]');var companyHomes=JSON.parse(localStorage.getItem('uh_companyHomes')||'{}');var customCompanyTabs=JSON.parse(localStorage.getItem('uh_customTabs')||'[]');var aboutData=JSON.parse(localStorage.getItem('uh_about')||'{"text":"UNIQUE HAVEN HOUSE\\nWE BUILD UR DREAM","photo":""}');var pw=JSON.parse(localStorage.getItem('uh_pw')||'{"admin":"admin123","worker":"worker123","transport":"trans123","invoice":"inv123"}');var role=localStorage.getItem('uh_role')||'';var curTab=localStorage.getItem('uh_curTab')||'dash';var invoices={};var invTmp=[];var homePhotos=[];var homeVideos=[];var compPhotos=[];var transPhotos=[];var aboutTmp='';var pubInvTmp=[];var ocrItems=[];
function loadInvoicesSafe(){try{var main=localStorage.getItem('uh_invoices');var b1=localStorage.getItem('uh_invoices_b1');var b2=localStorage.getItem('uh_invoices_b2');var b3=localStorage.getItem('uh_inv');var data=null;if(main&&main!=='{}'&&main.length>10){data=JSON.parse(main);}else if(b1&&b1.length>10){data=JSON.parse(b1);localStorage.setItem('uh_invoices',b1);}else if(b2&&b2.length>10){data=JSON.parse(b2);localStorage.setItem('uh_invoices',b2);}else if(b3&&b3.length>10){var tmp=JSON.parse(b3);var grouped={};for(var i=0;i<tmp.length;i++){var it=tmp[i];var ch=it.chassis||'General';if(!grouped[ch])grouped[ch]=[];grouped[ch].push(it);}data=grouped;}if(data&&typeof data==='object'){invoices=data;}}catch(e){invoices={};}}loadInvoicesSafe();
function saveInvoicesSafe(){try{var str=JSON.stringify(invoices);localStorage.setItem('uh_invoices',str);localStorage.setItem('uh_invoices_b1',str);localStorage.setItem('uh_invoices_b2',str);var flat=[];var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var arr=invoices[keys[k]];for(var j=0;j<arr.length;j++)flat.push(arr[j]);}localStorage.setItem('uh_inv',JSON.stringify(flat));if(db){db.collection('invoices_backup').doc('all').set({data:invoices}).catch(()=>{});}}catch(e){}}
function cloudAdd(col,obj){if(!db)return;db.collection(col).add(obj).catch(()=>{});}function cloudDelete(col,field,val){if(!db)return;db.collection(col).where(field,'==',val).get().then(s=>{s.forEach(d=>d.ref.delete());}).catch(()=>{});}
function showToast(m){var t=document.getElementById('successToast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}
function calcUnpaid(){var tot=0;for(var k in invoices){for(var i=0;i<invoices[k].length;i++){if(!invoices[k][i].paid)tot+=Number(invoices[k][i].amt)||0;}}return tot.toFixed(2);}
function countInvoicesPhotos(){var inv=0;var tot=0;var unpaid=0;for(var k in invoices){inv+=invoices[k].length;for(var i=0;i<invoices[k].length;i++){var a=Number(invoices[k][i].amt)||0;tot+=a;if(!invoices[k][i].paid)unpaid+=a;}}return{inv:inv,total:tot,unpaid:unpaid};}
function getWorkerDayCount(name){var days={};for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===name.toLowerCase()){var d=reports[i].date||'';if(d)days[d]=true;}}return Object.keys(days).length;}
function getWorkerDaysList(name){var days={};for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===name.toLowerCase()){var d=reports[i].date||'';if(d)days[d]=true;}}return Object.keys(days);}
function checkFlashes(){var now=new Date();var msgs=[];for(var i=0;i<cp12List.length;i++){var c=cp12List[i];if(!c.cpDate&&!c.expiry)continue;var d=new Date(c.cpDate||c.expiry);var diff=Math.ceil((d-now)/(1000*60*60*24));if(diff<=30&&diff>=0)msgs.push(c.chassis+' CP12 '+diff+' days');if(diff<0)msgs.push(c.chassis+' CP12 EXPIRED');}var el=document.getElementById('cp12Alert');if(el){if(msgs.length){el.style.display='block';el.innerHTML='⚠️ '+msgs.join(' | ');}else el.style.display='none';}}
function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase().trim();if(!q)return;var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>Search: '+q+'</h3></div>';var found=false;for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">📢 '+complaints[i].chassis+' '+(complaints[i].issue||'')+'</div>';}}for(var i=0;i<transJobs.length;i++){if((transJobs[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">🚚 '+transJobs[i].chassis+'</div>';}}if(!found)html+='<div class="card">No result</div>';area.innerHTML=html;}
function goAdmin(){var p=prompt('Admin Password');if(p===pw.admin){role='admin';localStorage.setItem('uh_role','admin');document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function goWorker(){var p=prompt('Worker Password');if(p===pw.worker){var name=prompt('Your Name');if(!name)return;role='worker';localStorage.setItem('uh_role','worker');localStorage.setItem('uh_curW',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function goTransport(){var p=prompt('Transport Password');if(p===pw.transport){var name=prompt('Driver Name');if(!name)return;role='transport';localStorage.setItem('uh_role','transport');localStorage.setItem('uh_curT',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function backHome(){document.getElementById('app').style.display='none';document.getElementById('outside').style.display='block';document.getElementById('pageAbout').style.display='none';document.getElementById('pagePublicInvoice').style.display='none';document.getElementById('publicViewArea').innerHTML='';role='';localStorage.removeItem('uh_role');}
function initTabs(){var tabsDiv=document.getElementById('tabs');var html='';if(role==='admin'){html+='<button class="btn2" onclick="setTab(\'dash\')">DASH</button>';html+='<button class="btn2" onclick="setTab(\'reports\')">REPORTS</button>';html+='<button class="btn2" onclick="setTab(\'activeJobs\')">ACTIVE</button>';html+='<button class="btn2" onclick="setTab(\'completeJobs\')">COMPLETE</button>';html+='<button class="btn2" style="background:#ff9800;color:#fff" onclick="setTab(\'transportForm\')">+ TRANSPORT FORM</button>';html+='<button class="btn2" onclick="setTab(\'transportJobs\')">TRANSPORT</button>';html+='<button class="btn2" onclick="setTab(\'transportDone\')">TRANS DONE</button>';html+='<button class="btn2" onclick="setTab(\'refurb\')">REFURB</button>';html+='<button class="btn2" onclick="setTab(\'refurbDone\')">REFURB DONE</button>';html+='<button class="btn2" onclick="setTab(\'cp12\')">CP12</button>';html+='<button class="btn2" onclick="setTab(\'invoices\')">INVOICES</button>';html+='<button class="btn2" onclick="setTab(\'companyHomes\')">HOMES</button>';html+='<button class="btn2" onclick="setTab(\'complaints\')">COMPLAINTS</button>';html+='<button class="btn2" onclick="setTab(\'workers\')">WORKERS</button>';html+='<button class="btn2" onclick="setTab(\'publicChatAdmin\')">CHAT</button>';html+='<button class="btn2" onclick="setTab(\'aboutEdit\')">ABOUT</button>';html+='<button class="btn2" onclick="setTab(\'settings\')">SETTINGS</button>';}else if(role==='worker'){html+='<button class="btn2" onclick="setTab(\'myJobs\')">MY JOBS</button>';html+='<button class="btn2" onclick="setTab(\'addReport\')">ADD REPORT</button>';html+='<button class="btn2" onclick="setTab(\'myDays\')">MY DAYS</button>';}else if(role==='transport'){html+='<button class="btn2" onclick="setTab(\'transportJobs\')">JOBS</button>';html+='<button class="btn2" onclick="setTab(\'transportDone\')">DONE</button>';}tabsDiv.innerHTML=html;}
function setTab(t){curTab=t;localStorage.setItem('uh_curTab',t);renderContent();}
function askNotify(){if('Notification' in window){Notification.requestPermission().then(p=>{if(p==='granted')showToast('Notifications ON');});}}
function showNotifyFix(){alert('Go to browser settings > Site settings > Notifications > Allow');}
function openPublicActive(){renderPublicActive();}function openPublicTransport(){renderPublicTransport();}function openPublicRefurb(){renderPublicRefurb();}function openPublicChat(){renderPublicChat();}function openAbout(){document.getElementById('outside').style.display='none';document.getElementById('pageAbout').style.display='block';renderAbout();}function openPublicInvoice(){document.getElementById('outside').style.display='none';document.getElementById('pagePublicInvoice').style.display='block';refreshPubInvFolders();}

function editWorkerDays(i){var wName=workersList[i];var days=getWorkerDaysList(wName);var newDaysStr=prompt('Edit days for '+wName+' (comma separated dates):',days.join(', '));if(newDaysStr===null)return;var newDays=newDaysStr.split(',').map(s=>s.trim()).filter(s=>s);var filteredReports=[];for(var r=0;r<reports.length;r++){if((reports[r].name||'').toLowerCase()!==wName.toLowerCase()){filteredReports.push(reports[r]);}else{var d=reports[r].date||'';if(newDays.includes(d)){filteredReports.push(reports[r]);}}}var existingDates={};for(var r=0;r<filteredReports.length;r++){if((filteredReports[r].name||'').toLowerCase()===wName.toLowerCase()){existingDates[filteredReports[r].date]=true;}}for(var d=0;d<newDays.length;d++){if(!existingDates[newDays[d]]){filteredReports.push({name:wName,chassis:'MANUAL-DAY',work:'Manual day entry',date:newDays[d],hours:'8',location:'',type:'Manual'});}}reports=filteredReports;localStorage.setItem('uh_reports',JSON.stringify(reports));renderWorkersList();}

function initHomeUpload(){function handleFiles(files,type){for(var i=0;i<files.length;i++){(function(file){var r=new FileReader();r.onload=function(ev){if(type==='photo'){homePhotos.push(ev.target.result);}if(type==='video'){homeVideos.push(ev.target.result);}renderHomePreview();};r.readAsDataURL(file);})(files[i]);}}function renderHomePreview(){var box=document.getElementById('homePrevBox');if(!box)return;var html='';for(var i=0;i<homePhotos.length;i++)html+='<img src="'+homePhotos[i]+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';for(var i=0;i<homeVideos.length;i++)html+='<video src="'+homeVideos[i]+'" style="width:70px;height:70px;border-radius:10px;margin:3px" controls></video>';box.innerHTML=html||'Preview';}window.renderHomePreview=renderHomePreview;var cam=document.getElementById('homeCam');var lib=document.getElementById('homeLib');var vid=document.getElementById('homeVid');var vlib=document.getElementById('homeVidLib');if(cam)cam.addEventListener('change',function(e){handleFiles(e.target.files,'photo');});if(lib)lib.addEventListener('change',function(e){handleFiles(e.target.files,'photo');});if(vid)vid.addEventListener('change',function(e){handleFiles(e.target.files,'video');});if(vlib)vlib.addEventListener('change',function(e){handleFiles(e.target.files,'video');});}

function runOcr(base64){var status=document.getElementById('pubOcrStatus');if(status)status.innerHTML='Scanning...';if(typeof Tesseract==='undefined'){if(status)status.innerHTML='OCR not loaded';return;}Tesseract.recognize(base64,'eng').then(res=>{var text=res.data.text||'';var nums=text.match(/[0-9]+\.[0-9]{2}/g)||[];var total=0;for(var i=0;i<nums.length;i++)total+=parseFloat(nums[i])||0;ocrItems=nums;var br=document.getElementById('pubOcrBreakdown');if(br)br.innerHTML='Found: '+nums.join(', ')+' Total £'+total.toFixed(2);if(status)status.innerHTML='Scan done';if(nums.length>0){var amtEl=document.getElementById('pubInvAmt');if(amtEl&&!amtEl.value)amtEl.value=nums[nums.length-1];}}).catch(()=>{if(status)status.innerHTML='Scan failed';});}
function runOcrAdmin(base64){if(typeof Tesseract==='undefined')return;Tesseract.recognize(base64,'eng').then(res=>{var text=res.data.text||'';var nums=text.match(/[0-9]+\.[0-9]{2}/g)||[];if(nums.length>0){var amtEl=document.getElementById('invAmt');if(amtEl&&!amtEl.value)amtEl.value=nums[nums.length-1];}});}
