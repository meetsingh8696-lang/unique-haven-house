click="goWorker()">WORKER</button><button class="btn" onclick="goTransport()">TRANSPORT</button><hr><div class="card" style="border:2px solid #8b5a2b;background:#fff8e1;text-align:left"><h3 style="color:#8b5a2b;text-align:center">🔍 SEARCH ANY JOB</h3><input id="outsideSearchInput" placeholder="Enter Chassis No..." oninput="outsideSearch()" style="font-size:16px;font-weight:bold"><button class="btn" onclick="outsideSearch()">SEARCH BY CHASSIS</button></div><div id="outsideTabs"><button class="btn2" onclick="openPublicActive()">👀 ACTIVE JOBS</button><button class="btn2" onclick="openPublicTransport()">🚚 TRANSPORT JOBS</button><button class="btn2" onclick="openPublicRefurb()">🏠 REFURB HOMES</button><button class="btn2" onclick="openPublicInvoice()">📄 PUBLIC INVOICE</button><button class="btn2" onclick="openPublicChat()">💬 PUBLIC CHAT</button><button class="btn2" onclick="askNotify()">🔔 Enable Notifications</button><button class="btn2" onclick="showNotifyFix()">❗ Fix Notification</button><button class="btn2" onclick="openAbout()">ℹ️ ABOUT US</button></div></div><div id="publicViewArea"></div></div><div id="app" style="display:none"><div id="tabs"></div><div id="content"></div><button class="btn2" onclick="backHome()" style="margin-bottom:250px;width:100%">⬅️ Back to Home</button></div><div id="pageAbout" style="display:none" class="card"><h3>About Us</h3><div id="aboutView"></div><button class="btn2" onclick="backHome()">Back</button></div><div id="pagePublicInvoice" style="display:none" class="card"><h3>📄 PUBLIC INVOICE</h3><label>Select Existing Folder</label><select id="pubInvFolderSelect"></select><input id="pubInvChassis" placeholder="Chassis Folder Name *"><input id="pubInvCompany" placeholder="Company Name *"><input id="pubInvPerson" placeholder="Your Name *"><input id="pubInvAmt" type="number" step="0.01" placeholder="Total £ *"><input id="pubInvDesc" placeholder="Invoice Title *"><div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1"><label>📷 Camera</label><input type="file" id="pubInvCam" accept="image/*" capture="environment" multiple></div><div style="flex:1"><label>🖼️ Library</label><input type="file" id="pubInvLib" accept="image/*" multiple></div></div><div id="pubInvPrevBox" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px"></div><div id="pubOcrStatus" style="background:#fff8e1;padding:8px;border-radius:8px"></div><div id="pubOcrBreakdown" style="background:#fff8e1;padding:8px;border-radius:8px;margin-top:6px"></div><button class="btn" onclick="submitPublicInvoice()">+ SUBMIT INVOICE</button><hr><div class="card" style="border:2px solid #00c851;background:#e8f5e9"><h3 style="color:#00c851">👁️ MY INVOICES</h3><input id="myInvNameSearch" placeholder="Enter Your Name"><button class="btn-green" onclick="showMyPublicInvoices()">👁️ Show My Invoices</button><div id="myInvListArea"></div></div><button class="btn2" onclick="backHome()" style="margin-bottom:80px">Back to Home</button></div><script>var firebaseConfig={apiKey:"AIzaSyB3u3U09Nq5MZ5n2v5j9Z4Q7k8L1M2N3O4",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
var db=null;try{if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig);db=firebase.firestore();}}catch(e){}

var completeJobs=JSON.parse(localStorage.getItem('uh_complete')||'[]');

var invoices={};var invTmp=[];var homePhotos=[];var homeVideos=[];var compPhotos=[];var transPhotos=[];var aboutTmp='';
var pubInvTmp=[];var ocrItems=[];

function loadInvoicesSafe(){
  try{
    var main=localStorage.getItem('uh_invoices');
    var b1=localStorage.getItem('uh_invoices_b1');
    var b2=localStorage.getItem('uh_invoices_b2');
    var b3=localStorage.getItem('uh_inv');
    var data=null;
    if(main&&main!=='{}'&&main.length>10){data=JSON.parse(main);}
    else if(b1&&b1.length>10){data=JSON.parse(b1);localStorage.setItem('uh_invoices',b1);}
    else if(b2&&b2.length>10){data=JSON.parse(b2);localStorage.setItem('uh_invoices',b2);}
    else if(b3&&b3.length>10){var tmp=JSON.parse(b3);var grouped={};for(var i=0;i<tmp.length;i++){var it=tmp[i];var ch=it.chassis||'General';if(!grouped[ch])grouped[ch]=[];grouped[ch].push(it);}data=grouped;localStorage.setItem('uh_invoices',JSON.stringify(grouped));}
    if(data&&typeof data==='object'){invoices=data;}
  }catch(e){invoices={};}
}
loadInvoicesSafe();

function saveInvoicesSafe(){
  try{
    var str=JSON.stringify(invoices);
    localStorage.setItem('uh_invoices',str);
    localStorage.setItem('uh_invoices_b1',str);
    localStorage.setItem('uh_invoices_b2',str);
    var flat=[];var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var arr=invoices[keys[k]];for(var j=0;j<arr.length;j++)flat.push(arr[j]);}
    localStorage.setItem('uh_inv',JSON.stringify(flat));
    if(db){cloudSaveAllInvoices();}
  }catch(e){}
}

function cloudAdd(col,obj){if(!db)return;db.collection(col).add(obj).catch(()=>{});}
function cloudDelete(col,field,val){if(!db)return;db.collection(col).where(field,'==',val).get().then(s=>{s.forEach(d=>d.ref.delete());}).catch(()=>{});}
function cloudDeleteAll(col){if(!db)return;db.collection(col).get().then(s=>{s.forEach(d=>d.ref.delete());}).catch(()=>{});}
function cloudSaveAllInvoices(){if(!db)return;db.collection('invoices_backup').doc('all').set({data:invoices,time:Date.now()}).catch(()=>{});}

function initFirebaseSync(){
  if(!db)return;
  db.collection('complaints').onSnapshot(s=>{
    if(s.empty)return;
    var arr=[];s.forEach(d=>arr.push(d.data()));
    if(arr.length>0){localStorage.setItem('uh_comp',JSON.stringify(arr));complaints=arr;if(role)renderContent();}
  });
  db.collection('transJobs').onSnapshot(s=>{
    if(s.empty)return;
    var arr=[];s.forEach(d=>arr.push(d.data()));
    if(arr.length>0){localStorage.setItem('uh_tjobs',JSON.stringify(arr));transJobs=arr;if(role)renderContent();}
  });
  db.collection('invoices_backup').doc('all').onSnapshot(doc=>{
    if(!doc.exists)return;
    var d=doc.data();if(d&&d.data&&Object.keys(d.data).length>0){
      var cloudStr=JSON.stringify(d.data);
      var localStr=localStorage.getItem('uh_invoices')||'{}';
      if(cloudStr.length>localStr.length+20){invoices=d.data;saveInvoicesSafe();if(role)renderContent();}
    }
  });
}

function showToast(m){var t=document.getElementById('successToast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}
function calcUnpaid(){var tot=0;for(var k in invoices){for(var i=0;i<invoices[k].length;i++){if(!invoices[k][i].paid)tot+=Number(invoices[k][i].amt)||0;}}return tot.toFixed(2);}
function countInvoicesPhotos(){var inv=0;var tot=0;var unpaid=0;for(var k in invoices){inv+=invoices[k].length;for(var i=0;i<invoices[k].length;i++){var a=Number(invoices[k][i].amt)||0;tot+=a;if(!invoices[k][i].paid)unpaid+=a;}}return{inv:inv,total:tot,unpaid:unpaid};}

function checkFlashes(){
  var now=new Date();var msgs=[];
  for(var i=0;i<cp12List.length;i++){
    var c=cp12List[i];if(!c.cpDate&&!c.expiry)continue;
    var d=new Date(c.cpDate||c.expiry);var diff=Math.ceil((d-now)/(1000*60*60*24));
    if(diff<=30&&diff>=0)msgs.push(c.chassis+' CP12 '+diff+' days');
    if(diff<0)msgs.push(c.chassis+' CP12 EXPIRED');
  }
  var el=document.getElementById('cp12Alert');
  if(el){if(msgs.length){el.style.display='block';el.innerHTML='⚠️ '+msgs.join(' | ');}else el.style.display='none';}
}

function outsideSearch(){
  var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase().trim();
  if(!q)return;
  var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>Search: '+q+'</h3></div>';
  var found=false;
  for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">📢 '+complaints[i].chassis+' '+(complaints[i].issue||'')+'</div>';}}
  for(var i=0;i<transJobs.length;i++){if((transJobs[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">🚚 '+transJobs[i].chassis+' Pickup:'+(transJobs[i].pickupAddr||'')+' Delivery:'+(transJobs[i].deliveryAddr||'')+' Tenant:'+(transJobs[i].tenant||'')+' Plot:'+(transJobs[i].plot||'')+' Date:'+(transJobs[i].pickupDate||'')+'</div>';}}
  for(var i=0;i<refurbs.length;i++){if((refurbs[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">🏠 '+refurbs[i].chassis+' '+(refurbs[i].location||'')+'</div>';}}
  for(var k in invoices){if(k.toLowerCase().includes(q)){found=true;html+='<div class="card">📄 Invoice Folder: '+k+' ('+invoices[k].length+')</div>';}}
  if(!found)html+='<div class="card">No result for '+q+'</div>';
  area.innerHTML=html;document.getElementById('outside').style.display='block';
}

function goTransport(){var p=prompt('Transport Password');if(p===pw.transport){var name=prompt('Driver Name');if(!name)return;role='transport';localStorage.setItem('uh_role','transport');localStorage.setItem('uh_curT',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}

function refreshPubInvFolders(){
  var sel=document.getElementById('pubInvFolderSelect');if(!sel)return;var opts='<option value="">-- Select Existing --</option>';var keys=Object.keys(invoices);for(var i=0;i<keys.length;i++){opts+='<option value="'+keys[i]+'">'+keys[i]+' ('+invoices[keys[i]].length+')</option>';}sel.innerHTML=opts;sel.onchange=function(){if(this.value)document.getElementById('pubInvChassis').value=this.value;};
}
function renderActive(){
  var list=document.getElementById('activeList');if(!list)return;var html='';
  var onlyActive=complaints.filter(c=>!c.completed);
  if(onlyActive.length===0)html+='<div class="card">No active</div>';
  for(var i=0;i<complaints.length;i++){
    var c=complaints[i];if(c.completed)continue;
    var media='';if(c.photos){for(var p=0;p<c.photos.length;p++)media+='<img src="'+c.photos[p]+'" style="width:80px;height:80px;border-radius:8px;margin:2px" onclick="window.open(this.src)">';}
    html+='<div class="card '+(c.emergency?'emergency':'')+'"><b>'+c.chassis+'</b> '+(c.name||'')+'<br>Location:'+(c.location||c.addr||'')+'<br>Issue:'+(c.issue||'')+'<br>Worker:'+(c.assignedTo||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><select id="assign_'+i+'"><option value="">Assign Worker</option>'+getWorkerOpts()+'</select> <button class="btn2" onclick="assignW('+i+')">Assign</button> <button class="btn-green" onclick="compDone('+i+')">Done</button></div>';
  }
  list.innerHTML=html;
}

function renderT(){
  var list=document.getElementById('tjList');if(!list)return;var html='';
  var pending=transJobs.filter(j=>{return!j.done && j.status!=='done' &&!j.completed;});
  var curDriver=(localStorage.getItem('uh_curT')||'').toLowerCase().trim();
  var showJobs=pending;
  if(role==='transport' && curDriver){
    var mine=pending.filter(j=>{var d=(j.assignedTo||j.driver||'').toLowerCase().trim();return d.includes(curDriver)||curDriver.includes(d)||d==='';});
    if(mine.length>0)showJobs=mine;

function runOcr(base64){
  var status=document.getElementById('pubOcrStatus');if(status)status.innerHTML='Scanning...';
  if(typeof Tesseract==='undefined'){if(status)status.innerHTML='OCR not loaded';return;}
  Tesseract.recognize(base64,'eng').then(res=>{
    var text=res.data.text||'';var nums=text.match(/[0-9]+\.[0-9]{2}/g)||[];var total=0;for(var i=0;i<nums.length;i++)total+=parseFloat(nums[i])||0;
    ocrItems=nums;var br=document.getElementById('pubOcrBreakdown');if(br)br.innerHTML='Found: '+nums.join(', ')+' Total approx £'+total.toFixed(2);
    if(status)status.innerHTML='Scan done';if(nums.length>0){var amtEl=document.getElementById('pubInvAmt');if(amtEl&&!amtEl.value)amtEl.value=nums[nums.length-1];}
  }).catch(()=>{if(status)status.innerHTML='Scan failed';});
}
function runOcrAdmin(base64){
  if(typeof Tesseract==='undefined')return;
  Tesseract.recognize(base64,'eng').then(res=>{
    var text=res.data.text||'';var nums=text.match(/[0-9]+\.[0-9]{2}/g)||[];if(nums.length>0){var amtEl=document.getElementById('invAmt');if(amtEl&&!amtEl.value)amtEl.value=nums[nums.length-1];}
  });
}
