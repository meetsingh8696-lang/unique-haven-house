<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Unique Haven House</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}
header{background:#0f2a44;color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:18px;position:sticky;top:0;z-index:10}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;background:#fff;position:sticky;top:48px;z-index:9}
.tabBtn{padding:10px 4px;border:1px solid #ddd;border-radius:10px;background:#eef2f7;cursor:pointer;font-weight:bold;font-size:12px;text-align:center}
.tabBtn.active{background:#0f2a44;color:#fff}
#content{padding:12px;padding-bottom:120px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{cursor:pointer} .btn{background:#0f2a44;color:#fff;border:0;padding:11px;border-radius:9px;font-weight:bold;width:100%;margin-top:6px}
.btn2{background:#e67e22;color:#fff;border:0;padding:10px;border-radius:9px;font-weight:bold;width:100%;margin-top:6px}
.small{font-size:12px;color:#666} .row{display:flex;gap:8px} .row>*{flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;z-index:999;display:none}
#backBtn{display:none;margin:10px;padding:10px;background:#fff;border:1px solid #ddd;border-radius:9px;font-weight:bold;width:calc(100% - 20px)}
</style>
</head>
<body>
<header>🏠 UNIQUE HAVEN HOUSE</header>
<button id="backBtn" onclick="goBack()">⬅️ Back To All Tabs</button>
<div id="tabs"></div>
<div id="content"></div>
<div id="toast"></div>
<script>
// === PART 1 START ===
let role=localStorage.getItem('uh_role')||'';
let curTab=localStorage.getItem('uh_curTab')||'';
let curUser=localStorage.getItem('uh_curW')||'';
let curPhone=localStorage.getItem('uh_curPhone')||'';
let SUPER_ADMIN_PHONE=localStorage.getItem('uh_super_phone')||'';
let adminsList=[]; try{adminsList=JSON.parse(localStorage.getItem('uh_admins')||'[]')}catch(e){adminsList=[]}
let jobs=[]; try{jobs=JSON.parse(localStorage.getItem('uh_jobs')||'[]')}catch(e){jobs=[]}
let homes=[]; try{homes=JSON.parse(localStorage.getItem('uh_homes')||'[]')}catch(e){homes=[]}
let workersList=[]; try{workersList=JSON.parse(localStorage.getItem('uh_workers')||'[]')}catch(e){workersList=[]}
let publicInvoices=[]; try{publicInvoices=JSON.parse(localStorage.getItem('uh_pubInv')||'[]')}catch(e){publicInvoices=[]}
let LAPTOP_SERVER_URL=localStorage.getItem('uh_server_url')||'';
function saveData(){try{localStorage.setItem('uh_jobs',JSON.stringify(jobs));localStorage.setItem('uh_homes',JSON.stringify(homes));localStorage.setItem('uh_workers',JSON.stringify(workersList));localStorage.setItem('uh_pubInv',JSON.stringify(publicInvoices));localStorage.setItem('uh_admins',JSON.stringify(adminsList));}catch(e){}}
function showToast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>{t.style.display='none'},2500)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getTabs(){
if(role==='admin') return ['dash','addJob','active','complete','transportForm','transportJobs','transDone','refurb','refurbDone','cp12','invoices','homes','workers','jobsChat','privateChat','haven','material','about','settings'];
if(role==='worker') return ['myJobs','addReport','myDays','jobsChat','privateChat','haven','settings'];
if(role==='transport') return ['transportJobs','transDone','jobsChat','privateChat','haven'];
return ['publicActive','publicTransport','publicRefurb','publicInvoice','publicChat','about','materialOutside'];
}
function tabLabel(t){let m={dash:'DASH - HOME',addJob:'ADD JOB',active:'ACTIVE',complete:'COMPLETE',transportForm:'🚚 TRANSPORT FORM',transportJobs:'🚚 TRANSPORT JOBS',transDone:'TRANS DONE',refurb:'REFURB',refurbDone:'REFURB DONE',cp12:'CP12',invoices:'INVOICES',homes:'HOMES',workers:'WORKERS',jobsChat:'JOBS CHAT',privateChat:'PRIVATE CHAT',haven:'HAVEN ASSISTANT',material:'📦 MATERIAL STOCK',about:'ABOUT',settings:'SETTINGS',myJobs:'MY JOBS',addReport:'ADD REPORT',myDays:'MY DAYS',publicActive:'ACTIVE JOBS - PUBLIC',publicTransport:'TRANSPORT JOBS - PUBLIC',publicRefurb:'REFURB HOMES - PUBLIC',publicInvoice:'PUBLIC INVOICE',publicChat:'PUBLIC CHAT',materialOutside:'MATERIAL USE - OUTSIDE'};return m[t]||t}
function initTabs(){
let tb=document.getElementById('tabs');tb.innerHTML='';
let list=getTabs();
list.forEach(t=>{let b=document.createElement('div');b.className='tabBtn'+(curTab===t?' active':'');b.textContent=tabLabel(t);b.onclick=()=>setTab(t);tb.appendChild(b)});
}
function setTab(t){
curTab=t;localStorage.setItem('uh_curTab',t);
document.getElementById('tabs').style.display='grid';
document.getElementById('backBtn').style.display='none';
initTabs();renderContent();
}
function goBack(){
document.getElementById('tabs').style.display='grid';
document.getElementById('backBtn').style.display='none';
initTabs();renderContent();
}
function openSingle(t){
curTab=t;localStorage.setItem('uh_curTab',t);
document.getElementById('tabs').style.display='none';
document.getElementById('backBtn').style.display='block';
renderContent();
}
// === LOGIN - FIXED - NEVER BLOCKS ===
function loginNamePhone(){
let n=(document.getElementById('loginName').value||'').trim();
let ph=(document.getElementById('loginPhone').value||'').trim();
let rl=document.getElementById('loginRole').value;
if(!n||!ph){alert('Name + Phone needed');return}
curUser=n;curPhone=ph;role=rl;
localStorage.setItem('uh_curW',n);localStorage.setItem('uh_curPhone',ph);localStorage.setItem('uh_role',rl);
localStorage.setItem('uh_curT',n);localStorage.setItem('uh_curAdmin',n);
if(!SUPER_ADMIN_PHONE){SUPER_ADMIN_PHONE=ph;localStorage.setItem('uh_super_phone',ph);adminsList=[{name:n,phone:ph,super:true}];saveData();alert('You are now SUPER ADMIN - Owner')}
else{
let found=false;for(let i=0;i<adminsList.length;i++){if(adminsList[i].phone===ph) found=true}
if(rl==='admin' && !found){adminsList.push({name:n,phone:ph});saveData()}
}
if(rl==='admin') curTab='dash';
else if(rl==='worker') curTab='myJobs';
else if(rl==='transport') curTab='transportJobs';
else curTab='publicActive';
localStorage.setItem('uh_curTab',curTab);
initTabs();renderContent();showToast('Logged in as '+n);
}
function logout(){role='';curTab='';localStorage.removeItem('uh_role');localStorage.removeItem('uh_curTab');initTabs();renderContent()}
function renderLogin(){
return `<div class="card"><h3>Login</h3><input id="loginName" placeholder="Your Name" value="${esc(curUser)}"><input id="loginPhone" placeholder="Phone Number" value="${esc(curPhone)}"><select id="loginRole"><option value="admin">Admin</option><option value="worker">Worker</option><option value="transport">Transport</option></select><button class="btn" onclick="loginNamePhone()">LOGIN</button><div class="small">First login becomes Super Admin Owner. Use same phone every time.</div></div>`;
}
function renderContent(){
let c=document.getElementById('content');
if(!role){
c.innerHTML=renderLogin()+renderPublicTabs();return;
}
if(curTab==='dash') c.innerHTML=`<div class="card"><h2>Welcome ${esc(curUser)} - DASH HOME</h2><p>Admin Home. Click any tab above.</p><p>Total Jobs: ${jobs.length} | Homes: ${homes.length} | Workers: ${workersList.length}</p><button class="btn2" onclick="logout()">Logout</button></div>`+renderAdminList();
else if(curTab==='myJobs') c.innerHTML=`<div class="card"><h2>MY JOBS - Worker Home</h2><p>Hello ${esc(curUser)}</p></div>`+renderWorkerJobs();
else if(curTab==='transportJobs') c.innerHTML=`<div class="card"><h2>TRANSPORT JOBS</h2></div>`+renderTransportJobs();
else if(curTab==='active') c.innerHTML=`<div class="card"><h2>ACTIVE JOBS</h2><button class="btn" onclick="openSingle('active')">Open Full</button></div>`+renderAdminList();
else if(curTab==='refurbDone') c.innerHTML=`<div class="card"><h2>REFURB DONE</h2><p>Refurb Done list for Admin only. This tab was never deleted.</p></div>`;
else if(curTab==='settings') c.innerHTML=`<div class="card"><h2>SETTINGS</h2><p>Laptop Server URL</p><input id="srvUrl" placeholder="http://192.168.1.20:3000" value="${esc(LAPTOP_SERVER_URL)}"><button class="btn" onclick="saveServerUrl()">Save Server URL</button><button class="btn2" onclick="logout()">Logout</button></div>`;
else c.innerHTML=`<div class="card"><h2>${esc(tabLabel(curTab))}</h2><p>Tab working. Content in Part 2.</p><button class="btn" onclick="goBack()">⬅️ Back</button></div>`;
}
function saveServerUrl(){LAPTOP_SERVER_URL=document.getElementById('srvUrl').value.trim();localStorage.setItem('uh_server_url',LAPTOP_SERVER_URL);showToast('Server URL Saved')}
function renderAdminList(){
if(!jobs.length) return `<div class="card">No jobs yet. Go to ADD JOB.</div>`;
return jobs.map((j,i)=>`<div class="card"><b>${esc(j.title||'Job '+(i+1))}</b><div class="small">${esc(j.address||'')} - ${esc(j.status||'active')}</div></div>`).join('');
}
function renderWorkerJobs(){
if(!jobs.length) return `<div class="card">No jobs assigned yet.</div>`;
return jobs.map((j,i)=>`<div class="card"><b>${esc(j.title||'Job')}</b><div>${esc(j.address||'')}</div></div>`).join('');
}
function renderTransportJobs(){
return `<div class="card"><p>Transport jobs list - Full in Part 2.</p></div>`;
}
function renderPublicTabs(){
let act=jobs.filter(j=>(j.status||'active')==='active');
let html=`<div class="card"><h3>ACTIVE JOBS - PUBLIC</h3>${act.length?act.map(j=>`<div><b>${esc(j.title||'Job')}</b> - ${esc(j.address||'')}</div>`).join(''):'<p>No public jobs yet.</p>'}</div>`;
html+=`<div class="card"><h3>TRANSPORT JOBS - PUBLIC</h3><p>Public transport list.</p></div>`;
html+=`<div class="card"><h3>REFURB HOMES - PUBLIC</h3><p>Public refurb list.</p></div>`;
return html;
}
// === END PART 1 ===// === PART 2 START ===
// === ADD JOB / ACTIONS ===
function addJobSave(){
let t=document.getElementById('njTitle').value.trim();
let a=document.getElementById('njAddr').value.trim();
if(!t){alert('Job title needed');return}
jobs.push({title:t,address:a,status:'active',date:new Date().toLocaleDateString()});
saveData();curTab='active';localStorage.setItem('uh_curTab',curTab);initTabs();renderContent();showToast('Job Added');
}
function markComplete(i){jobs[i].status='complete';saveData();renderContent();showToast('Moved to COMPLETE')}
function markActive(i){jobs[i].status='active';saveData();renderContent();showToast('Moved to ACTIVE')}
function delJob(i){if(confirm('Delete this job?')){jobs.splice(i,1);saveData();renderContent()}}
function sendChat(){
let m=document.getElementById('chatMsg').value||'';
if(!m) return;
document.getElementById('chatBox').innerHTML+='<div><b>'+esc(curUser)+':</b> '+esc(m)+'</div>';
document.getElementById('chatMsg').value='';showToast('Sent');
}
function askHaven(){
let q=(document.getElementById('havenQ').value||'').toLowerCase();
let a=document.getElementById('havenAns');
let act=jobs.filter(function(j){return j.status==='active'}).length;
let comp=jobs.filter(function(j){return j.status==='complete'}).length;
if(q.indexOf('report')!==-1){a.innerHTML='<b>Haven:</b> Today you have '+jobs.length+' jobs. '+act+' active, '+comp+' complete.'}
else if(q.indexOf('job')!==-1){a.innerHTML='<b>Haven:</b> Active jobs: '+jobs.filter(function(j){return j.status==='active'}).map(function(j){return j.title}).join(', ')}
else{a.innerHTML='<b>Haven:</b> Hello '+esc(curUser)+'. Try "My report today" or "Jobs today".'}
}
// === FULL RENDER - REPLACES PART 1 RENDER ===
function renderContent(){
let c=document.getElementById('content');
if(!role){c.innerHTML=renderLogin()+renderPublicTabs();return}
if(curTab==='dash'){
c.innerHTML='<div class="card"><h2>Welcome '+esc(curUser)+' - DASH HOME</h2><p>Total Jobs: '+jobs.length+' | Active: '+jobs.filter(function(j){return j.status==='active'}).length+' | Complete: '+jobs.filter(function(j){return j.status==='complete'}).length+'</p><button class="btn" onclick="setTab(\'addJob\')">+ ADD JOB</button><button class="btn2" onclick="logout()">Logout</button></div>'+renderAdminList();return}
if(curTab==='addJob'){
c.innerHTML='<div class="card"><h2>ADD JOB</h2><input id="njTitle" placeholder="Job Title - e.g. 12 Oak Road - Kitchen"><input id="njAddr" placeholder="Address"><button class="btn" onclick="addJobSave()">ADD JOB</button></div>';return}
if(curTab==='active'){
let list='';
for(let i=0;i<jobs.length;i++){if(jobs[i].status==='active'){list+='<div class="card"><b>'+esc(jobs[i].title)+'</b><div class="small">'+esc(jobs[i].address)+' - '+esc(jobs[i].date||'')+'</div><div class="row"><button class="btn2" onclick="markComplete('+i+')">Mark Complete</button><button class="btn" onclick="delJob('+i+')">Delete</button></div></div>'}}
c.innerHTML='<div class="card"><h2>ACTIVE JOBS</h2></div>'+(list||'<div class="card">No active jobs.</div>');return}
if(curTab==='complete'){
let list='';
for(let i=0;i<jobs.length;i++){if(jobs[i].status==='complete'){list+='<div class="card"><b>'+esc(jobs[i].title)+'</b><div class="small">'+esc(jobs[i].address)+'</div><button class="btn" onclick="markActive('+i+')">Back To Active</button></div>'}}
c.innerHTML='<div class="card"><h2>COMPLETE JOBS</h2></div>'+(list||'<div class="card">No complete jobs.</div>');return}
if(curTab==='transportForm'){
c.innerHTML='<div class="card"><h2>TRANSPORT FORM</h2><input id="njTitle" placeholder="Transport Job - e.g. Move Sofa"><input id="njAddr" placeholder="From - To Address"><button class="btn" onclick="addJobSave()">ADD TRANSPORT JOB</button></div>';return}
if(curTab==='transportJobs'){
c.innerHTML='<div class="card"><h2>TRANSPORT JOBS</h2></div>'+renderAdminList();return}
if(curTab==='transDone'){
c.innerHTML='<div class="card"><h2>TRANS DONE</h2><p>Transport completed jobs.</p></div>'+renderAdminList();return}
if(curTab==='refurb'){
c.innerHTML='<div class="card"><h2>REFURB</h2><p>Refurb jobs.</p></div>'+renderAdminList();return}
if(curTab==='refurbDone'){
c.innerHTML='<div class="card"><h2>REFURB DONE</h2><p>Admin only. Refurb Done - Not deleted, still here.</p></div>';return}
if(curTab==='cp12'){
c.innerHTML='<div class="card"><h2>CP12</h2><p>CP12 certificates list.</p></div>';return}
if(curTab==='invoices'){
c.innerHTML='<div class="card"><h2>INVOICES</h2><p>Invoices list.</p></div>';return}
if(curTab==='homes'){
c.innerHTML='<div class="card"><h2>HOMES</h2><p>Homes list. Total Homes: '+homes.length+'</p></div>';return}
if(curTab==='workers'){
c.innerHTML='<div class="card"><h2>WORKERS</h2><p>Workers list. Total Workers: '+workersList.length+'</p></div>';return}
if(curTab==='jobsChat'){
c.innerHTML='<div class="card"><h2>JOBS CHAT</h2><input id="chatMsg" placeholder="Type message..."><button class="btn" onclick="sendChat()">Send</button><div id="chatBox" class="small">Chat loads here.</div></div>';return}
if(curTab==='privateChat'){
c.innerHTML='<div class="card"><h2>PRIVATE CHAT</h2><p>Select a worker to chat privately.</p><input id="privMsg" placeholder="Private message..."><button class="btn" onclick="showToast(\'Private message sent\')">Send Private</button></div>';return}
if(curTab==='haven'){
c.innerHTML='<div class="card"><h2>HAVEN ASSISTANT</h2><p>Ask: My report today / Jobs today</p><input id="havenQ" placeholder="Ask Haven..."><button class="btn" onclick="askHaven()">Ask Haven</button><div id="havenAns" class="small" style="margin-top:10px"></div></div>';return}
if(curTab==='material'){
c.innerHTML='<div class="card"><h2>MATERIAL STOCK</h2><p>Material tracking.</p></div>';return}
if(curTab==='about'){
c.innerHTML='<div class="card"><h2>ABOUT US</h2><p>Unique Haven House - Property, Refurb, Transport.</p></div>';return}
if(curTab==='settings'){
c.innerHTML='<div class="card"><h2>SETTINGS</h2><input id="srvUrl" placeholder="http://192.168.1.20:3000" value="'+esc(LAPTOP_SERVER_URL)+'"><button class="btn" onclick="saveServerUrl()">Save Server URL</button><button class="btn2" onclick="logout()">Logout</button></div>';return}
if(curTab==='myJobs'){
c.innerHTML='<div class="card"><h2>MY JOBS - Worker Home</h2><p>Hello '+esc(curUser)+'</p></div>'+renderWorkerJobs();return}
if(curTab==='addReport'){
c.innerHTML='<div class="card"><h2>ADD REPORT</h2><textarea id="repTxt" placeholder="What did you do today?"></textarea><button class="btn" onclick="showToast(\'Report Saved\')">Save Report</button></div>';return}
if(curTab==='myDays'){
c.innerHTML='<div class="card"><h2>MY DAYS</h2><p>Your days / attendance.</p></div>';return}
c.innerHTML='<div class="card"><h2>'+esc(tabLabel(curTab))+'</h2><p>Tab working.</p><button class="btn" onclick="goBack()">Back</button></div>';
}
// === START APP ===
if(!curTab){
if(role==='admin') curTab='dash';
else if(role==='worker') curTab='myJobs';
else if(role==='transport') curTab='transportJobs';
else curTab='';
}
initTabs();
renderContent();
// === END PART 2 ===// === PART 3 START ===
// === STORAGE FOR PART 3 ===
let invoicesList=[]; try{invoicesList=JSON.parse(localStorage.getItem('uh_invoices')||'[]')}catch(e){invoicesList=[]}
let materialList=[]; try{materialList=JSON.parse(localStorage.getItem('uh_material')||'[]')}catch(e){materialList=[]}
function savePart3(){try{localStorage.setItem('uh_invoices',JSON.stringify(invoicesList));localStorage.setItem('uh_material',JSON.stringify(materialList));saveData()}catch(e){}}
// === INVOICES ===
function addInvoiceSave(){
let t=document.getElementById('invTitle').value.trim();
let a=document.getElementById('invAmt').value.trim();
if(!t||!a){alert('Title + Amount needed');return}
invoicesList.push({title:t,amount:a,date:new Date().toLocaleDateString()});savePart3();renderContent();showToast('Invoice Added')
}
function delInvoice(i){if(confirm('Delete invoice?')){invoicesList.splice(i,1);savePart3();renderContent()}}
function renderInvoicesFull(){
let list=invoicesList.map(function(inv,i){return '<div class="card"><b>'+esc(inv.title)+'</b><div>£'+esc(inv.amount)+' - '+esc(inv.date)+'</div><button class="btn" onclick="delInvoice('+i+')">Delete</button></div>'}).join('');
return '<div class="card"><h2>INVOICES - Full</h2><input id="invTitle" placeholder="Invoice Title - e.g. 12 Oak Road - Kitchen"><input id="invAmt" placeholder="Amount - e.g. 1250" type="number"><button class="btn" onclick="addInvoiceSave()">ADD INVOICE</button></div>'+(list||'<div class="card">No invoices yet.</div>');
}
// === HOMES ===
function addHomeSave(){
let t=document.getElementById('homeTitle').value.trim();
let a=document.getElementById('homeAddr').value.trim();
if(!t){alert('Home name needed');return}
homes.push({title:t,address:a,status:'active'});saveData();renderContent();showToast('Home Added')
}
function delHome(i){if(confirm('Delete home?')){homes.splice(i,1);saveData();renderContent()}}
function renderHomesFull(){
let list=homes.map(function(h,i){return '<div class="card"><b>'+esc(h.title)+'</b><div class="small">'+esc(h.address||'')+'</div><button class="btn" onclick="delHome('+i+')">Delete</button></div>'}).join('');
return '<div class="card"><h2>HOMES - Full</h2><input id="homeTitle" placeholder="Home Name - e.g. Oak House"><input id="homeAddr" placeholder="Address"><button class="btn" onclick="addHomeSave()">ADD HOME</button></div>'+(list||'<div class="card">No homes yet.</div>');
}
// === WORKERS ===
function addWorkerSave(){
let t=document.getElementById('workName').value.trim();
let p=document.getElementById('workPhone').value.trim();
if(!t){alert('Worker name needed');return}
workersList.push({name:t,phone:p});saveData();renderContent();showToast('Worker Added')
}
function delWorker(i){if(confirm('Delete worker?')){workersList.splice(i,1);saveData();renderContent()}}
function renderWorkersFull(){
let list=workersList.map(function(w,i){return '<div class="card"><b>'+esc(w.name)+'</b><div class="small">'+esc(w.phone||'')+'</div><button class="btn" onclick="delWorker('+i+')">Delete</button></div>'}).join('');
return '<div class="card"><h2>WORKERS - Full</h2><input id="workName" placeholder="Worker Name"><input id="workPhone" placeholder="Worker Phone"><button class="btn" onclick="addWorkerSave()">ADD WORKER</button></div>'+(list||'<div class="card">No workers yet.</div>');
}
// === MATERIAL ===
function addMaterialSave(){
let t=document.getElementById('matName').value.trim();
let q=document.getElementById('matQty').value.trim();
if(!t){alert('Material name needed');return}
materialList.push({name:t,qty:q||'1'});savePart3();renderContent();showToast('Material Added')
}
function delMaterial(i){if(confirm('Delete material?')){materialList.splice(i,1);savePart3();renderContent()}}
function renderMaterialFull(){
let list=materialList.map(function(m,i){return '<div class="card"><b>'+esc(m.name)+'</b><div>Qty: '+esc(m.qty)+'</div><button class="btn" onclick="delMaterial('+i+')">Delete</button></div>'}).join('');
return '<div class="card"><h2>MATERIAL STOCK - Full</h2><input id="matName" placeholder="Material - e.g. Cement"><input id="matQty" placeholder="Qty - e.g. 10" type="number"><button class="btn" onclick="addMaterialSave()">ADD MATERIAL</button></div>'+(list||'<div class="card">No material yet.</div>');
}
// === OVERRIDE ONLY THOSE 4 TABS - NO DUPLICATE ===
let renderContent_Part2 = renderContent;
function renderContent(){
if(!role){renderContent_Part2();return}
if(curTab==='invoices'){document.getElementById('content').innerHTML=renderInvoicesFull();return}
if(curTab==='homes'){document.getElementById('content').innerHTML=renderHomesFull();return}
if(curTab==='workers'){document.getElementById('content').innerHTML=renderWorkersFull();return}
if(curTab==='material'){document.getElementById('content').innerHTML=renderMaterialFull();return}
renderContent_Part2();
}
initTabs();renderContent();
// === END PART 3 ===
</script>
</body>
</html>
