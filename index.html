function checkFlashes(){
var alertBox=document.getElementById('globalAlert');if(!alertBox)return;
var msgs=[];
var emergCount=complaints.filter(c=>c.emergency&&!c.completed).length;
if(emergCount>0)msgs.push('🚨 '+emergCount+' EMERGENCY');
var now=new Date();now.setHours(0,0,0,0);
var expiring=[];var hasRealCP12=false;
for(var i=0;i<cp12List.length;i++){
  try{
    var cpDateStr=cp12List[i].cpDate||cp12List[i].expiry;
    if(!cpDateStr)continue;
    if(!cp12List[i].chassis &&!cp12List[i].address)continue;
    hasRealCP12=true;
    var d=new Date(cpDateStr);if(isNaN(d.getTime()))continue;
    d.setHours(0,0,0,0);
    var diffDays=Math.ceil((d-now)/(1000*60*60*24));
    if(diffDays>=0&&diffDays<=30){expiring.push(cp12List[i].chassis+' ('+diffDays+' days)');}
    if(diffDays<0){expiring.push(cp12List[i].chassis+' (EXPIRED)');}
  }catch(e){}
}
var cpAlert=document.getElementById('cp12Alert');
if(cpAlert){
  if(!hasRealCP12 || expiring.length===0){cpAlert.style.display='none';cpAlert.innerHTML='';}
  else{cpAlert.style.display='block';cpAlert.innerHTML='⚠️ CP12 EXPIRY: '+expiring.join(', ');}
}
if(expiring.length>0){msgs.push('⚠️ CP12 EXPIRING: '+expiring.join(', '));}
if(msgs.length>0){alertBox.style.display='block';alertBox.className='flashRed';alertBox.innerHTML=msgs.join('<br>');}
else{alertBox.style.display='none';}
}

function renderMyReports(){var curW=(localStorage.getItem('uh_curW')||'').trim();var list=document.getElementById('myReportsList');if(!list)return;var my=reports.filter(r=> (r.name||'').trim().toLowerCase()===curW.toLowerCase());var h='<h4>My Reports ('+my.length+')</h4>';for(var i=0;i<my.length;i++){h+='<div class="card"><b>'+my[i].date+'</b> - Chassis:'+my[i].chassis+'<br>Work:'+my[i].work+'</div>';}list.innerHTML=h;}

function renderMyDays(){var curW=(localStorage.getItem('uh_curW')||'').trim();var list=document.getElementById('myDaysList');if(!list)return;var my=reports.filter(r=> (r.name||'').trim().toLowerCase()===curW.toLowerCase());var unique=[];for(var i=0;i<my.length;i++){if(unique.indexOf(my[i].date)===-1)unique.push(my[i].date);}var h='<div class="totalBox" style="font-size:18px">📅 '+unique.length+' Days Worked<br><small>Total Reports: '+my.length+'</small></div>';for(var d=0;d<unique.length;d++){h+='<div class="card"><b>📅 '+unique[d]+'</b></div>';}list.innerHTML=h;}

function submitReport(){var name=(localStorage.getItem('uh_curW')||'Worker').trim();var chassis=document.getElementById('rChassis').value.trim();var location=document.getElementById('rLocation').value;var work=document.getElementById('workDone').value;var date=document.getElementById('rDate').value||new Date().toLocaleDateString();if(!chassis){alert('Chassis required');return;}var e={name:name,chassis:chassis,location:location,work:work,date:date};reports.unshift(e);localStorage.setItem('uh_reports',JSON.stringify(reports));cloudAdd('reports',e);if(!workers[name])workers[name]={days:[]};if(!workers[name].days)workers[name].days=[];if(!workers[name].days.includes(date))workers[name].days.push(date);localStorage.setItem('uh_workers',JSON.stringify(workers));alert('Report Submitted - Day count fixed');renderContent();}
