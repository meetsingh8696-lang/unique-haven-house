function sendChat(){var n=document.getElementById('chatName').value.trim()||'Guest';var m=document.getElementById('chatMsg').value.trim();if(!m){alert('Type');return;}var o={name:n,msg:m,time:new Date().toLocaleString()};chatMsgs.unshift(o);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudAdd('chatMsgs',{name:n,msg:m,time:new Date().toLocaleString()});document.getElementById('chatMsg').value='';renderChatList();}
function renderChatList(){var l=document.getElementById('chatList')||document.getElementById('adminChatList');if(!l)return;var h='';for(var i=0;i<chatMsgs.length;i++){h+='<div class="card">'+chatMsgs[i].name+': '+chatMsgs[i].msg+' '+(role==='admin'?'<button class="btn2" onclick="delChat('+i+')">Delete</button>':'')+'</div>';}l.innerHTML=h||'No messages';}
function delChat(i){if(role!=='admin')return;var c=chatMsgs[i];if(c._fid)cloudDel('chatMsgs',c._fid);chatMsgs.splice(i,1);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}
function clearChat(){if(confirm('Clear all?')){for(var i=0;i<chatMsgs.length;i++)if(chatMsgs[i]._fid)cloudDel('chatMsgs',chatMsgs[i]._fid);chatMsgs=[];localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}}
function renderAbout(){var el=document.getElementById('aboutView');if(el)el.innerHTML='<div style="white-space:pre-wrap">'+aboutData.text+'</div>'+(aboutData.photo?'<br><img src="'+aboutData.photo+'" style="width:100%">':'');}
function initAboutUpload(){function h(f){if(!f)return;var r=new FileReader();r.onload=function(ev){aboutTmp=ev.target.result;var p=document.getElementById('aboutPrev');if(p){p.src=ev.target.result;}};r.readAsDataURL(f);}var a=document.getElementById('aboutCam');var b=document.getElementById('aboutLib');if(a)a.addEventListener('change',function(e){h(e.target.files[0]);});if(b)b.addEventListener('change',function(e){h(e.target.files[0]);});}
function saveAbout(){var t=document.getElementById('aboutText').value;aboutData.text=t;if(aboutTmp)aboutData.photo=aboutTmp;localStorage.setItem('uh_about',JSON.stringify(aboutData));alert('Saved');renderContent();}
checkFlashes();setInterval(checkFlashes,10000);
function outsideSearch(){var q=(document.getElementById('outsideSearchInput')?.value||'').toLowerCase();var area=document.getElementById('publicViewArea');if(!q){area.innerHTML='Type chassis...';return;}var h='';for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q))h+='<div class="card">📢 Complaint '+complaints[i].chassis+'</div>';}for(var i=0;i<transJobs.length;i++){if((transJobs[i].chassis||'').toLowerCase().includes(q))h+='<div class="card">🚚 Transport '+transJobs[i].chassis+'</div>';}area.innerHTML=h||'No jobs';}
function askNotify(){if(!('Notification' in window)){alert('Not supported');return;}Notification.requestPermission().then(function(p){alert(p);});}
function showNotifyFix(){var box=document.getElementById('cp12Alert');box.style.display='block';box.innerHTML='Go Settings > Apps > Browser > Notifications > Allow';}
function submitPublicInvoice(){var ch=document.getElementById('pubInvChassis').value.trim();var comp=document.getElementById('pubInvCompany').value.trim();var pers=document.getElementById('pubInvPerson').value.trim();var amt=document.getElementById('pubInvAmt').value.trim();var desc=document.getElementById('pubInvDesc').value.trim();if(!ch||!comp||!pers||!amt){alert('Fill all');return;}if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt,desc:desc||'Invoice',company:comp,person:pers,photos:pubInvPhotos.slice(),paid:false,date:new Date().toLocaleString()});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt,desc:desc,company:comp,person:pers,paid:false,date:new Date().toLocaleString()});alert('Submitted £'+amt);pubInvPhotos=[];document.getElementById('pubInvPrevBox').innerHTML='';}
function showMyPublicInvoices(){var name=(document.getElementById('myInvNameSearch')?.value||'').toLowerCase();var area=document.getElementById('myInvListArea');var h='';for(var ch in invoices){for(var i=0;i<invoices[ch].length;i++){var inv=invoices[ch][i];if((inv.person||'').toLowerCase().includes(name)){h+='<div class="card">'+ch+' £'+inv.amt+' '+(inv.paid?'PAID':'UNPAID')+'</div>';}}}area.innerHTML=h||'No invoices';}
</script></body></html>
