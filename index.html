function setCloud(on,msg){const el=document.getElementById('cloudStatus');if(el)el.innerHTML='☁️ '+(on?'ON ✅ '+(msg||'Live'):'OFF '+msg);}
function cloudAdd(c,d){d.createdAt=firebase.firestore.FieldValue.serverTimestamp();d.timeStamp=firebase.firestore.FieldValue.serverTimestamp();db.collection(c).add(d);}
function cloudDeleteById(c,id){if(!id)return;db.collection(c).doc(id).delete();}
function cloudUpdateById(c,id,data){if(!id)return;db.collection(c).doc(id).update(data);}
db.collection('complaints').orderBy('createdAt','desc').onSnapshot(s=>{let a=[];s.forEach(doc=>{let x=doc.data();x._fid=doc.id;a.push(x);});complaints=a;localStorage.setItem('uh_comp',JSON.stringify(a));if(curTab)renderContent();checkFlashes();});
db.collection('transJobs').orderBy('createdAt','desc').onSnapshot(s=>{let a=[];s.forEach(doc=>{let x=doc.data();x._fid=doc.id;a.push(x);});transJobs=a;localStorage.setItem('uh_tjobs',JSON.stringify(a));if(curTab)renderContent();});
db.collection('chatMsgs').orderBy('timeStamp','desc').limit(200).onSnapshot(s=>{let a=[];s.forEach(doc=>{let x=doc.data();x._fid=doc.id;a.push(x);});chatMsgs=a.reverse();localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();});
db.collection('cp12List').onSnapshot(s=>{let a=[];s.forEach(doc=>{let x=doc.data();x._fid=doc.id;a.push(x);});cp12List=a;localStorage.setItem('uh_cp12',JSON.stringify(a));checkFlashes();if(curTab==='cp12')renderContent();});

<script>
var role='';var pw={admin:'admin123',worker:'worker123',transport:'trans123',invoice:'invoice123'};try{pw=JSON.parse(localStorage.getItem('uh_pw')||'{}');}catch(e){}
var complaints=[],transJobs=[],invoices={},workers={},reports=[],refurbs=[],completeJobs=[],cp12List=[],chatMsgs=[],aboutData={text:'UNIQUE HAVEN HOUSE'};
try{complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');invoices=JSON.parse(localStorage.getItem('uh_inv')||'{}');cp12List=JSON.parse(localStorage.getItem('uh_cp12')||'[]');chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');reports=JSON.parse(localStorage.getItem('uh_reports')||'[]');workers=JSON.parse(localStorage.getItem('uh_workers')||'{}');refurbs=JSON.parse(localStorage.getItem('uh_refurbs')||'[]');}catch(e){}
function hideAll(){document.getElementById('outside').style.display='none';document.getElementById('app').style.display='none';document.getElementById('pageAbout').style.display='none';document.getElementById('pagePublicInvoice').style.display='none';}
function backHome(){hideAll();document.getElementById('outside').style.display='block';document.getElementById('publicViewArea').innerHTML='';}
function goAdmin(){var p=prompt('Admin Password:');if(p!==pw.admin){alert('Wrong');return;}role='admin';hideAll();document.getElementById('app').style.display='block';showTabs();}
function goWorker(){var p=prompt('Worker Password:');if(p!==pw.worker){alert('Wrong');return;}var n=prompt('Worker Name:');if(n)localStorage.setItem('uh_curW',n.trim());role='worker';hideAll();document.getElementById('app').style.display='block';showTabs();}
function goTransport(){var p=prompt('Transport Password:');if(p!==pw.transport){alert('Wrong');return;}var n=prompt('Transport Driver Name:');if(n)localStorage.setItem('uh_curT',n.trim());role='transport';hideAll();document.getElementById('app').style.display='block';showTabs();}
function openAbout(){hideAll();document.getElementById('pageAbout').style.display='block';document.getElementById('aboutView').innerHTML=aboutData.text;}
function openPublicActive(){hideAll();document.getElementById('outside').style.display='block';var area=document.getElementById('publicViewArea');var h='<div class="card"><h3>ACTIVE</h3>';for(var i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class="card">📢 '+complaints[i].chassis+'</div>';area.innerHTML=h+'</div>';}
function openPublicTransport(){hideAll();document.getElementById('outside').style.display='block';document.getElementById('publicViewArea').innerHTML='<div class="card">🚚 TRANSPORT '+transJobs.length+'</div>';}

function openPublicChat(){hideAll();document.getElementById('outside').style.display='block';renderPublicChat();}
function openPublicInvoice(){var p=prompt('Invoice Password:');if(p!==pw.invoice){alert('Wrong');return;}hideAll();document.getElementById('outside').style.display='block';document.getElementById('pagePublicInvoice').style.display='block';}
function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase();var area=document.getElementById('publicViewArea');var html='';for(var i=0;i<complaints.length;i++)if((complaints[i].chassis||'').toLowerCase().includes(q))html+='<div class="card">📢 '+complaints[i].chassis+'</div>';area.innerHTML=html||'No jobs';}
function checkFlashes(){var cpAlert=document.getElementById('cp12Alert');var alertBox=document.getElementById('globalAlert');var now=new Date();now.setHours(0,0,0,0);var exp=[];for(var i=0;i<cp12List.length;i++){try{var d=new Date(cp12List[i].cpDate);d.setHours(0,0,0,0);var diff=Math.ceil((d-now)/86400000);if(diff>=0&&diff<=30)exp.push(cp12List[i].chassis+' ('+diff+' days)');if(diff<0)exp.push(cp12List[i].chassis+' EXPIRED');}catch(e){}}if(exp.length>0){cpAlert.style.display='block';cpAlert.innerHTML='⚠️ CP12: '+exp.join(', ')+' <button onclick="this.parentElement.style.display=\'none\'">X</button>';}else cpAlert.style.display='none';}
function showTabs(){var list=[];if(role==='admin')list=['dash','activeJobs','completeJobs','refurb','cp12','invoices','transportJobs','transportDone','transportForm','complaints','publicChatAdmin','workers'];else if(role==='worker')list=['myJobs','addReport','myDays','publicChatAdmin'];else list=['transportJobs','transportDone','publicChatAdmin'];var h='';for(var i=0;i<list.length;i++)h+='<button class="btn2" onclick="openTab(\''+list[i]+'\')">'+list[i].toUpperCase()+'</button>';document.getElementById('tabs').innerHTML=h;openTab(list[0]);}
var curTab='';function openTab(t){curTab=t;renderContent();}
function renderContent(){
var f=document.getElementById('content');
var logoInside='<div class="tabLogoWrap"><svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg"><g stroke="black" stroke-width="10" stroke-linecap="square"><line x1="40" y1="60" x2="170" y2="10"/><line x1="20" y1="100" x2="180" y2="40"/><line x1="230" y1="10" x2="360" y2="60"/><line x1="220" y1="40" x2="380" y2="100"/><line x1="45" y1="140" x2="45" y2="210"/><line x1="355" y1="140" x2="355" y2="210"/></g><rect x="170" y="80" width="60" height="60" fill="black"/><rect x="180" y="90" width="15" height="15" fill="white"/><rect x="205" y="90" width="15" height="15" fill="white"/><rect x="180" y="115" width="15" height="15" fill="white"/><rect x="205" y="115" width="15" height="15" fill="white"/><text x="200" y="170" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="24" fill="black">UNIQUE HAVEN HOUSE</text><text x="200" y="190" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" letter-spacing="3" fill="black">WE BUILD UR DREAM</text><g fill="black"><circle cx="145" cy="230" r="18"/><circle cx="145" cy="230" r="8" fill="white"/><circle cx="200" cy="230" r="18"/><circle cx="200" cy="230" r="8" fill="white"/><circle cx="255" cy="230" r="18"/><circle cx="255" cy="230" r="8" fill="white"/></g></svg></div>';
var html='';
if(curTab==='dash'){html=logoInside+'<div class="card"><h3>Dashboard CLOUD FIXED ✅</h3>Complaints:'+complaints.length+'<br>Transport:'+transJobs.length+'<br>CP12:'+cp12List.length+'</div>';}
if(curTab==='activeJobs'){html=logoInside+'<div class="card"><h3>ACTIVE JOBS CLOUD</h3><div id="activeList"></div></div>';}
if(curTab==='myJobs'){html=logoInside+'<div class="card"><h3>My Jobs<div id="myList"></div></div>';}
if(curTab==='cp12'){html=logoInside+'<div class="card" style="border:2px solid red"><h3>CP12 SYNC FIXED - Delete ALL</h3><input id="cpChassis" placeholder="Chassis"><input id="cpDate" type="date"><button class="btn" onclick="addCp()">+ ADD CLOUD</button></div>';for(var i=0;i<cp12List.length;i++)html+='<div class="card">'+cp12List[i].chassis+' '+cp12List[i].cpDate+' <button class="btn2" onclick="delCp('+i+')">Delete ALL</button></div>';}
if(curTab==='complaints'){html=logoInside+'<div class="card"><h3>Complaint SYNC FIXED</h3><input id="acChassis" placeholder="Chassis *"><input id="acAssign" placeholder="Worker *"><button class="btn" onclick="adminCreateComplaint()">+ CREATE CLOUD ALL</button></div>';for(var i=0;i<complaints.length;i++)html+='<div class="card">'+(complaints[i].completed?'✅':'⏳')+' '+complaints[i].chassis+' Assigned:'+complaints[i].assignedTo+'<br><button class="btn2" onclick="compDone('+i+')">Complete ALL</button> <button class="btn2" onclick="delComp('+i+')">Delete ALL</button></div>';}
if(curTab==='publicChatAdmin'){html=logoInside+'<div class="card"><h3>💬 CHAT SYNC ALL ✅</h3><input id="chatName" value="'+(role==='admin'?'Admin':localStorage.getItem('uh_curW')||'Guest')+'"><textarea id="chatMsg"></textarea><button class="btn" onclick="sendChat()">Send ALL</button> <button class="btn2" onclick="clearChat()">Clear ALL</button><div id="adminChatList"></div></div>';}
if(curTab==='transportJobs'){html=logoInside+'<div class="card"><h3>Transport PENDING SYNC FIXED<div id="tjList"></div></div>';}
if(curTab==='transportDone'){html=logoInside+'<div class="card"><h3>Transport DONE<div id="tjDone"></div></div>';}
if(curTab==='transportForm'){html=logoInside+'<div class="card"><h3>Transport Form</h3><input id="atChassis" placeholder="Chassis"><input id="atAssign" placeholder="Driver"><button class="btn" onclick="submitAdminT()">SUBMIT CLOUD ALL</button></div>';}
if(curTab==='invoices'){html=logoInside+'<div class="card"><h3>Invoices</h3><input id="invChassis" placeholder="Chassis"><input id="invAmt" placeholder="Amt"><button class="btn" onclick="addInv()">+ Add CLOUD</button></div>';for(var ch in invoices)for(var j=0;j<invoices[ch].length;j++)html+='<div class="card">'+ch+' £'+invoices[ch][j].amt+' <button class="btn2" onclick="delInv(\''+ch+'\','+j+')">Del ALL</button></div>';}
if(curTab==='addReport'){html=logoInside+'<div class="card"><h3>Add Report</h3><input id="rChassis" placeholder="Chassis"><textarea id="workDone"></textarea><input id="rDate" type="date"><button class="btn" onclick="submitReport()">Submit</button></div>';}
if(curTab==='myDays'){html=logoInside+'<div class="card">Worker: '+(localStorage.getItem('uh_curW')||'')+' Days:'+(workers[localStorage.getItem('uh_curW')]&&workers[localStorage.getItem('uh_curW')].days?workers[localStorage.getItem('uh_curW')].days.length:0)+'</div>';}
f.innerHTML=html;
if(curTab==='activeJobs'){var list=document.getElementById('activeList');if(list){var h='';for(var i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class="card">📢 '+complaints[i].chassis+'</div>';list.innerHTML=h;}}
if(curTab==='transportJobs'){var list=document.getElementById('tjList');if(list){var h='';for(var i=0;i<transJobs.length;i++)if(!transJobs[i].done)h+='<div class="card">🚚 '+transJobs[i].chassis+' <button class="btn" onclick="markDone('+i+')">Done ALL</button></div>';list.innerHTML=h;}}
if(curTab==='transportDone'){var list=document.getElementById('tjDone');if(list){var h='';for(var i=0;i<transJobs.length;i++)if(transJobs[i].done)h+='<div class="card">✅ '+transJobs[i].chassis+' <button class="btn2" onclick="markDone('+i+')">Undo ALL</button></div>';list.innerHTML=h;}}
if(curTab==='myJobs'){var list=document.getElementById('myList');if(list){var curW=(localStorage.getItem('uh_curW')||'').toLowerCase();var h='';for(var i=0;i<complaints.length;i++)if(!complaints[i].completed&&(complaints[i].assignedTo||'').toLowerCase()===curW)h+='<div class="card">📢 MY JOB '+complaints[i].chassis+'<br><button class="btn-green" onclick="workerCompDone('+i+')">✅ Done ALL PHONES</button></div>';list.innerHTML=h||'No jobs';}}
if(curTab==='publicChatAdmin')renderChatList();
checkFlashes();
}
function addInv(){var ch=document.getElementById('invChassis').value.trim();var amt=document.getElementById('invAmt').value.trim();if(!ch||!amt)return;if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt,chassis:ch,paid:false});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt,paid:false});renderContent();}
function delInv(ch,i){var inv=invoices[ch][i];if(inv._fid)cloudDeleteById('invoices_cloud',inv._fid);invoices[ch].splice(i,1);localStorage.setItem('uh_inv',JSON.stringify(invoices));renderContent();}
function adminCreateComplaint(){var o={chassis:document.getElementById('acChassis').value.trim(),assignedTo:document.getElementById('acAssign').value.trim(),completed:false,date:new Date().toLocaleDateString()};if(!o.chassis||!o.assignedTo){alert('Need chassis+worker');return;}complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudAdd('complaints',o);renderContent();}
function delComp(i){if(confirm('Delete ALL?')){var c=complaints[i];if(c._fid)cloudDeleteById('complaints',c._fid);complaints.splice(i,1);localStorage.setItem('uh_comp',JSON.stringify(complaints));renderContent();}}
function compDone(i){var c=complaints[i];c.completed=true;localStorage.setItem('uh_comp',JSON.stringify(complaints));if(c._fid)cloudUpdateById('complaints',c._fid,{completed:true});renderContent();}
function workerCompDone(idx){if(confirm('Done ALL phones?')){var c=complaints[idx];c.completed=true;if(c._fid)cloudUpdateById('complaints',c._fid,{completed:true});localStorage.setItem('uh_comp',JSON.stringify(complaints));renderContent();}}
function submitAdminT(){var j={chassis:document.getElementById('atChassis').value,assignedTo:document.getElementById('atAssign').value.trim(),done:false};if(!j.chassis||!j.assignedTo)return;transJobs.unshift(j);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudAdd('transJobs',j);renderContent();}
function markDone(i){var j=transJobs[i];j.done=!j.done;localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));if(j._fid)cloudUpdateById('transJobs',j._fid,{done:j.done});if(curTab==='transportJobs')renderContent();else renderContent();}
function addCp(){var o={chassis:document.getElementById('cpChassis').value,cpDate:document.getElementById('cpDate').value};if(!o.chassis||!o.cpDate)return;cp12List.unshift(o);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));cloudAdd('cp12List',o);renderContent();checkFlashes();}
function delCp(i){if(confirm('Delete ALL?')){var c=cp12List[i];if(c._fid)cloudDeleteById('cp12List',c._fid);cp12List.splice(i,1);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));renderContent();checkFlashes();}}
function submitReport(){var name=localStorage.getItem('uh_curW')||'Worker';var ch=document.getElementById('rChassis').value.trim();if(!ch)return;var date=document.getElementById('rDate').value||new Date().toLocaleDateString();var e={name:name,chassis:ch,date:date};reports.unshift(e);localStorage.setItem('uh_reports',JSON.stringify(reports));if(!workers[name])workers[name]={days:[]};if(!workers[name].days.includes(date))workers[name].days.push(date);localStorage.setItem('uh_workers',JSON.stringify(workers));renderContent();}
function renderPublicChat(){var area=document.getElementById('publicViewArea');area.innerHTML='<div class="card"><h3>CHAT CLOUD ALL</h3><input id="chatName" placeholder="Name"><textarea id="chatMsg"></textarea><button class="btn" onclick="sendChat()">Send ALL</button><div id="chatList"></div></div>';renderChatList();}
function sendChat(){var name=document.getElementById('chatName').value.trim()||'Guest';var msg=document.getElementById('chatMsg').value.trim();if(!msg)return;chatMsgs.unshift({name:name,msg:msg,time:new Date().toLocaleString()});localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudAdd('chatMsgs',{name:name,msg:msg,time:new Date().toLocaleString()});document.getElementById('chatMsg').value='';renderChatList();}
function renderChatList(){var list=document.getElementById('chatList')||document.getElementById('adminChatList');if(!list)return;var h='';for(var i=0;i<chatMsgs.length;i++)h+='<div class="card"><b>'+chatMsgs[i].name+'</b> '+chatMsgs[i].msg+' '+(role==='admin'?'<button class="btn2" onclick="delChat('+i+')">Del ALL</button>':'')+'</div>';list.innerHTML=h;}
function delChat(i){if(confirm('Delete ALL?')){var c=chatMsgs[i];if(c._fid)cloudDeleteById('chatMsgs',c._fid);chatMsgs.splice(i,1);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}}
function clearChat(){if(confirm('Clear ALL chat ALL PHONES?')){db.collection('chatMsgs').get().then(s=>s.forEach(d=>d.ref.delete()));chatMsgs=[];localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}}
function askNotify(){Notification.requestPermission().then(p=>alert(p));}
function submitPublicInvoice(){var ch=document.getElementById('pubInvChassis').value.trim();var amt=document.getElementById('pubInvAmt').value.trim();if(!ch||!amt)return;if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt,chassis:ch,paid:false});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt,paid:false});alert('Submitted');}
function showMyPublicInvoices(){var n=document.getElementById('myInvNameSearch').value.toLowerCase();var area=document.getElementById('myInvListArea');var h='';for(var ch in invoices)for(var i=0;i<invoices[ch].length;i++)h+='<div class="card">'+ch+' £'+invoices[ch][i].amt+'</div>';area.innerHTML=h;}
checkFlashes();
</script></body></html>
