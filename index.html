<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#fff8e1;color:#5d4037}
.header{background:linear-gradient(135deg,#8d6e63 0%,#a1887f 50%,#6d4c41 100%);padding:12px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #4e342e;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:58px;height:58px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;border:3px solid #4e342e;flex-shrink:0;overflow:hidden}
.logo-icon::before{content:'';position:absolute;width:30px;height:16px;background:#4e342e;top:9px;left:50%;transform:translateX(-50%);clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.logo-icon::after{content:'';position:absolute;width:28px;height:20px;background:#d7ccc8;top:24px;left:50%;transform:translateX(-50%);border:2px solid #4e342e;border-top:none}
.logo-icon span{position:absolute;top:28px;font-size:6px;font-weight:900;color:#3e2723;line-height:1;text-align:center;width:26px;left:50%;transform:translateX(-50%);z-index:2}
.logo-icon.dot{position:absolute;width:4px;height:4px;background:#3e2723;border-radius:50%;top:33px;z-index:3}
.logo-icon.dot.left{left:16px}.logo-icon.dot.right{right:16px}
.logo-text h1{font-size:15px;font-weight:900;color:#fff;letter-spacing:0.5px;line-height:1.1;text-shadow:1px 1px 2px rgba(0,0,0,0.3)}
.logo-text p{font-size:10px;color:#ffecb3;font-weight:700;letter-spacing:1px;margin-top:2px}
.btn{padding:10px 14px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px;background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff;margin:3px}
.btn2{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;background:#fff;color:#5d4037;border:2px solid #8d6e63;margin:2px}
.btn-green{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;background:#00c851;color:#fff;margin:2px}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1);border:1px solid #d7ccc8}
.folder{background:#fff8e1;border:2px solid #a1887f;border-radius:10px;padding:10px;margin:8px 0}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:800;color:#fff}
.paid{background:#00c851}.unpaid{background:#ff4444}
.totalBox{background:linear-gradient(135deg,#8d6e63,#6d4c41);color:#fff;padding:12px;border-radius:10px;font-weight:900;margin:10px 0;text-align:center;font-size:16px}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:2px solid #a1887f;border-radius:8px;font-size:14px;background:#fff}
textarea{height:80px}
#outside{padding:10px}
.outside-card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 3px 10px rgba(0,0,0,0.12);border:2px solid #d7ccc8}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid4 button{padding:16px 8px;font-size:13px;font-weight:900;border-radius:10px;border:none;cursor:pointer;color:#fff}
.g-green{background:linear-gradient(135deg,#00c851,#007E33)}.g-orange{background:linear-gradient(135deg,#ff9800,#ef6c00)}.g-brown{background:linear-gradient(135deg,#8d6e63,#5d4037)}.g-blue{background:linear-gradient(135deg,#29b6f6,#0277bd)}
.searchBox{display:flex;gap:6px;margin:10px 0}.searchBox input{flex:1}
#app{display:none}
.tabs{background:#efebe9;padding:8px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:3px solid #8d6e63;position:sticky;top:70px;z-index:99}
#content{padding:10px;min-height:70vh}
#successToast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00c851;color:#fff;padding:12px 22px;border-radius:25px;font-weight:800;display:none;z-index:9999}
#cp12Alert{background:#ff4444;color:#fff;padding:10px;border-radius:8px;margin:8px 0;display:none;font-weight:800}
.emergency{border:3px solid red!important;background:#ffebee!important}
</style></head><body>
<div id="outside">
<div class="header"><div class="logo"><div class="logo-icon"><span>UNIQUE<br>HAVEN<br>HOUSE</span><div class="dot left"></div><div class="dot right"></div></div><div class="logo-text"><h1>UNIQUE HAVEN HOUSE</h1><p>WE BUILD UR DREAM</p></div></div></div>

<div style="display:flex;gap:6px"><div style="flex:1"><label>📷 Camera</label><input type="file" id="pubInvCam" accept="image/*" capture="environment" multiple></div><div style="flex:1"><label>🖼️ Library</label><input type="file" id="pubInvLib" accept="image/*" multiple></div></div>
<div id="pubInvPrevBox" style="display:flex;flex-wrap:wrap;gap:4px;min-height:30px;border:2px dashed #8d6e63;padding:6px;background:#fff"></div>
<div id="pubOcrStatus" style="font-size:12px;font-weight:700"></div><div id="pubOcrBreakdown" style="font-size:12px;background:#fff8e1;padding:6px"></div>

</div>

</div></div>

<div id="app">
<div class="header"><div class="logo"><div class="logo-icon"><span>UNIQUE<br>HAVEN<br>HOUSE</span><div class="dot left"></div><div class="dot right"></div></div><div class="logo-text"><h1>UNIQUE HAVEN HOUSE</h1><p id="uInfo">ADMIN</p></div></div><button class="btn2" onclick="backHome()">🏠 HOME</button></div>
<div id="cp12Alert"></div><div class="tabs" id="tabs"></div><div id="content"></div>
<div id="editHomeBox" style="display:none;position:fixed;top:10%;left:5%;right:5%;background:#fff;padding:15px;border-radius:12px;z-index:999;border:3px solid #8d6e63;max-height:80vh;overflow:auto"></div>
</div>
<div id="successToast"></div>
<script>var firebaseConfig={apiKey:"AIzaSyB3u3U09Nq5MZ5n2v5j9Z4Q7k8L1M2N3O4",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
var db=null;try{if(typeof firebase!=='undefined'){firebase.initializeApp(firebaseConfig);db=firebase.firestore();}}catch(e){}
var reports=JSON.parse(localStorage.getItem('uh_reports')||'[]');
var complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');
var transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');
var completeJobs=JSON.parse(localStorage.getItem('uh_complete')||'[]');
var chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');
var workersList=JSON.parse(localStorage.getItem('uh_workers')||'[]');
var cp12List=JSON.parse(localStorage.getItem('uh_cp12')||'[]');
var refurbs=JSON.parse(localStorage.getItem('uh_refurbs')||'[]');
var companyHomes=JSON.parse(localStorage.getItem('uh_companyHomes')||'{}');
var customCompanyTabs=JSON.parse(localStorage.getItem('uh_customTabs')||'[]');
var aboutData=JSON.parse(localStorage.getItem('uh_about')||'{"text":"UNIQUE HAVEN HOUSE\\nWE BUILD UR DREAM","photo":""}');
var pw=JSON.parse(localStorage.getItem('uh_pw')||'{"admin":"admin123","worker":"worker123","transport":"trans123","invoice":"inv123"}');
var role=localStorage.getItem('uh_role')||'';var curTab=localStorage.getItem('uh_curTab')||'dash';
var invoices={};var invTmp=[];var homePhotos=[];var homeVideos=[];var compPhotos=[];var transPhotos=[];var aboutTmp='';var pubInvTmp=[];var ocrItems=[];

function loadInvoicesSafe(){try{var main=localStorage.getItem('uh_invoices');var b1=localStorage.getItem('uh_invoices_b1');var b2=localStorage.getItem('uh_invoices_b2');var b3=localStorage.getItem('uh_inv');var data=null;if(main&&main!=='{}'&&main.length>10){data=JSON.parse(main);}else if(b1&&b1.length>10){data=JSON.parse(b1);localStorage.setItem('uh_invoices',b1);}else if(b2&&b2.length>10){data=JSON.parse(b2);localStorage.setItem('uh_invoices',b2);}else if(b3&&b3.length>10){var tmp=JSON.parse(b3);var grouped={};for(var i=0;i<tmp.length;i++){var it=tmp[i];var ch=it.chassis||'General';if(!grouped[ch])grouped[ch]=[];grouped[ch].push(it);}data=grouped;}if(data&&typeof data==='object'){invoices=data;}}catch(e){invoices={};}}loadInvoicesSafe();
function saveInvoicesSafe(){try{var str=JSON.stringify(invoices);localStorage.setItem('uh_invoices',str);localStorage.setItem('uh_invoices_b1',str);localStorage.setItem('uh_invoices_b2',str);var flat=[];var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var arr=invoices[keys[k]];for(var j=0;j<arr.length;j++)flat.push(arr[j]);}localStorage.setItem('uh_inv',JSON.stringify(flat));if(db){db.collection('invoices_backup').doc('all').set({data:invoices}).catch(()=>{});}}catch(e){}}
function cloudAdd(col,obj){if(!db)return;db.collection(col).add(obj).catch(()=>{});}
function cloudDelete(col,field,val){if(!db)return;db.collection(col).where(field,'==',val).get().then(s=>{s.forEach(d=>d.ref.delete());}).catch(()=>{});}
function showToast(m){var t=document.getElementById('successToast');if(!t)return;t.innerText=m;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}
function calcUnpaid(){var tot=0;for(var k in invoices){for(var i=0;i<invoices[k].length;i++){if(!invoices[k][i].paid)tot+=Number(invoices[k][i].amt)||0;}}return tot.toFixed(2);}
function countInvoicesPhotos(){var inv=0;var tot=0;var unpaid=0;for(var k in invoices){inv+=invoices[k].length;for(var i=0;i<invoices[k].length;i++){var a=Number(invoices[k][i].amt)||0;tot+=a;if(!invoices[k][i].paid)unpaid+=a;}}return{inv:inv,total:tot,unpaid:unpaid};}
function getWorkerDayCount(name){var days={};for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===name.toLowerCase()){var d=reports[i].date||'';if(d)days[d]=true;}}return Object.keys(days).length;}
function getWorkerDaysList(name){var days={};for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===name.toLowerCase()){var d=reports[i].date||'';if(d)days[d]=true;}}return Object.keys(days);}
function checkFlashes(){var now=new Date();var msgs=[];for(var i=0;i<cp12List.length;i++){var c=cp12List[i];if(!c.cpDate&&!c.expiry)continue;var d=new Date(c.cpDate||c.expiry);var diff=Math.ceil((d-now)/(1000*60*60*24));if(diff<=30&&diff>=0)msgs.push(c.chassis+' CP12 '+diff+' days');if(diff<0)msgs.push(c.chassis+' CP12 EXPIRED');}var el=document.getElementById('cp12Alert');if(el){if(msgs.length){el.style.display='block';el.innerHTML='⚠️ '+msgs.join(' | ');}else el.style.display='none';}}
function outsideSearch(){var q=(document.getElementById('outsideSearchInput').value||'').toLowerCase().trim();if(!q)return;var area=document.getElementById('publicViewArea');var html='<div class="card"><h3>Search: '+q+'</h3></div>';var found=false;for(var i=0;i<complaints.length;i++){if((complaints[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">📢 '+complaints[i].chassis+' '+(complaints[i].issue||'')+'</div>';}}for(var i=0;i<transJobs.length;i++){if((transJobs[i].chassis||'').toLowerCase().includes(q)){found=true;html+='<div class="card">🚚 '+transJobs[i].chassis+' Pickup:'+(transJobs[i].pickupAddr||'')+' Delivery:'+(transJobs[i].deliveryAddr||'')+' Tenant:'+(transJobs[i].tenant||'')+'</div>';}}for(var k in invoices){if(k.toLowerCase().includes(q)){found=true;html+='<div class="card">📄 Invoice Folder: '+k+'</div>';}}if(!found)html+='<div class="card">No result</div>';area.innerHTML=html;document.getElementById('outside').style.display='block';}
function goAdmin(){var p=prompt('Admin Password');if(p===pw.admin){role='admin';localStorage.setItem('uh_role','admin');document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function goWorker(){var p=prompt('Worker Password');if(p===pw.worker){var name=prompt('Your Name');if(!name)return;role='worker';localStorage.setItem('uh_role','worker');localStorage.setItem('uh_curW',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function goTransport(){var p=prompt('Transport Password');if(p===pw.transport){var name=prompt('Driver Name');if(!name)return;role='transport';localStorage.setItem('uh_role','transport');localStorage.setItem('uh_curT',name);document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();renderContent();}else alert('Wrong');}
function backHome(){document.getElementById('app').style.display='none';document.getElementById('outside').style.display='block';document.getElementById('pageAbout').style.display='none';document.getElementById('pagePublicInvoice').style.display='none';document.getElementById('publicViewArea').innerHTML='';role='';localStorage.removeItem('uh_role');}
function initTabs(){
  var tabsDiv=document.getElementById('tabs');var html='';
  if(role==='admin'){
    html+='<button class="btn2" onclick="setTab(\'dash\')">DASH</button>';
    html+='<button class="btn2" onclick="setTab(\'reports\')">REPORTS</button>';
    html+='<button class="btn2" onclick="setTab(\'activeJobs\')">ACTIVE</button>';
    html+='<button class="btn2" onclick="setTab(\'completeJobs\')">COMPLETE</button>';
    html+='<button class="btn2" style="background:orange;color:#fff" onclick="setTab(\'transportForm\')">+ TRANSPORT FORM</button>';
    html+='<button class="btn2" onclick="setTab(\'transportJobs\')">TRANSPORT</button>';
    html+='<button class="btn2" onclick="setTab(\'transportDone\')">TRANS DONE</button>';
    html+='<button class="btn2" onclick="setTab(\'refurb\')">REFURB</button>';
    html+='<button class="btn2" onclick="setTab(\'refurbDone\')">REFURB DONE</button>';
    html+='<button class="btn2" onclick="setTab(\'cp12\')">CP12</button>';
    html+='<button class="btn2" onclick="setTab(\'invoices\')">INVOICES</button>';
    html+='<button class="btn2" onclick="setTab(\'companyHomes\')">HOMES</button>';
    html+='<button class="btn2" onclick="setTab(\'complaints\')">COMPLAINTS</button>';
    html+='<button class="btn2" onclick="setTab(\'workers\')">WORKERS</button>';
    html+='<button class="btn2" onclick="setTab(\'publicChatAdmin\')">CHAT</button>';
    html+='<button class="btn2" onclick="setTab(\'aboutEdit\')">ABOUT</button>';
    html+='<button class="btn2" onclick="setTab(\'settings\')">SETTINGS</button>';
  } else if(role==='worker'){
    html+='<button class="btn2" onclick="setTab(\'myJobs\')">MY JOBS</button>';
    html+='<button class="btn2" onclick="setTab(\'addReport\')">ADD REPORT</button>';
    html+='<button class="btn2" onclick="setTab(\'myDays\')">MY DAYS</button>';
  } else if(role==='transport'){
    html+='<button class="btn2" onclick="setTab(\'transportJobs\')">JOBS</button>';
    html+='<button class="btn2" onclick="setTab(\'transportDone\')">DONE</button>';
  }
  tabsDiv.innerHTML=html;
}
function setTab(t){curTab=t;localStorage.setItem('uh_curTab',t);renderContent();}
function openPublicActive(){renderPublicActive();}
function openPublicTransport(){renderPublicTransport();}
function openPublicRefurb(){renderPublicRefurb();}
function openPublicChat(){renderPublicChat();}
function openAbout(){document.getElementById('outside').style.display='none';document.getElementById('pageAbout').style.display='block';renderAbout();}
function openPublicInvoice(){document.getElementById('outside').style.display='none';document.getElementById('pagePublicInvoice').style.display='block';refreshPubInvFolders();}
function refreshPubInvFolders(){var sel=document.getElementById('pubInvFolderSelect');if(!sel)return;var opts='<option value="">-- Select Existing --</option>';var keys=Object.keys(invoices);for(var i=0;i<keys.length;i++){opts+='<option value="'+keys[i]+'">'+keys[i]+' ('+invoices[keys[i]].length+')</option>';}sel.innerHTML=opts;sel.onchange=function(){if(this.value)document.getElementById('pubInvChassis').value=this.value;};}function renderActive(){
  var list=document.getElementById('activeList');if(!list)return;var html='';
  if(complaints.filter(c=>!c.completed).length===0)html+='<div class="card">No active</div>';
  for(var i=0;i<complaints.length;i++){
    var c=complaints[i];if(c.completed)continue;
    var media='';if(c.photos){for(var p=0;p<c.photos.length;p++)media+='<img src="'+c.photos[p]+'" style="width:80px;height:80px;border-radius:8px;margin:2px" onclick="window.open(this.src)">';}
    html+='<div class="card '+(c.emergency?'emergency':'')+'"><b>CHASSIS: '+c.chassis+'</b><br><b>NAME:</b> '+(c.name||'')+'<br><b>PHONE:</b> '+(c.phone||'')+'<br><b>LOCATION:</b> '+(c.location||c.addr||'')+'<br><b>PLOT:</b> '+(c.plot||'')+'<br><b>ADDRESS:</b> '+(c.address||c.addr||'')+'<br><b>ISSUE:</b> '+(c.issue||'')+'<br><b>DATE:</b> '+(c.date||'')+'<br><b>WORKER:</b> '+(c.assignedTo||'')+'<br><b>EMERGENCY:</b> '+(c.emergency?'YES':'NO')+'<br><div style="display:flex;flex-wrap:wrap;background:#fff8e1;padding:6px">'+media+'</div><br><select id="assign_'+i+'"><option value="">Assign Worker</option>'+getWorkerOpts()+'</select> <button class="btn2" onclick="assignW('+i+')">Assign</button> <button class="btn-green" onclick="compDone('+i+')">Done</button></div>';
  }
  list.innerHTML=html;
}
function renderT(){
  var list=document.getElementById('tjList');if(!list)return;var html='';var pending=transJobs.filter(j=>!j.done&&j.status!=='done'&&!j.completed);
  if(pending.length===0)html+='<div class="card">No pending</div>';
  for(var i=0;i<transJobs.length;i++){
    var j=transJobs[i];if(j.done||j.status==='done'||j.completed)continue;
    var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:8px;margin:2px" onclick="window.open(this.src)">';}
    html+='<div class="card" style="border:2px solid orange"><b>🚚 CHASSIS: '+j.chassis+'</b><br><b>PLOT:</b> '+(j.plot||'')+'<br><b>TENANT:</b> '+(j.tenant||j.name||'')+'<br><b>PHONE:</b> '+(j.phone||'')+'<br><b>PICKUP ADDR:</b> '+(j.pickupAddr||'')+'<br><b>PICKUP POSTCODE:</b> '+(j.pickupPostcode||'')+'<br><b>PICKUP DATE:</b> '+(j.pickupDate||'')+'<br><b>DELIVERY ADDR:</b> '+(j.deliveryAddr||'')+'<br><b>DELIVERY POSTCODE:</b> '+(j.deliveryPostcode||'')+'<br><b>DELIVERY DATE:</b> '+(j.deliveryDate||'')+'<br><b>DRIVER:</b> '+(j.assignedTo||j.driver||'')+'<br><b>STATUS:</b> '+(j.status||'pending')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="markDone('+i+')">✅ Done</button> '+(role==='admin'?'<button class="btn2" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';
  }
  list.innerHTML=html;
}
function renderTDone(){
  var list=document.getElementById('tjDone');if(!list)return;var html='';var doneJobs=transJobs.filter(j=>j.done||j.status==='done'||j.completed);
  if(doneJobs.length===0)html+='<div class="card">No done</div>';
  for(var i=0;i<transJobs.length;i++){
