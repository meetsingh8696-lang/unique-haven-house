function compressImageDataUrl(dataUrl,maxW,quality,cb){try{var img=new Image();img.onload=function(){try{var canvas=document.createElement('canvas');var w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);var out=canvas.toDataURL('image/jpeg',quality);cb(out);}catch(e){cb(dataUrl);}};img.onerror=function(){cb(dataUrl);};img.src=dataUrl;}catch(e){cb(dataUrl);}}

function getWorkerDayCount(name){if(!name)return 0;var nl=name.toLowerCase().trim();var days={};var now=new Date();var cm=now.getMonth();var cy=now.getFullYear();for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var dStr=(reports[i].date||'').trim();if(!dStr)continue;var d=new Date(dStr);if(isNaN(d)){var parts=dStr.split('/');if(parts.length===3){d=new Date(parts[2],parts[1]-1,parts[0]);}}if(isNaN(d))continue;if(d.getMonth()===cm&&d.getFullYear()===cy){days[dStr]=true;}}}return Object.keys(days).length;}

function getWorkerDaysList(name){if(!name)return [];var nl=name.toLowerCase().trim();var days={};var now=new Date();var cm=now.getMonth();var cy=now.getFullYear();for(var i=0;i<reports.length;i++){var rn=(reports[i].name||'').toLowerCase().trim();if(rn===nl||rn.includes(nl)||nl.includes(rn)){var dStr=(reports[i].date||'').trim();if(!dStr)continue;var d=new Date(dStr);if(isNaN(d)){var parts=dStr.split('/');if(parts.length===3){d=new Date(parts[2],parts[1]-1,parts[0]);}}if(isNaN(d))continue;if(d.getMonth()===cm&&d.getFullYear()===cy){days[dStr]=true;}}}return Object.keys(days).sort();}

function refreshInvFolders(){var s=document.getElementById('invFolderSelect');var s2=document.getElementById('selCompany');var s3=document.getElementById('pubInvFolderSelect');var allF=Object.keys(invoices);if(s){var o='<option value="">-- Select Folder --</option>';for(var i=0;i<allF.length;i++)o+='<option value="'+allF[i]+'">'+allF[i]+' ('+(invoices[allF[i]]?invoices[allF[i]].length:0)+')</option>';o+='<option value="__new__">+ New Folder</option>';s.innerHTML=o;}if(s2){var o2='<option value="General">General</option>';for(var i=0;i<customCompanyTabs.length;i++)o2+='<option value="'+customCompanyTabs[i]+'">'+customCompanyTabs[i]+'</option>';for(var i=0;i<allF.length;i++){if(!customCompanyTabs.includes(allF[i])&&allF[i]!=='General')o2+='<option value="'+allF[i]+'">'+allF[i]+'</option>';}s2.innerHTML=o2;}if(s3){var o3='<option value="">-- Select Existing --</option>';for(var i=0;i<allF.length;i++)o3+='<option value="'+allF[i]+'">'+allF[i]+' ('+(invoices[allF[i]]?invoices[allF[i]].length:0)+')</option>';s3.innerHTML=o3;}}
function invFolderChange(){var s=document.getElementById('invFolderSelect');var n=document.getElementById('invFolderNew');if(s&&n){if(s.value==='__new__'){n.style.display='block';n.focus();}else{n.style.display='none';if(s.value)n.value=s.value;}}}
function addInvoice(){var sel=document.getElementById('invFolderSelect');var folderInput=document.getElementById('invFolderNew');var folder=folderInput?folderInput.value.trim():'';if(sel&&sel.value&&sel.value!=='__new__')folder=sel.value;if(!folder){alert('Enter folder chassis name');return;}var o={chassis:folder,company:document.getElementById('invCompany').value,amt:document.getElementById('invAmt').value,desc:document.getElementById('invDesc').value,photos:invTmp.slice(),date:new Date().toLocaleDateString(),paid:false,timestamp:Date.now()};if(!o.amt){alert('Amount needed');return;}if(!invoices[folder])invoices[folder]=[];invoices[folder].unshift(o);saveInvoicesSafe();cloudAdd('invoices',o);invTmp=[];var b=document.getElementById('invPrevBox');if(b)b.innerHTML='Preview';showToast('Invoice Added to '+folder);renderInv();}
function renderInv(){var l=document.getElementById('invList');if(!l)return;var q=(document.getElementById('invoiceSearch')&&document.getElementById('invoiceSearch').value||'').toLowerCase();var h='';var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var folder=keys[k];if(q&&!folder.toLowerCase().includes(q))continue;var arr=invoices[folder]||[];var tot=0;for(var a=0;a<arr.length;a++)if(!arr[a].paid)tot+=Number(arr[a].amt)||0;h+='<div class="folder"><b>📁 '+folder+' - Unpaid: £'+tot.toFixed(2)+' ('+arr.length+' invoices)</b><br>';for(var i=0;i<arr.length;i++){var inv=arr[i];var med='';if(inv.photos){for(var p=0;p<inv.photos.length;p++)med+='<img src="'+inv.photos[p]+'" style="width:60px;height:60px;border-radius:8px;margin:2px" onclick="viewPic(this.src)">';}var personStr=inv.person?' Person: <b>'+inv.person+'</b>':'';var publicBadge=inv.public?' <span style="background:#D1AD69;color:#000;padding:2px 6px;border-radius:8px;font-size:10px">PUBLIC</span>':'';h+='<div class="card" style="margin:4px 0"><b>'+(inv.company||'')+'</b>'+publicBadge+' £'+inv.amt+'<br>Company: '+(inv.company||'')+personStr+'<br>'+(inv.desc||'')+'<br>Date:'+(inv.date||'')+' <span class="badge '+(inv.paid?'paid':'unpaid')+'">'+(inv.paid?'PAID':'UNPAID')+'</span><br><div style="display:flex;flex-wrap:wrap">'+med+'</div><button class="btn2" style="font-size:11px" onclick="togglePaid(\''+folder+'\','+i+')">'+(inv.paid?'Mark Unpaid':'Mark Paid')+'</button> <button class="btn2" style="font-size:11px;color:red" onclick="delInv(\''+folder+'\','+i+')">Del</button></div>';}h+='</div>';}l.innerHTML=h||'<div class="card">No invoices</div>';}
function togglePaid(f,i){invoices[f][i].paid=!invoices[f][i].paid;saveInvoicesSafe();renderInv();}
function delInv(f,i){if(confirm('Delete invoice?')){if(!invoices[f]||!invoices[f][i])return;var o=invoices[f][i];markInvDeleted(o,f);var delAmt=o.amt;var delDesc=o.desc;var delTs=o.timestamp;invoices[f].splice(i,1);if(invoices[f].length===0)delete invoices[f];saveInvoicesSafe();if(db)try{db.collection('invoices').where('chassis','==',f).get().then(function(s){s.forEach(function(d){var dd=d.data();if(dd.timestamp===delTs&&String(dd.amt)===String(delAmt))d.ref.delete();else if(!delTs&&(dd.desc||'')===delDesc&&String(dd.amt)===String(delAmt))d.ref.delete();});});}catch(e){}purgeDeletedInvoices();renderInv();}}
function submitPublicInvoice(){var folder=document.getElementById('pubInvChassis').value.trim();var comp=document.getElementById('pubInvCompany').value.trim();var person=document.getElementById('pubInvPerson').value.trim();var amt=document.getElementById('pubInvAmt').value.trim();var desc=document.getElementById('pubInvDesc').value.trim();if(!folder||!comp||!person||!amt||!desc){alert('All fields * required');return;}var o={chassis:folder,company:comp,person:person,amt:amt,desc:desc,photos:pubInvTmp.slice(),date:new Date().toLocaleDateString(),paid:false,public:true,timestamp:Date.now()};if(!invoices[folder])invoices[folder]=[];invoices[folder].unshift(o);saveInvoicesSafe();cloudAdd('invoices',o);pubInvTmp=[];var b=document.getElementById('pubInvPrevBox');if(b)b.innerHTML='';document.getElementById('pubInvChassis').value='';document.getElementById('pubInvAmt').value='';document.getElementById('pubInvDesc').value='';refreshPubInvFolders();showToast('Public Invoice Submitted to '+folder);if(document.getElementById('invList'))renderInv();}
function showMyPublicInvoices(){var name=(document.getElementById('myInvNameSearch').value||'').toLowerCase().trim();if(!name){alert('Enter Your Name');return;}var area=document.getElementById('myInvListArea');var h='';var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var arr=invoices[keys[k]]||[];for(var i=0;i<arr.length;i++){var inv=arr[i];if((inv.person||'').toLowerCase()===name||(inv.person||'').toLowerCase().includes(name)){var med='';if(inv.photos){for(var p=0;p<inv.photos.length;p++)med+='<img src="'+inv.photos[p]+'" style="width:70px;height:70px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}h+='<div class="card"><b>Folder: '+keys[k]+'</b><br>Company:'+(inv.company||'')+'<br>Person:'+(inv.person||'')+'<br>Amount: £'+inv.amt+'<br>Desc: '+(inv.desc||'')+'<br>Date:'+(inv.date||'')+' <span class="badge '+(inv.paid?'paid':'unpaid')+'">'+(inv.paid?'PAID':'UNPAID')+'</span><br><div style="display:flex;flex-wrap:wrap">'+med+'</div><br><button class="btn2" style="background:red;color:#fff;width:100%" onclick="delPublicInvoice(\''+keys[k].replace(/\'/g,"\\'")+'\','+i+')">🗑️ Delete Invoice</button></div>';}}}area.innerHTML=h||'<div class="card">No invoices found for '+name+'</div>';}
function renderMy(){var list=document.getElementById('myList');if(!list)return;var curW=(localStorage.getItem('uh_curW')||'').toLowerCase();var html='';for(var i=0;i<complaints.length;i++){var c=complaints[i];var a=(c.assignedTo||'').toLowerCase();if(!a.includes(curW)&&!curW.includes(a))continue;var m='';if(c.photos){for(var p=0;p<c.photos.length;p++)m+='<img src="'+c.photos[p]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}var emerg=c.emergency?'flash-red':'';html+='<div class="card '+emerg+'" style="border:2px solid '+(c.emergency?'red':'#D1AD69')+'"><b>CHASSIS: '+c.chassis+'</b> '+(c.emergency?'<span class="flash-red" style="padding:2px 8px;border-radius:10px">EMERGENCY</span>':'')+'<br><b>Full Name:</b> '+(c.name||'')+'<br><b>Plot:</b> '+(c.plot||'')+'<br><b>Location:</b> '+(c.location||'')+'<br><b>Full Address:</b> '+(c.address||c.addr||'')+'<br><b>Phone:</b> '+(c.phone||'')+'<br><b>Issue:</b> '+c.issue+'<br><b>Date:</b> '+(c.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+m+'</div><br><button class="btn-green" onclick="workerCompDone('+i+')">Done</button></div>';}list.innerHTML=html||'<div class="card">No jobs</div>';renderCP12FlashWorker();}
function renderMyReports(){var curW=localStorage.getItem('uh_curW')||'';var list=document.getElementById('myReportsList');if(!list)return;var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});var html='<h4>My Reports - '+curMonth+' - Days: '+getWorkerDayCount(curW)+'</h4>';for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===curW.toLowerCase()){var d=new Date(reports[i].date);var cm=new Date().getMonth();var cy=new Date().getFullYear();if(!isNaN(d)&&d.getMonth()===cm&&d.getFullYear()===cy){html+='<div class="card"><b>'+reports[i].chassis+'</b> '+(reports[i].location||'')+'<br>Address:'+(reports[i].addr||'')+'<br>'+reports[i].work+'<br>Date:'+reports[i].date+' <button class="btn2" style="font-size:10px" onclick="editReport('+i+')">Edit</button> <button class="btn2" style="font-size:10px;color:red" onclick="delReport('+i+')">Del</button></div>';}}}list.innerHTML=html;}
function renderMyDays(){var curW=localStorage.getItem('uh_curW')||'';var list=document.getElementById('myDaysList');if(!list)return;var days=getWorkerDaysList(curW);var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});var html='<div class="totalBox">Total Days This Month ('+curMonth+'): '+days.length+'</div>';if(days.length===0)html+='<div class="card">No days this month</div>';else{for(var i=0;i<days.length;i++){html+='<div class="card">📅 Day '+(i+1)+': '+days[i]+'</div>';}}list.innerHTML=html;}
function submitReport(){var curW=localStorage.getItem('uh_curW')||'';var obj={name:curW,chassis:document.getElementById('rChassis').value,type:document.getElementById('rType').value,location:document.getElementById('rLocation').value,addr:document.getElementById('jobAddr').value,hours:document.getElementById('hours').value,work:document.getElementById('workDone').value,date:document.getElementById('rDate').value||new Date().toISOString().split('T')[0],timestamp:Date.now(),phone:getMyPhone()};if(!obj.chassis){alert('Chassis needed');return;}reports.unshift(obj);try{localStorage.setItem('uh_reports',JSON.stringify(reports));}catch(e){}cloudAdd('reports',obj);showNotif('Report Submitted',curW+' '+obj.date);showToast('Report Submitted');renderMyReports();renderMyDays();}
function getWorkerOpts(){var o='';for(var i=0;i<workersList.length;i++){o+='<option value="'+workersList[i]+'">'+workersList[i]+'</option>';}return o;}
function renderT(){var list=document.getElementById('tjList');if(!list)return;var html='';var hasPending=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(j.done)continue;hasPending=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border:2px solid #D1AD69"><b>CHASSIS: '+j.chassis+'</b><br><b>Full Name: '+(j.name||'')+'</b><br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver Name: '+(j.assignedTo||j.driver||'')+'</b><br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="markDone('+i+')">Done</button> <button class="btn2" onclick="editTrans('+i+')">Edit</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasPending)html='<div class="card">No pending transport jobs</div>';list.innerHTML=html;}
function renderTDone(){var list=document.getElementById('tjDone');if(!list)return;var html='';var hasDone=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(!j.done)continue;hasDone=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border-left:5px solid #1E5A35"><b>DONE CHASSIS: '+j.chassis+'</b><br><b>Full Name: '+(j.name||'')+'</b><br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver Name: '+(j.assignedTo||j.driver||'')+'</b><br><b>Completed:</b> '+(j.completedDate||'')+'<br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn2" onclick="markDone('+i+')">Reopen</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasDone)html='<div class="card">No done transport jobs yet</div>';list.innerHTML=html;}
function renderWorkers(){var dash=document.getElementById('workersDash');var list=document.getElementById('allReportsList');var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});if(dash){var h='<div style="background:#171717;padding:8px;border-radius:10px;border:1px solid #D1AD69"><b>'+curMonth+'</b></div>';for(var i=0;i<workersList.length;i++){var w=workersList[i];var cnt=getWorkerDayCount(w);var days=getWorkerDaysList(w);var dayList='';for(var d=0;d<days.length;d++){var repForDay=null;for(var r=0;r<reports.length;r++){if((reports[r].name||'').toLowerCase()===w.toLowerCase()&&reports[r].date===days[d]){repForDay=reports[r];break;}}dayList+='<div style="font-size:11px;padding:2px 0">📅 '+days[d]+(repForDay?' - '+(repForDay.chassis||'')+' '+(repForDay.location||''):'')+'</div>';}h+='<div class="card"><b>Worker Name: '+w+'</b><br>Days: <b style="color:#1E5A35">'+cnt+'</b><br>'+dayList+'<br><button class="btn2" style="color:red" onclick="delWorker('+i+')">Delete Worker</button></div>';}dash.innerHTML=h;}if(list){var hh='';var cm=new Date().getMonth();var cy=new Date().getFullYear();for(var i=0;i<reports.length;i++){var rd=new Date(reports[i].date);if(isNaN(rd))continue;if(rd.getMonth()===cm&&rd.getFullYear()===cy){hh+='<div class="card"><b>Worker Name: '+reports[i].name+'</b> '+reports[i].chassis+'<br>Work:'+reports[i].work+'<br>Location:'+(reports[i].location||'')+'<br>Addr:'+(reports[i].addr||'')+'<br>Date:'+reports[i].date+'<br>Hours:'+(reports[i].hours||'')+'<br>Type:'+(reports[i].type||'')+'<br><button class="btn2" style="font-size:10px" onclick="editReport('+i+')">Edit</button> <button class="btn2" style="font-size:10px;color:red" onclick="delReport('+i+')">Delete</button></div>';}}list.innerHTML=hh||'<div class="card">No reports this month</div>';}}
function addWorker(){var n=document.getElementById('newWorkerName').value.trim();if(!n)return;if(!workersList.includes(n)){workersList.push(n);try{localStorage.setItem('uh_workers',JSON.stringify(workersList));}catch(e){}if(db)try{db.collection('workersList').add({name:n,timestamp:Date.now()});}catch(e){}showToast('Worker Added');renderWorkers();}}
function delWorker(i){if(confirm('Delete worker?')){var delName=workersList[i];workersList.splice(i,1);try{localStorage.setItem('uh_workers',JSON.stringify(workersList));}catch(e){}if(db)try{db.collection('workersList').where('name','==',delName).get().then(function(s){s.forEach(function(d){d.ref.delete();});});}catch(e){}renderWorkers();}}
function editReport(i){var r=reports[i];var nw=prompt('Edit Work:',r.work);if(nw===null)return;r.work=nw;var nd=prompt('Edit Date YYYY-MM-DD:',r.date);if(nd!==null)r.date=nd;try{localStorage.setItem('uh_reports',JSON.stringify(reports));}catch(e){}renderContent();}
function delReport(i){if(confirm('Delete report?')){var delCh=reports[i]?reports[i].chassis:'';var delDate=reports[i]?reports[i].date:'';reports.splice(i,1);try{localStorage.setItem('uh_reports',JSON.stringify(reports));}catch(e){}if(db&&delCh)try{db.collection('reports').where('chassis','==',delCh).where('date','==',delDate).get().then(function(s){s.forEach(function(d){d.ref.delete();});});}catch(e){}renderContent();}}
function refreshCompanySelect(){var s=document.getElementById('selCompany');if(!s)return;var o='<option value="General">General</option>';for(var i=0;i<customCompanyTabs.length;i++)o+='<option value="'+customCompanyTabs[i]+'">'+customCompanyTabs[i]+'</option>';var ks=Object.keys(companyHomes);for(var j=0;j<ks.length;j++){if(!customCompanyTabs.includes(ks[j])&&ks[j]!=='General')o+='<option value="'+ks[j]+'">'+ks[j]+'</option>';}s.innerHTML=o;}
window.addEventListener('load',function(){setTimeout(function(){initPubInvUpload();startLiveSync();registerSW();updateNotifStat();updateUInfo();if(role){document.getElementById('outside').style.display='none';document.getElementById('app').style.display='block';initTabs();showTabsView();renderContent();}},800);});
