function extractSmartTotal(text){if(!text)return 0;var lower=text.toLowerCase();var regex=/£?\s*(\d{1,4}\.\d{2})/g;var matches=[];var m;while((m=regex.exec(text))!==null){var v=parseFloat(m[1]);if(!isNaN(v)&&v>=0.5&&v<=2000)matches.push({v:v,idx:m.index});}if(matches.length===0)return 0;var totalIdx=lower.lastIndexOf('total');if(totalIdx!==-1){for(var i=0;i<matches.length;i++)if(matches[i].idx>=totalIdx)return matches[i].v;}return matches[matches.length-1].v;}
function recalcTotal(){var s=0;for(var i=0;i<ocrAmounts.length;i++)s+=Number(ocrAmounts[i])||0;let el=document.getElementById('pubInvAmt');if(el)el.value=s.toFixed(2);}

function renderPublicInvoiceForm(){let sel=document.getElementById('pubInvFolderSelect');let folders=Object.keys(invoices);let opts='<option value="">-- Select Existing Folder --</option>';for(let i=0;i<folders.length;i++)opts+='<option value="'+folders[i]+'">'+folders[i]+' ('+invoices[folders[i]].length+')</option>';if(sel)sel.innerHTML=opts;pubInvPhotos=[];ocrAmounts=[];let box=document.getElementById('pubInvPrevBox');if(box)box.innerHTML='';document.getElementById('pubOcrStatus').innerHTML='Ready';document.getElementById('pubOcrBreakdown').innerHTML='';initPublicInvoiceUpload();}
function initPublicInvoiceUpload(){function handleFiles(files){if(!files)return;let box=document.getElementById('pubInvPrevBox');ocrAmounts=[];for(let f=0;f<files.length;f++){(function(file,idx){let r=new FileReader();r.onload=function(ev){pubInvPhotos.push(ev.target.result);let img=document.createElement('img');img.src=ev.target.result;img.style.width='60px';img.style.height='60px';img.style.objectFit='cover';box.appendChild(img);try{Tesseract.recognize(ev.target.result,'eng').then(({data:{text}})=>{let v=extractSmartTotal(text);ocrAmounts[idx]=v;let sum=0;for(let j=0;j<ocrAmounts.length;j++)sum+=ocrAmounts[j]||0;document.getElementById('pubInvAmt').value=sum.toFixed(2);let bd='';for(let j=0;j<files.length;j++)if(ocrAmounts[j]!==undefined)bd+='R'+(j+1)+': £<input class="editAmt" value="'+ocrAmounts[j].toFixed(2)+'" oninput="updateAmt('+j+',this.value)"> ';bd+='<br><b>Total £'+sum.toFixed(2)+'</b>';document.getElementById('pubOcrBreakdown').innerHTML=bd;}});}catch(e){}};r.readAsDataURL(file);})(files[f],f);}}let cam=document.getElementById('pubInvCam');let lib=document.getElementById('pubInvLib');if(cam)cam.onchange=e=>{document.getElementById('pubInvPrevBox').innerHTML='';pubInvPhotos=[];handleFiles(e.target.files);};if(lib)lib.onchange=e=>{document.getElementById('pubInvPrevBox').innerHTML='';pubInvPhotos=[];handleFiles(e.target.files);};}function submitPublicInvoice(){var ch=document.getElementById('pubInvChassis').value.trim();var comp=document.getElementById('pubInvCompany').value.trim();var person=document.getElementById('pubInvPerson').value.trim();var amt=document.getElementById('pubInvAmt').value.trim();var desc=document.getElementById('pubInvDesc').value.trim();if(!ch||!comp||!person||!amt){alert('All required');return;}if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt,desc:desc,company:comp,person:person,photos:pubInvPhotos.slice(),paid:false,date:new Date().toLocaleString()});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt,desc:desc,company:comp,person:person,paid:false,date:new Date().toLocaleString()});pubInvPhotos=[];document.getElementById('pubInvPrevBox').innerHTML='';alert('✅ Submitted CLOUD ALL');}
function showMyPublicInvoices(){let name=(document.getElementById('myInvNameSearch').value||'').toLowerCase();let area=document.getElementById('myInvListArea');let h='';for(let ch in invoices){for(let i=0;i<invoices[ch].length;i++){if((invoices[ch][i].person||'').toLowerCase().includes(name)){h+='<div class="card"><b>'+ch+'</b> £'+invoices[ch][i].amt+' '+(invoices[ch][i].paid?'PAID':'UNPAID')+'</div>';}}}area.innerHTML=h||'No invoices';}
