var firebaseConfig={apiKey:"AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.firebasestorage.app",messagingSenderId:"863147801991",appId:"1:863147801991:web:71dad5c6b88bc0367ae722"};
firebase.initializeApp(firebaseConfig);var db=firebase.firestore();
function cloudAdd(c,d){d.createdAt=firebase.firestore.FieldValue.serverTimestamp();d.timeStamp=firebase.firestore.FieldValue.serverTimestamp();db.collection(c).add(d).catch(function(){});}

db.collection("transJobs").orderBy("createdAt","desc").onSnapshot(function(s){var a=[];s.forEach(function(d){var x=d.data();x._fid=d.id;a.push(x);});transJobs=a;localStorage.setItem("uh_tjobs",JSON.stringify(a));if(curTab)render();});

db.collection("cp12List").onSnapshot(function(s){var a=[];s.forEach(function(d){var x=d.data();x._fid=d.id;a.push(x);});cp12List=a;localStorage.setItem("uh_cp12",JSON.stringify(a));});

function hideAll(){document.getElementById("outside").style.display="none";document.getElementById("app").style.display="none";document.getElementById("invoicePage").style.display="none";}

function goAdmin(){var p=prompt("Admin Password:");if(p!==pw.admin){alert("Wrong");return;}role="admin";hideAll();document.getElementById("app").style.display="block";showTabs();}

function searchJob(){var q=document.getElementById("searchInput").value.toLowerCase();var area=document.getElementById("publicArea");var h='';for(var i=0;i<complaints.length;i++)if(complaints[i].chassis.toLowerCase().indexOf(q)>-1)h+='<div class=card>'+complaints[i].chassis+'</div>';area.innerHTML=h||'<div class=card>No jobs</div>';}

var curTab="";function openTab(t){curTab=t;render();}
function render(){var f=document.getElementById("content");var html="";if(curTab==="dash"){var c={inv:0,total:0};for(var k in invoices)for(var i=0;i<invoices[k].length;i++)c.total+=Number(invoices[k][i].amt)||0;html='<div class=card><h3>Dashboard BEIGE 16 TABS ONE LOGO 62KB FINAL FIXED</h3>Reports:'+reports.length+'<br>Transport:'+transJobs.length+'<br>Complaints:'+complaints.length+'<br>CP12:'+cp12List.length+'<br>Total £'+c.total.toFixed(2)+'<br><br>ALL BEIGE #f5f2eb<br>BLACK WRITING<br>ONE LOGO ONLY<br>16 TABS<br>62KB</div>';}
if(curTab==="reports"){html='<div class=card><h3>Reports BEIGE</h3></div>';for(var i=0;i<reports.length;i++)html+='<div class=card>'+reports[i].chassis+'</div>';}
if(curTab==="activeJobs"){html='<div class=card><h3>Active BEIGE<div id=activeList></div></div>';}
if(curTab==="completeJobs"){html='<div class=card><h3>Complete BEIGE</h3></div>';}
if(curTab==="refurb"){html='<div class=card><h3>Refurb BEIGE</h3><input id=rfChassis placeholder=Chassis><button class=btn onclick=addRefurb()>CREATE BEIGE</button></div>';for(var i=0;i<refurbs.length;i++)html+='<div class=card>'+refurbs[i].chassis+' <button class=btn2 onclick=delRefurb('+i+')>Del BEIGE</button></div>';}
if(curTab==="cp12"){html='<div class=card><h3>CP12 BEIGE</h3><input id=cpChassis placeholder=Chassis><input id=cpDate type=date><button class=btn onclick=addCp()>ADD BEIGE</button></div>';for(var i=0;i<cp12List.length;i++)html+='<div class=card>'+cp12List[i].chassis+' <button class=btn2 onclick=delCp('+i+')>Del BEIGE</button></div>';}
if(curTab==="invoices"){html='<div class=card><h3>Invoices BEIGE OCR</h3><input id=invChassis placeholder=Chassis><input id=invAmt placeholder=Amt><button class=btn onclick=addInv()>Add BEIGE</button></div>';for(var ch in invoices)for(var j=0;j<invoices[ch].length;j++)html+='<div class=card>'+ch+' £'+invoices[ch][j].amt+' <button class=btn2 onclick=delInv(\''+ch+'\','+j+')>Del BEIGE</button></div>';}
if(curTab==="transportJobs"){html='<div class=card><h3>Transport PENDING BEIGE<div id=tjList></div></div>';}
if(curTab==="transportDone"){html='<div class=card><h3>Transport DONE BEIGE<div id=tjDone></div></div>';}
if(curTab==="transportForm"){html='<div class=card><h3>Transport Form BEIGE</h3><input id=atChassis placeholder=Chassis><input id=atAssign placeholder=Driver><button class=btn onclick=submitT()>SUBMIT BEIGE</button></div>';}
if(curTab==="complaints"){html='<div class=card><h3>Complaint BEIGE</h3><input id=acChassis placeholder=Chassis><input id=acAssign placeholder=Worker><button class=btn onclick=addComplaint()>CREATE BEIGE</button></div>';for(var i=0;i<complaints.length;i++)html+='<div class=card>'+complaints[i].chassis+' '+complaints[i].assignedTo+'<br><button class=btn2 onclick=doneComp('+i+')>Complete BEIGE</button> <button class=btn2 onclick=delComp('+i+')>Delete BEIGE</button></div>';}
if(curTab==="publicChatAdmin"){html='<div class=card><h3>CHAT BEIGE 16 TABS<div><input id=chatName placeholder=Name><textarea id=chatMsg></textarea><button class=btn onclick=sendChat()>Send BEIGE ALL</button><div id=adminChatList></div></div></div>';}
if(curTab==="workers"){html='<div class=card><h3>Workers BEIGE</h3></div>';for(var k in workers)html+='<div class=card>'+k+'</div>';}
if(curTab==="companyHomes"){html='<div class=card><h3>Company Homes BEIGE FULL</h3><input id=newCompanyTab placeholder=Company><button class=btn onclick=createTab()>Create Tab BEIGE</button></div><div class=card><input id=homeSearch placeholder=Search oninput=renderHomes()><div id=homesList></div></div><div class=card><select id=selCompany>'+getCompOpts()+'</select><input id=hChassis placeholder=Chassis><button class=btn onclick=addHome()>Add Home BEIGE</button></div>';}
if(curTab==="settings"){html='<div class=card><h3>Settings BEIGE 16 TABS</h3>Admin:<input id=setAdmin value='+pw.admin+'><button class=btn onclick=savePw()>Save BEIGE</button></div>';}
if(curTab==="aboutEdit"){html='<div class=card><h3>About Edit BEIGE</h3><textarea id=aboutText>UNIQUE HAVEN HOUSE BEIGE</textarea><button class=btn onclick=saveAbout()>Save BEIGE</button></div>';}
if(curTab==="myJobs"){html='<div class=card><h3>My Jobs BEIGE<div id=myList></div></div>';}
if(curTab==="addReport"){html='<div class=card><h3>Add Report BEIGE</h3><input id=rChassis placeholder=Chassis><textarea id=workDone></textarea><button class=btn onclick=submitReport()>Submit BEIGE</button></div>';}
if(curTab==="myDays"){html='<div class=card>My Days BEIGE</div>';}
f.innerHTML=html;
if(curTab==="activeJobs"){var list=document.getElementById("activeList");if(list){var h="";for(var i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class=card>'+complaints[i].chassis+'</div>';list.innerHTML=h||"No jobs BEIGE";}}
if(curTab==="transportJobs"){var list=document.getElementById("tjList");if(list){var h="";for(var i=0;i<transJobs.length;i++)if(!transJobs[i].done)h+='<div class=card>'+transJobs[i].chassis+' <button class=btn onclick=markDone('+i+')>Done BEIGE</button></div>';list.innerHTML=h||"No jobs BEIGE";}}
if(curTab==="transportDone"){var list=document.getElementById("tjDone");if(list){var h="";for(var i=0;i<transJobs.length;i++)if(transJobs[i].done)h+='<div class=card>'+transJobs[i].chassis+' <button class=btn2 onclick=markDone('+i+')>Undo BEIGE</button></div>';list.innerHTML=h||"No done";}}
if(curTab==="myJobs"){var list=document.getElementById("myList");if(list){var curW=(localStorage.getItem("uh_curW")||"").toLowerCase();var h="";for(var i=0;i<complaints.length;i++)if(!complaints[i].completed&&(complaints[i].assignedTo||"").toLowerCase()===curW)h+='<div class=card>MY JOB BEIGE '+complaints[i].chassis+'<br><button class=btn onclick=workerDone('+i+')>DONE BEIGE</button></div>';list.innerHTML=h||"No jobs BEIGE";}}
if(curTab==="publicChatAdmin")renderChat();

}
function addInv(){var ch=document.getElementById("invChassis").value.trim();var amt=document.getElementById("invAmt").value.trim();if(!ch||!amt)return;if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt});localStorage.setItem("uh_inv",JSON.stringify(invoices));cloudAdd("invoices_cloud",{chassis:ch,amt:amt});render();}
function delInv(ch,i){var inv=invoices[ch][i];if(inv._fid)cloudDel("invoices_cloud",inv._fid);invoices[ch].splice(i,1);localStorage.setItem("uh_inv",JSON.stringify(invoices));render();}
function addComplaint(){var o={chassis:document.getElementById("acChassis").value.trim(),assignedTo:document.getElementById("acAssign").value.trim(),completed:false};if(!o.chassis||!o.assignedTo)return;complaints.unshift(o);localStorage.setItem("uh_comp",JSON.stringify(complaints));cloudAdd("complaints",o);render();}
function delComp(i){var c=complaints[i];if(c._fid)cloudDel("complaints",c._fid);complaints.splice(i,1);localStorage.setItem("uh_comp",JSON.stringify(complaints));render();}
function doneComp(i){var c=complaints[i];c.completed=true;localStorage.setItem("uh_comp",JSON.stringify(complaints));if(c._fid)cloudUpd("complaints",c._fid,{completed:true});render();}
function workerDone(idx){var c=complaints[idx];c.completed=true;if(c._fid)cloudUpd("complaints",c._fid,{completed:true});localStorage.setItem("uh_comp",JSON.stringify(complaints));render();}
function submitT(){var j={chassis:document.getElementById("atChassis").value,assignedTo:document.getElementById("atAssign").value.trim(),done:false};if(!j.chassis||!j.assignedTo)return;transJobs.unshift(j);localStorage.setItem("uh_tjobs",JSON.stringify(transJobs));cloudAdd("transJobs",j);render();}
function markDone(i){var j=transJobs[i];j.done=!j.done;localStorage.setItem("uh_tjobs",JSON.stringify(transJobs));if(j._fid)cloudUpd("transJobs",j._fid,{done:j.done});render();}
function addCp(){var o={chassis:document.getElementById("cpChassis").value,cpDate:document.getElementById("cpDate").value};if(!o.chassis||!o.cpDate)return;cp12List.unshift(o);localStorage.setItem("uh_cp12",JSON.stringify(cp12List));cloudAdd("cp12List",o);render();}
function delCp(i){var c=cp12List[i];if(c._fid)cloudDel("cp12List",c._fid);cp12List.splice(i,1);localStorage.setItem("uh_cp12",JSON.stringify(cp12List));render();}
function submitReport(){var name=localStorage.getItem("uh_curW")||"Worker";var ch=document.getElementById("rChassis").value.trim();if(!ch)return;reports.unshift({name:name,chassis:ch});localStorage.setItem("uh_reports",JSON.stringify(reports));if(!workers[name])workers[name]={days:[]};workers[name].days.push(new Date().toLocaleDateString());localStorage.setItem("uh_workers",JSON.stringify(workers));render();}
function addRefurb(){var ch=document.getElementById("rfChassis").value;if(!ch)return;refurbs.unshift({chassis:ch});localStorage.setItem("uh_refurbs",JSON.stringify(refurbs));render();}
function delRefurb(i){refurbs.splice(i,1);localStorage.setItem("uh_refurbs",JSON.stringify(refurbs));render();}
function savePw(){pw.admin=document.getElementById("setAdmin").value;localStorage.setItem("uh_pw",JSON.stringify(pw));alert("Saved BEIGE");}
function submitInvoice(){var ch=document.getElementById("invChassis").value.trim();var amt=document.getElementById("invAmt").value.trim();if(!ch||!amt)return;if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt});localStorage.setItem("uh_inv",JSON.stringify(invoices));cloudAdd("invoices_cloud",{chassis:ch,amt:amt});alert("Submitted BEIGE CLOUD");}
function sendChat(){var name=document.getElementById("chatName").value.trim()||"Guest";var msg=document.getElementById("chatMsg").value.trim();if(!msg)return;chatMsgs.unshift({name:name,msg:msg});localStorage.setItem("uh_chat",JSON.stringify(chatMsgs));cloudAdd("chatMsgs",{name:name,msg:msg});document.getElementById("chatMsg").value="";renderChat();}
function renderChat(){var list=document.getElementById("chatList")||document.getElementById("adminChatList");if(!list)return;var h="";for(var i=0;i<chatMsgs.length;i++)h+='<div class=card><b>'+chatMsgs[i].name+'</b> '+chatMsgs[i].msg+' <button class="btn2" onclick="delChat('+i+')">Del BEIGE</button></div>';list.innerHTML=h||"No messages BEIGE";}
function delChat(i){var c=chatMsgs[i];if(c._fid)cloudDel("chatMsgs",c._fid);chatMsgs.splice(i,1);localStorage.setItem("uh_chat",JSON.stringify(chatMsgs));renderChat();}
function createTab(){var n=document.getElementById("newCompanyTab").value.trim();if(!n)return;if(!customTabs.includes(n)){customTabs.push(n);companyHomes[n]=[];localStorage.setItem("uh_customTabs",JSON.stringify(customTabs));localStorage.setItem("uh_companyHomes",JSON.stringify(companyHomes));render();}}
function getCompOpts(){var o="";for(var i=0;i<customTabs.length;i++)o+='<option value="'+customTabs[i]+'">'+customTabs[i]+'</option>';if(!o)o='<option value="General">General</option>';return o;}
function addHome(){var comp=document.getElementById("selCompany").value||"General";var obj={chassis:document.getElementById("hChassis").value.trim()};if(!obj.chassis)return;if(!companyHomes[comp])companyHomes[comp]=[];companyHomes[comp].unshift(obj);if(!customTabs.includes(comp))customTabs.push(comp);localStorage.setItem("uh_companyHomes",JSON.stringify(companyHomes));localStorage.setItem("uh_customTabs",JSON.stringify(customTabs));renderHomes();}
function renderHomes(){var list=document.getElementById("homesList");if(!list)return;var h="";for(var c in companyHomes){h+='<div style=font-weight:900>COMPANY BEIGE: '+c+'</div>';for(var i=0;i<companyHomes[c].length;i++)h+='<div class=card>'+companyHomes[c][i].chassis+' <button class="btn2" onclick="delHome(\''+c+'\','+i+')">Del BEIGE</button></div>';}list.innerHTML=h||"No homes BEIGE";}
function delHome(c,i){companyHomes[c].splice(i,1);localStorage.setItem("uh_companyHomes",JSON.stringify(companyHomes));renderHomes();}
function saveAbout(){localStorage.setItem("uh_about","BEIGE");alert("Saved BEIGE");}
</script><script>
(function(){
var cam=document.getElementById("cam");var lib=document.getElementById("lib");
function handle(files){for(var f=0;f<files.length;f++){(function(file){var r=new FileReader();r.onload=function(ev){pubPhotos.push(ev.target.result);var img=document.createElement("img");img.src=ev.target.result;img.style.width="60px";img.style.height="60px";img.style.border="2px solid #000";document.getElementById("prevBox").appendChild(img);try{Tesseract.recognize(ev.target.result,"eng").then(function(o){var txt=o.data.text;var m=txt.match(/\d+\.\d{2}/);if(m){var v=parseFloat(m[0]);if(!isNaN(v))document.getElementById("invAmt").value=v.toFixed(2);}});}catch(e){}};r.readAsDataURL(file);})(files[f]);}}
if(cam)cam.onchange=function(e){document.getElementById("prevBox").innerHTML="";pubPhotos=[];handle(e.target.files);};
if(lib)lib.onchange=function(e){document.getElementById("prevBox").innerHTML="";pubPhotos=[];handle(e.target.files);};
})();
</script></body></html>
