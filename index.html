function renderChatList(){
var roleNow=localStorage.getItem('uh_role')||'';
var curRaw=''; if(roleNow==='admin'){curRaw='Admin';}else{curRaw=localStorage.getItem('uh_curW')||localStorage.getItem('uh_curT')||'Admin';}
var curN=curRaw.toLowerCase().trim();
var box=document.getElementById('adminChatList'); if(!box)return;
var q=(document.getElementById('chatSearchInput')&&document.getElementById('chatSearchInput').value||'').toLowerCase();
var h='<div style="background:#e5ddd5;padding:10px;border-radius:14px;min-height:300px">';
var hasMsg=false;
for(var i=0;i<chatMsgs.length;i++){
var cm=chatMsgs[i]; var from=(cm.name||'').toLowerCase().trim(); var toRaw=(cm.to||'').toLowerCase().trim();
var isGroup=toRaw===''||toRaw==='all'; var show=false;
if(isGroup){show=true;}else{
var parts=toRaw.split(',').map(function(x){return x.trim().toLowerCase();}).filter(function(x){return x;});
if(curN==='admin'){if(from==='admin'||parts.indexOf('admin')!==-1)show=true;}else{if(from===curN||parts.indexOf(curN)!==-1)show=true;}
}
if(!show)continue;
if(q&&!((cm.msg||'').toLowerCase().includes(q)||from.includes(q)))continue;
hasMsg=true; var isMine=from===curN;
var align=isMine?'margin-left:auto;background:#dcf8c6;border-radius:14px 14px 0 14px':'margin-right:auto;background:#fff;border-radius:14px 14px 14px 0';
var badge=isGroup?'GROUP':(isMine?'To '+(cm.to||''):'From '+cm.name);
h+='<div style="max-width:75%;'+align+';padding:8px 12px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,0.2)"><div style="font-size:10px;color:#128c7e;font-weight:bold">'+badge+'</div><div style="font-size:14px;color:#111b21;white-space:pre-wrap">'+(cm.msg||'')+'</div>'+(cm.photo?'<img src="'+cm.photo+'" style="width:100%;max-height:250px;border-radius:10px;margin-top:6px" onclick="viewPic(this.src)">':'')+(cm.voice?'<audio src="'+cm.voice+'" controls style="width:100%;margin-top:6px"></audio>':'')+(cm.video?'<video src="'+cm.video+'" style="width:100%;max-height:250px;border-radius:10px;margin-top:6px" controls></video>':'')+'<div style="text-align:right"><small style="color:#667781;font-size:10px">'+(cm.time||'')+'</small> <span style="cursor:pointer;font-size:11px;margin-left:6px" onclick="replyChat(\''+cm.name.replace(/\'/g,'')+'\')">&#8617;</span> <span style="cursor:pointer;color:#f00;margin-left:4px" onclick="delChat('+i+')">&#10006;</span></div></div>';
}
if(!hasMsg){h+='<div style="background:#fff;padding:10px;border-radius:10px;text-align:center;color:#777">No messages</div>';}
h+='</div>'; box.innerHTML=h; box.scrollTop=box.scrollHeight;
}
function replyChat(n){var s=document.getElementById('chatToSelect');if(s){s.value=n;var inp=document.getElementById('chatToInput');if(inp)inp.value=n;showToast('Reply to '+n);}}
function delChat(i){if(confirm('Delete message?')){chatMsgs.splice(i,1);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}}
function sendPublicChat(){
var name=document.getElementById('chatName').value.trim();
var sel=document.getElementById('chatToSelect'); var to=sel?sel.value.trim():'';
var toInput=document.getElementById('chatToInput'); if(toInput&&toInput.value.trim())to=toInput.value.trim();
var msg=document.getElementById('chatMsg').value.trim();
var prev=document.getElementById('chatMediaPrev');
var chatPhoto=(prev&&prev.dataset&&prev.dataset.photo)||'';
var chatVoice=(prev&&prev.dataset&&prev.dataset.voice)||'';
var chatVideo=(prev&&prev.dataset&&prev.dataset.video)||'';
if(!name){alert('Name needed');return;}
if(!msg&&!chatPhoto&&!chatVoice&&!chatVideo){alert('Message needed');return;}
var obj={name:name,to:to,msg:msg,photo:chatPhoto,voice:chatVoice,video:chatVideo,date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString(),timestamp:Date.now()};
chatMsgs.push(obj); localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));
if(db){ try{db.collection('chatMsgs').add(obj);}catch(e){}
try{
if(to&&to.toLowerCase()!=='all'&&to!==''){
var toLow=to.toLowerCase();
db.collection('fcmTokens').doc(toLow).get().then(function(doc){if(doc.exists){var tk=doc.data().token;if(tk){fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tk,title:'New Message from '+name,body:msg||'Media'})}).catch(function(){});}}});
}else{
db.collection('fcmTokens').get().then(function(snap){snap.forEach(function(d){if(d.id!==name.toLowerCase()){var tk=d.data().token;if(tk){fetch('https://us-central1-unique-haven-house.cloudfunctions.net/sendPush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tk,title:'Group from '+name,body:msg||'Group'})}).catch(function(){});}}});});
}
}catch(e){}
}
document.getElementById('chatMsg').value='';
if(prev){prev.innerHTML='';prev.dataset.photo='';prev.dataset.voice='';prev.dataset.video='';}
renderChatList();
}
function clearChat(){if(confirm('Clear all chats?')){chatMsgs=[];localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}}
function initChatMedia(){var p=document.getElementById('chatPhoto');var vo=document.getElementById('chatVoice');var vi=document.getElementById('chatVideo');var prev=document.getElementById('chatMediaPrev');function handle(f,type){for(var i=0;i<f.length;i++){(function(file){var r=new FileReader();r.onload=function(ev){if(!prev)return;if(type==='photo'){prev.dataset.photo=ev.target.result;prev.innerHTML+='<img src="'+ev.target.result+'" style="width:70px;height:70px;border-radius:10px;margin:3px">';}if(type==='voice'){prev.dataset.voice=ev.target.result;prev.innerHTML+='<audio src="'+ev.target.result+'" controls style="width:100%"></audio>';}if(type==='video'){prev.dataset.video=ev.target.result;prev.innerHTML+='<video src="'+ev.target.result+'" style="width:70px;height:70px;border-radius:10px;margin:3px" controls></video>';}};r.readAsDataURL(file);})(f[i]);}}if(p)p.addEventListener('change',function(e){handle(e.target.files,'photo');});if(vo)vo.addEventListener('change',function(e){handle(e.target.files,'voice');});if(vi)vi.addEventListener('change',function(e){handle(e.target.files,'video');});}

function renderHomes(){

    }else{

        }

      }

    }

  }

function renderCP12(){var l=document.getElementById('cpList');if(!l)return;var h='';var today=new Date();for(var i=0;i<cp12List.length;i++){var cp=cp12List[i];var expiryStr=cp.expiry||'';var diffDays=999;var is30=false;var isExpired=false;try{if(expiryStr){var expDate=new Date(expiryStr);if(!isNaN(expDate)){diffDays=Math.ceil((expDate-today)/(1000*60*60*24));if(diffDays<=30) is30=true; if(diffDays<0) isExpired=true;}}}catch(e){}var flashClass=(is30||isExpired)?'flash-red':'';var badge=isExpired?'<span class="flash-red" style="padding:3px 8px;border-radius:10px">EXPIRED '+diffDays+' days</span>':is30?'<span class="flash-red" style="padding:3px 8px;border-radius:10px">DUE IN '+diffDays+' DAYS</span>':'<span class="mat-ok">OK - '+diffDays+' days</span>';h+='<div class="card '+flashClass+'" style="border:2px solid '+(is30||isExpired?'red':'#8b5a2b')+'"><b>'+cp.chassis+'</b> '+badge+'<br>Addr: '+(cp.addr||'')+'<br>Tenant: '+(cp.tenant||'')+'<br>Date:'+(cp.date||'')+' Expiry:'+(cp.expiry||'')+'<br><b>Remaining: '+diffDays+' days</b><br><button class="btn2" onclick="editCP12('+i+')">Edit</button> <button class="btn2" style="color:red" onclick="delCP12('+i+')">Delete</button></div>';}l.innerHTML=h||'<div class="card">No CP12</div>';renderCP12FlashWorker();}
function renderCP12FlashWorker(){var wFlash=document.getElementById('workerCP12Flash');var today=new Date();var h='';var hasFlash=false;for(var i=0;i<cp12List.length;i++){var cp=cp12List[i];var expiryStr=cp.expiry||'';var diffDays=999;var is30=false;var isExpired=false;try{if(expiryStr){var expDate=new Date(expiryStr);if(!isNaN(expDate)){diffDays=Math.ceil((expDate-today)/(1000*60*60*24));if(diffDays<=30) is30=true; if(diffDays<0) isExpired=true;}}}catch(e){}if(is30||isExpired){hasFlash=true;h+='<div class="card flash-red" style="border:2px solid red"><b>'+cp.chassis+'</b> '+(isExpired?'EXPIRED '+diffDays+' days':'DUE IN '+diffDays+' DAYS')+'<br>Addr:'+(cp.addr||'')+'</div>';}}if(wFlash)wFlash.innerHTML=h||'<div class="card">No CP12 due</div>';}

function addInvoice(){var sel=document.getElementById('invFolderSelect');var folderInput=document.getElementById('invFolderNew');var folder=folderInput?folderInput.value.trim():'';if(sel&&sel.value&&sel.value!=='__new__')folder=sel.value;if(!folder){alert('Enter folder chassis name');return;}var o={chassis:folder,company:document.getElementById('invCompany').value,amt:document.getElementById('invAmt').value,desc:document.getElementById('invDesc').value,photos:invTmp.slice(),date:new Date().toLocaleDateString(),paid:false,timestamp:Date.now()};if(!o.amt){alert('Amount needed');return;}if(!invoices[folder])invoices[folder]=[];invoices[folder].unshift(o);saveInvoicesSafe();cloudAdd('invoices',o);invTmp=[];var b=document.getElementById('invPrevBox');if(b)b.innerHTML='Preview';showToast('Invoice Added to '+folder);renderInv();}
function renderInv(){var l=document.getElementById('invList');if(!l)return;var q=(document.getElementById('invoiceSearch')&&document.getElementById('invoiceSearch').value||'').toLowerCase();var h='';var keys=Object.keys(invoices);for(var k=0;k<keys.length;k++){var folder=keys[k];if(q&&!folder.toLowerCase().includes(q))continue;var arr=invoices[folder]||[];var tot=0;for(var a=0;a<arr.length;a++)if(!arr[a].paid)tot+=Number(arr[a].amt)||0;h+='<div class="folder"><b>📁 '+folder+' - Unpaid: £'+tot.toFixed(2)+' ('+arr.length+' invoices)</b><br>';for(var i=0;i<arr.length;i++){var inv=arr[i];var med='';if(inv.photos){for(var p=0;p<inv.photos.length;p++)med+='<img src="'+inv.photos[p]+'" style="width:60px;height:60px;border-radius:8px;margin:2px" onclick="viewPic(this.src)">';}h+='<div class="card" style="margin:4px 0"><b>'+(inv.company||'')+'</b> £'+inv.amt+'<br>'+(inv.desc||'')+'<br>Date:'+(inv.date||'')+' <span class="badge '+(inv.paid?'paid':'unpaid')+'">'+(inv.paid?'PAID':'UNPAID')+'</span><br><div style="display:flex;flex-wrap:wrap">'+med+'</div><button class="btn2" style="font-size:11px" onclick="togglePaid(\''+folder+'\','+i+')">'+(inv.paid?'Mark Unpaid':'Mark Paid')+'</button> <button class="btn2" style="font-size:11px;color:red" onclick="delInv(\''+folder+'\','+i+')">Del</button></div>';}h+='</div>';}l.innerHTML=h||'<div class="card">No invoices</div>';}

function renderMy(){var list=document.getElementById('myList');if(!list)return;var curW=(localStorage.getItem('uh_curW')||'').toLowerCase();var html='';for(var i=0;i<complaints.length;i++){var c=complaints[i];var a=(c.assignedTo||'').toLowerCase();if(!a.includes(curW)&&!curW.includes(a))continue;var m='';if(c.photos){for(var p=0;p<c.photos.length;p++)m+='<img src="'+c.photos[p]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}var emerg=c.emergency?'flash-red':'';html+='<div class="card '+emerg+'" style="border:2px solid '+(c.emergency?'red':'#8b5a2b')+'"><b>CHASSIS: '+c.chassis+'</b> '+(c.emergency?'<span class="flash-red" style="padding:2px 8px;border-radius:10px">EMERGENCY</span>':'')+'<br><b>Full Name:</b> '+(c.name||'')+'<br><b>Plot:</b> '+(c.plot||'')+'<br><b>Location:</b> '+(c.location||'')+'<br><b>Full Address:</b> '+(c.address||c.addr||'')+'<br><b>Phone:</b> '+(c.phone||'')+'<br><b>Issue:</b> '+c.issue+'<br><b>Date:</b> '+(c.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+m+'</div><br><button class="btn-green" onclick="workerCompDone('+i+')">Done</button></div>';}list.innerHTML=html||'<div class="card">No jobs</div>';renderCP12FlashWorker();}
function renderMyReports(){var curW=localStorage.getItem('uh_curW')||'';var list=document.getElementById('myReportsList');if(!list)return;var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});var html='<h4>My Reports - '+curMonth+' - Days: '+getWorkerDayCount(curW)+'</h4>';for(var i=0;i<reports.length;i++){if((reports[i].name||'').toLowerCase()===curW.toLowerCase()){var d=new Date(reports[i].date);var cm=new Date().getMonth();var cy=new Date().getFullYear();if(!isNaN(d)&&d.getMonth()===cm&&d.getFullYear()===cy){html+='<div class="card"><b>'+reports[i].chassis+'</b> '+(reports[i].location||'')+'<br>Address:'+(reports[i].addr||'')+'<br>'+reports[i].work+'<br>Date:'+reports[i].date+' <button class="btn2" style="font-size:10px" onclick="editReport('+i+')">Edit</button> <button class="btn2" style="font-size:10px;color:red" onclick="delReport('+i+')">Del</button></div>';}}}list.innerHTML=html;}
function renderMyDays(){var curW=localStorage.getItem('uh_curW')||'';var list=document.getElementById('myDaysList');if(!list)return;var days=getWorkerDaysList(curW);var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});var html='<div class="totalBox">Total Days This Month ('+curMonth+'): '+days.length+'</div>';if(days.length===0)html+='<div class="card">No days this month</div>';else{for(var i=0;i<days.length;i++){html+='<div class="card">📅 Day '+(i+1)+': '+days[i]+'</div>';}}list.innerHTML=html;}
function submitReport(){var curW=localStorage.getItem('uh_curW')||'';var obj={name:curW,chassis:document.getElementById('rChassis').value,type:document.getElementById('rType').value,location:document.getElementById('rLocation').value,addr:document.getElementById('jobAddr').value,hours:document.getElementById('hours').value,work:document.getElementById('workDone').value,date:document.getElementById('rDate').value||new Date().toISOString().split('T')[0],timestamp:Date.now()};if(!obj.chassis){alert('Chassis needed');return;}reports.unshift(obj);localStorage.setItem('uh_reports',JSON.stringify(reports));cloudAdd('reports',obj);showNotif('Report Submitted',curW+' '+obj.date);showToast('Report Submitted');renderMyReports();renderMyDays();}
function getWorkerOpts(){var o='';for(var i=0;i<workersList.length;i++){o+='<option value="'+workersList[i]+'">'+workersList[i]+'</option>';}return o;}
function renderT(){var list=document.getElementById('tjList');if(!list)return;var html='';var hasPending=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(j.done)continue;hasPending=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border:2px solid #ff9800"><b>CHASSIS: '+j.chassis+'</b><br><b>Full Name: '+(j.name||'')+'</b><br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver Name: '+(j.assignedTo||j.driver||'')+'</b><br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn-green" onclick="markDone('+i+')">Done</button> <button class="btn2" onclick="editTrans('+i+')">Edit</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasPending)html='<div class="card">No pending transport jobs</div>';list.innerHTML=html;}
function renderTDone(){var list=document.getElementById('tjDone');if(!list)return;var html='';var hasDone=false;for(var i=0;i<transJobs.length;i++){var j=transJobs[i];if(!j.done)continue;hasDone=true;var media='';if(j.photos){for(var pp=0;pp<j.photos.length;pp++)media+='<img src="'+j.photos[pp]+'" style="width:80px;height:80px;border-radius:10px;margin:3px" onclick="viewPic(this.src)">';}html+='<div class="card" style="border-left:5px solid #00c853"><b>DONE CHASSIS: '+j.chassis+'</b><br><b>Full Name: '+(j.name||'')+'</b><br><b>Plot:</b> '+(j.plot||'')+'<br><b>Tenant:</b> '+(j.tenant||'')+'<br><b>Phone:</b> '+(j.phone||'')+'<br><b>Pickup:</b> '+(j.pickupAddr||'')+' '+(j.pickupPostcode||'')+' '+(j.pickupDate||'')+'<br><b>Delivery:</b> '+(j.deliveryAddr||'')+' '+(j.deliveryPostcode||'')+' '+(j.deliveryDate||'')+'<br><b>Driver Name: '+(j.assignedTo||j.driver||'')+'</b><br><b>Completed:</b> '+(j.completedDate||'')+'<br><b>Date:</b> '+(j.date||'')+'<br><div style="display:flex;flex-wrap:wrap">'+media+'</div><br><button class="btn2" onclick="markDone('+i+')">Reopen</button> '+(role==='admin'?'<button class="btn2" style="color:red" onclick="delTrans('+i+')">Delete</button>':'')+'</div>';}if(!hasDone)html='<div class="card">No done transport jobs yet</div>';list.innerHTML=html;}
function renderWorkers(){var dash=document.getElementById('workersDash');var list=document.getElementById('allReportsList');var curMonth=new Date().toLocaleString('default',{month:'long',year:'numeric'});if(dash){var h='<div style="background:#fff8e1;padding:8px;border-radius:10px"><b>'+curMonth+'</b></div>';for(var i=0;i<workersList.length;i++){var w=workersList[i];var cnt=getWorkerDayCount(w);var days=getWorkerDaysList(w);var dayList='';for(var d=0;d<days.length;d++){var repForDay=null;for(var r=0;r<reports.length;r++){if((reports[r].name||'').toLowerCase()===w.toLowerCase()&&reports[r].date===days[d]){repForDay=reports[r];break;}}dayList+='<div style="font-size:11px;padding:2px 0">📅 '+days[d]+(repForDay?' - '+(repForDay.chassis||'')+' '+(repForDay.location||''):'')+'</div>';}h+='<div class="card"><b>Worker Name: '+w+'</b><br>Days: <b style="color:#00c851">'+cnt+'</b><br>'+dayList+'<br><button class="btn2" style="color:red" onclick="delWorker('+i+')">Delete Worker</button></div>';}dash.innerHTML=h;}if(list){var hh='';var cm=new Date().getMonth();var cy=new Date().getFullYear();for(var i=0;i<reports.length;i++){var rd=new Date(reports[i].date);if(isNaN(rd))continue;if(rd.getMonth()===cm&&rd.getFullYear()===cy){hh+='<div class="card"><b>Worker Name: '+reports[i].name+'</b> '+reports[i].chassis+'<br>Work:'+reports[i].work+'<br>Location:'+(reports[i].location||'')+'<br>Addr:'+(reports[i].addr||'')+'<br>Date:'+reports[i].date+'<br>Hours:'+(reports[i].hours||'')+'<br>Type:'+(reports[i].type||'')+'<br><button class="btn2" style="font-size:10px" onclick="editReport('+i+')">Edit</button> <button class="btn2" style="font-size:10px;color:red" onclick="delReport('+i+')">Delete</button></div>';}}list.innerHTML=hh||'<div class="card">No reports this month</div>';}}
function addWorker(){var n=document.getElementById('newWorkerName').value.trim();if(!n)return;if(!workersList.includes(n)){workersList.push(n);localStorage.setItem('uh_workers',JSON.stringify(workersList));if(db)try{db.collection('workersList').add({name:n,timestamp:Date.now()});}catch(e){}showToast('Worker Added');renderWorkers();}}
function delWorker(i){if(confirm('Delete worker?')){var delName=workersList[i];workersList.splice(i,1);localStorage.setItem('uh_workers',JSON.stringify(workersList));if(db)try{db.collection('workersList').where('name','==',delName).get().then(function(s){s.forEach(function(d){d.ref.delete();});});}catch(e){}renderWorkers();}}
function editReport(i){var r=reports[i];var nw=prompt('Edit Work:',r.work);if(nw===null)return;r.work=nw;var nd=prompt('Edit Date YYYY-MM-DD:',r.date);if(nd!==null)r.date=nd;localStorage.setItem('uh_reports',JSON.stringify(reports));renderContent();}
function delReport(i){if(confirm('Delete report?')){var delCh=reports[i]?reports[i].chassis:'';var delDate=reports[i]?reports[i].date:'';reports.splice(i,1);localStorage.setItem('uh_reports',JSON.stringify(reports));if(db&&delCh)try{db.collection('reports').where('chassis','==',delCh).where('date','==',delDate).get().then(function(s){s.forEach(function(d){d.ref.delete();});});}catch(e){}renderContent();}}
