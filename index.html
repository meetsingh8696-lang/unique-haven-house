<script>
const firebaseConfig={apiKey:"AIzaSyC8pET9aGyiCLEQB0SlAyW0uxeeD_bN5Zc",authDomain:"unique-haven-house.firebaseapp.com",projectId:"unique-haven-house",storageBucket:"unique-haven-house.firebasestorage.app",messagingSenderId:"863147801991",appId:"1:863147801991:web:71dad5c6b88bc0367ae722"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function cloudAdd(c,d){d.createdAt=firebase.firestore.FieldValue.serverTimestamp();d.timeStamp=firebase.firestore.FieldValue.serverTimestamp();db.collection(c).add(d).catch(()=>{});}
function cloudDeleteById(c,id){if(!id)return;db.collection(c).doc(id).delete().catch(()=>{});}
function cloudUpdateById(c,id,data){if(!id)return;db.collection(c).doc(id).update(data).catch(()=>{});}
</script>
<script>
var role='';var pw={admin:'admin123',worker:'worker123',transport:'trans123',invoice:'invoice123'};
try{var s=localStorage.getItem('uh_pw');if(s)pw=JSON.parse(s);}catch(e){}
var complaints=[],transJobs=[],invoices={},workers={},reports=[],refurbs=[],completeJobs=[],cp12List=[],companyHomes={},customCompanyTabs=[],chatMsgs=[],aboutData={text:'UNIQUE HAVEN HOUSE'};
try{
complaints=JSON.parse(localStorage.getItem('uh_comp')||'[]');
transJobs=JSON.parse(localStorage.getItem('uh_tjobs')||'[]');
invoices=JSON.parse(localStorage.getItem('uh_inv')||'{}');
workers=JSON.parse(localStorage.getItem('uh_workers')||'{}');
reports=JSON.parse(localStorage.getItem('uh_reports')||'[]');
refurbs=JSON.parse(localStorage.getItem('uh_refurbs')||'[]');
completeJobs=JSON.parse(localStorage.getItem('uh_complete')||'[]');
cp12List=JSON.parse(localStorage.getItem('uh_cp12')||'[]');
companyHomes=JSON.parse(localStorage.getItem('uh_companyHomes')||'{}');
customCompanyTabs=JSON.parse(localStorage.getItem('uh_customTabs')||'[]');
chatMsgs=JSON.parse(localStorage.getItem('uh_chat')||'[]');
}catch(e){}
var pubInvPhotos=[],ocrAmounts=[],invPhotos=[];

db.collection('complaints').orderBy('createdAt','desc').onSnapshot(s=>{
let a=[];s.forEach(d=>{let x=d.data();x._fid=d.id;a.push(x);});
complaints=a;localStorage.setItem('uh_comp',JSON.stringify(a));if(curTab)renderContent();checkFlashes();
});
db.collection('transJobs').orderBy('createdAt','desc').onSnapshot(s=>{
let a=[];s.forEach(d=>{let x=d.data();x._fid=d.id;a.push(x);});
transJobs=a;localStorage.setItem('uh_tjobs',JSON.stringify(a));if(curTab)renderContent();
});
db.collection('chatMsgs').orderBy('timeStamp','desc').limit(200).onSnapshot(s=>{
let a=[];s.forEach(d=>{let x=d.data();x._fid=d.id;a.push(x);});
chatMsgs=a.reverse();localStorage.setItem('uh_chat',JSON.stringify(a));renderChatList();
});
db.collection('cp12List').onSnapshot(s=>{
let a=[];s.forEach(d=>{let x=d.data();x._fid=d.id;a.push(x);});
cp12List=a;localStorage.setItem('uh_cp12',JSON.stringify(a));checkFlashes();
});
db.collection('invoices_cloud').onSnapshot(s=>{
let obj={};s.forEach(d=>{let inv=d.data();inv._fid=d.id;let ch=inv.chassis;if(!obj[ch])obj[ch]=[];obj[ch].push(inv);});
invoices=obj;localStorage.setItem('uh_inv',JSON.stringify(obj));
});

function hideAll(){document.getElementById('outside').style.display='none';document.getElementById('app').style.display='none';document.getElementById('pageAbout').style.display='none';document.getElementById('pagePublicInvoice').style.display='none';}
function backHome(){hideAll();document.getElementById('outside').style.display='block';document.getElementById('publicViewArea').innerHTML='';}
function goAdmin(){var p=prompt('Admin Password:');if(p!==pw.admin){alert('Wrong');return;}role='admin';hideAll();document.getElementById('app').style.display='block';showTabs();}
function goWorker(){var p=prompt('Worker Password:');if(p!==pw.worker){alert('Wrong');return;}var n=prompt('Worker Name:');if(n)localStorage.setItem('uh_curW',n.trim());role='worker';hideAll();document.getElementById('app').style.display='block';showTabs();}
function goTransport(){var p=prompt('Transport Password:');if(p!==pw.transport){alert('Wrong');return;}var n=prompt('Driver Name:');if(n)localStorage.setItem('uh_curT',n.trim());role='transport';hideAll();document.getElementById('app').style.display='block';showTabs();}
function openAbout(){hideAll();document.getElementById('pageAbout').style.display='block';}
function openPublicActive(){hideAll();document.getElementById('outside').style.display='block';let area=document.getElementById('publicViewArea');let h='<div class=card><h3>ACTIVE</h3>';for(let i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class=card>📢 '+complaints[i].chassis+'</div>';area.innerHTML=h+'</div>';}
function openPublicTransport(){hideAll();document.getElementById('outside').style.display='block';document.getElementById('publicViewArea').innerHTML='<div class=card>🚚 '+transJobs.length+' jobs</div>';}
function openPublicRefurb(){hideAll();document.getElementById('outside').style.display='block';document.getElementById('publicViewArea').innerHTML='<div class=card>🏠 '+refurbs.length+' refurb</div>';}
function openPublicChat(){hideAll();document.getElementById('outside').style.display='block';document.getElementById('publicViewArea').innerHTML='<div class=card><h3>CHAT</h3><input id=chatName placeholder=Name><textarea id=chatMsg></textarea><button class=btn2 onclick=sendChat()>Send ALL</button><div id=chatList></div></div>';renderChatList();}
function openPublicInvoice(){var p=prompt('Invoice Password:');if(p!==pw.invoice){alert('Wrong');return;}hideAll();document.getElementById('pagePublicInvoice').style.display='block';renderPublicForm();}
function renderPublicForm(){let sel=document.getElementById('pubInvFolderSelect');let opts='<option value=>--Folder--</option>';for(let k in invoices)opts+='<option value='+k+'>'+k+'</option>';if(sel)sel.innerHTML=opts;pubInvPhotos=[];ocrAmounts=[];document.getElementById('pubInvPrevBox').innerHTML='';document.getElementById('pubOcrStatus').innerHTML='Ready';document.getElementById('pubOcrBreakdown').innerHTML='';initPubUpload();}
function initPubUpload(){function handle(files){let box=document.getElementById('pubInvPrevBox');ocrAmounts=[];for(let f=0;f<files.length;f++){(function(file,idx){let r=new FileReader();r.onload=function(ev){pubInvPhotos.push(ev.target.result);let img=document.createElement('img');img.src=ev.target.result;img.style.width='60px';img.style.height='60px';img.style.objectFit='cover';box.appendChild(img);try{Tesseract.recognize(ev.target.result,'eng').then(o=>{let v=0;try{let txt=o.data.text;let m=txt.match(/£?\s*(\d+\.\d{2})/g);if(m){let last=m[m.length-1];v=parseFloat(last.replace(/[^0-9.]/g,''));} }catch(e){} ocrAmounts[idx]=v;let sum=0;for(let j=0;j<ocrAmounts.length;j++)sum+=ocrAmounts[j]||0;document.getElementById('pubInvAmt').value=sum.toFixed(2);});}catch(e){}};r.readAsDataURL(file);})(files[f],f);}}let cam=document.getElementById('pubInvCam');let lib=document.getElementById('pubInvLib');if(cam)cam.onchange=e=>{document.getElementById('pubInvPrevBox').innerHTML='';pubInvPhotos=[];handle(e.target.files);};if(lib)lib.onchange=e=>{document.getElementById('pubInvPrevBox').innerHTML='';pubInvPhotos=[];handle(e.target.files);};}
function submitPublicInvoice(){var ch=document.getElementById('pubInvChassis').value.trim();var comp=document.getElementById('pubInvCompany').value.trim();var person=document.getElementById('pubInvPerson').value.trim();var amt=document.getElementById('pubInvAmt').value.trim();var desc=document.getElementById('pubInvDesc').value.trim();if(!ch||!amt){alert('Need chassis+amt');return;}if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt,desc:desc,company:comp,person:person,paid:false});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt,desc:desc,company:comp,person:person,paid:false});alert('✅ Submitted CLOUD');}
function showMyPublicInvoices(){let name=(document.getElementById('myInvNameSearch').value||'').toLowerCase();let area=document.getElementById('myInvListArea');let h='';for(let ch in invoices){for(let i=0;i<invoices[ch].length;i++){if((invoices[ch][i].person||'').toLowerCase().includes(name))h+='<div class=card><b>'+ch+'</b> £'+invoices[ch][i].amt+'</div>';}}area.innerHTML=h||'No invoices';}
function outsideSearch(){let q=(document.getElementById('outsideSearchInput').value||'').toLowerCase();let area=document.getElementById('publicViewArea');let h='';for(let i=0;i<complaints.length;i++)if((complaints[i].chassis||'').toLowerCase().includes(q))h+='<div class=card>📢 '+complaints[i].chassis+'</div>';area.innerHTML=h||'No jobs';}
function checkFlashes(){let cpAlert=document.getElementById('cp12Alert');let now=new Date();now.setHours(0,0,0,0);let exp=[];for(let i=0;i<cp12List.length;i++){try{let d=new Date(cp12List[i].cpDate);d.setHours(0,0,0,0);let diff=Math.ceil((d-now)/86400000);if(diff>=0&&diff<=30)exp.push(cp12List[i].chassis+' ('+diff+'d)');if(diff<0)exp.push(cp12List[i].chassis+' EXPIRED');}catch(e){}}if(exp.length>0){cpAlert.style.display='block';cpAlert.innerHTML='⚠️ CP12: '+exp.join(', ')+' <button onclick=this.parentElement.style.display=\'none\'>X</button>';}else cpAlert.style.display='none';}
function showTabs(){let list=[];if(role==='admin')list=['dash','reports','activeJobs','completeJobs','refurb','cp12','invoices','transportJobs','transportDone','transportForm','complaints','publicChatAdmin','workers','companyHomes','settings'];else if(role==='worker')list=['myJobs','addReport','myDays','publicChatAdmin'];else list=['transportJobs','transportDone','publicChatAdmin'];let h='';for(let i=0;i<list.length;i++)h+='<button class=btn2 onclick=openTab(\''+list[i]+'\')>'+list[i].toUpperCase()+'</button>';document.getElementById('tabs').innerHTML=h;openTab(list[0]);}
var curTab='';function openTab(t){curTab=t;renderContent();}
function renderContent(){
let f=document.getElementById('content');
let html='';
if(curTab==='dash'){html='<div class=card><h3>Dashboard ✅ ONE LOGO ONLY</h3>Complaints:'+complaints.length+'<br>Transport:'+transJobs.length+'<br>CP12:'+cp12List.length+'</div>';}
if(curTab==='reports'){html='<div class=card><h3>Reports</h3></div>';for(let i=0;i<reports.length;i++)html+='<div class=card>👷 '+reports[i].name+' '+reports[i].chassis+'</div>';}
if(curTab==='myJobs'){html='<div class=card><h3>My Jobs<div id=myList></div></div>';}
if(curTab==='activeJobs'){html='<div class=card><h3>ACTIVE JOBS CLOUD<div id=activeList></div></div>';}
if(curTab==='completeJobs'){html='<div class=card><h3>COMPLETE</h3></div>';for(let i=0;i<completeJobs.length;i++)html+='<div class=card>✅ '+completeJobs[i].chassis+'</div>';}
if(curTab==='refurb'){html='<div class=card><h3>Refurb</h3><input id=rfChassis placeholder=Chassis><button class=btn onclick=addRefurb()>+ CREATE</button></div>';for(let i=0;i<refurbs.length;i++)html+='<div class=card>🏠 '+refurbs[i].chassis+' <button class=btn2 onclick=delRefurb('+i+')>Del</button></div>';}
if(curTab==='cp12'){html='<div class=card style=border:3px solid red><h3>CP12 SYNC ALL</h3><input id=cpChassis placeholder=Chassis><input id=cpDate type=date><button class=btn onclick=addCp()>+ ADD CLOUD</button></div>';for(let i=0;i<cp12List.length;i++)html+='<div class=card>'+cp12List[i].chassis+' '+cp12List[i].cpDate+' <button class=btn2 onclick=delCp('+i+')>Delete ALL</button></div>';}
if(curTab==='invoices'){html='<div class=card><h3>Invoices CLOUD</h3><input id=invChassis placeholder=Chassis><input id=invAmt placeholder=Amt><button class=btn onclick=addInv()>+ Add</button></div>';for(let ch in invoices)for(let j=0;j<invoices[ch].length;j++)html+='<div class=card>'+ch+' £'+invoices[ch][j].amt+' <button class=btn2 onclick=delInv(\''+ch+'\','+j+')>Del ALL</button></div>';}
if(curTab==='transportJobs'){html='<div class=card><h3>Transport PENDING - SYNC ALL<div id=tjList></div></div>';}
if(curTab==='transportDone'){html='<div class=card><h3>Transport DONE<div id=tjDone></div></div>';}
if(curTab==='transportForm'){html='<div class=card><h3>Transport Form CLOUD ALL</h3><input id=atChassis placeholder=Chassis><input id=atAssign placeholder=Driver><button class=btn onclick=submitAdminT()>SUBMIT ALL</button></div>';}
if(curTab==='complaints'){html='<div class=card><h3>Complaint SYNC ALL</h3><input id=acChassis placeholder=Chassis *><input id=acAssign placeholder=Worker *><button class=btn onclick=adminCreateComplaint()>+ CREATE ALL</button></div>';for(let i=0;i<complaints.length;i++)html+='<div class=card>'+(complaints[i].completed?'✅':'⏳')+' '+complaints[i].chassis+' Assigned:'+complaints[i].assignedTo+'<br><button class=btn2 onclick=compDone('+i+')>Complete ALL</button> <button class=btn2 onclick=delComp('+i+')>Delete ALL</button></div>';}
if(curTab==='publicChatAdmin'){html='<div class=card><h3>💬 CHAT SYNC ALL ✅</h3><input id=chatName placeholder=Name value='+(role==='admin'?'Admin':localStorage.getItem('uh_curW')||'Guest')+'><textarea id=chatMsg></textarea><button class=btn onclick=sendChat()>Send ALL</button> <button class=btn2 onclick=clearChat()>Clear ALL</button><div id=adminChatList></div></div>';}
if(curTab==='workers'){html='<div class=card><h3>Workers</h3></div>';for(let k in workers)html+='<div class=card>👷 '+k+'</div>';}
if(curTab==='companyHomes'){html='<div class=card><h3>Company Homes</h3><input id=newCompanyTab placeholder=New Company><button class=btn onclick=createTab()>+ Create</button></div><div id=homesList></div>';}
if(curTab==='settings'){html='<div class=card><h3>Settings</h3><input id=setAdmin value='+pw.admin+'><button class=btn onclick=savePw()>Save</button></div>';}
if(curTab==='addReport'){html='<div class=card><h3>Add Report</h3><input id=rChassis placeholder=Chassis><textarea id=workDone></textarea><input id=rDate type=date><button class=btn onclick=submitReport()>Submit</button></div>';}
if(curTab==='myDays'){html='<div class=card>Worker: '+(localStorage.getItem('uh_curW')||'')+'</div>';}
f.innerHTML=html;
if(curTab==='activeJobs'){let list=document.getElementById('activeList');if(list){let h='';for(let i=0;i<complaints.length;i++)if(!complaints[i].completed)h+='<div class=card>📢 '+complaints[i].chassis+'</div>';list.innerHTML=h;}}
if(curTab==='transportJobs'){let list=document.getElementById('tjList');if(list){let h='';for(let i=0;i<transJobs.length;i++)if(!transJobs[i].done)h+='<div class=card>🚚 '+transJobs[i].chassis+' <button class=btn onclick=markDone('+i+')>Done ALL</button></div>';list.innerHTML=h;}}
if(curTab==='transportDone'){let list=document.getElementById('tjDone');if(list){let h='';for(let i=0;i<transJobs.length;i++)if(transJobs[i].done)h+='<div class=card>✅ '+transJobs[i].chassis+' <button class=btn2 onclick=markDone('+i+')>Undo ALL</button></div>';list.innerHTML=h;}}
if(curTab==='myJobs'){let list=document.getElementById('myList');if(list){let curW=(localStorage.getItem('uh_curW')||'').toLowerCase();let h='';for(let i=0;i<complaints.length;i++)if(!complaints[i].completed&&(complaints[i].assignedTo||'').toLowerCase()===curW)h+='<div class=card>📢 MY JOB '+complaints[i].chassis+'<br><button class=btn onclick=workerCompDone('+i+')>✅ Done ALL</button></div>';list.innerHTML=h||'No jobs';}}
if(curTab==='publicChatAdmin')renderChatList();
if(curTab==='companyHomes')renderHomes();
checkFlashes();
}
function addInv(){let ch=document.getElementById('invChassis').value.trim();let amt=document.getElementById('invAmt').value.trim();if(!ch||!amt)return;if(!invoices[ch])invoices[ch]=[];invoices[ch].push({amt:amt});localStorage.setItem('uh_inv',JSON.stringify(invoices));cloudAdd('invoices_cloud',{chassis:ch,amt:amt});renderContent();}
function delInv(ch,i){let inv=invoices[ch][i];if(inv._fid)cloudDeleteById('invoices_cloud',inv._fid);invoices[ch].splice(i,1);localStorage.setItem('uh_inv',JSON.stringify(invoices));renderContent();}
function adminCreateComplaint(){let o={chassis:document.getElementById('acChassis').value.trim(),assignedTo:document.getElementById('acAssign').value.trim(),completed:false};if(!o.chassis||!o.assignedTo)return;complaints.unshift(o);localStorage.setItem('uh_comp',JSON.stringify(complaints));cloudAdd('complaints',o);renderContent();}
function delComp(i){let c=complaints[i];if(c._fid)cloudDeleteById('complaints',c._fid);complaints.splice(i,1);localStorage.setItem('uh_comp',JSON.stringify(complaints));renderContent();}
function compDone(i){let c=complaints[i];c.completed=true;localStorage.setItem('uh_comp',JSON.stringify(complaints));if(c._fid)cloudUpdateById('complaints',c._fid,{completed:true});renderContent();}
function workerCompDone(idx){let c=complaints[idx];c.completed=true;if(c._fid)cloudUpdateById('complaints',c._fid,{completed:true});localStorage.setItem('uh_comp',JSON.stringify(complaints));renderContent();}
function submitAdminT(){let j={chassis:document.getElementById('atChassis').value,assignedTo:document.getElementById('atAssign').value.trim(),done:false};if(!j.chassis||!j.assignedTo)return;transJobs.unshift(j);localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));cloudAdd('transJobs',j);renderContent();}
function markDone(i){let j=transJobs[i];j.done=!j.done;localStorage.setItem('uh_tjobs',JSON.stringify(transJobs));if(j._fid)cloudUpdateById('transJobs',j._fid,{done:j.done});renderContent();}
function addCp(){let o={chassis:document.getElementById('cpChassis').value,cpDate:document.getElementById('cpDate').value};if(!o.chassis||!o.cpDate)return;cp12List.unshift(o);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));cloudAdd('cp12List',o);renderContent();checkFlashes();}
function delCp(i){let c=cp12List[i];if(c._fid)cloudDeleteById('cp12List',c._fid);cp12List.splice(i,1);localStorage.setItem('uh_cp12',JSON.stringify(cp12List));renderContent();checkFlashes();}
function submitReport(){let name=localStorage.getItem('uh_curW')||'Worker';let ch=document.getElementById('rChassis').value.trim();if(!ch)return;let e={name:name,chassis:ch,date:new Date().toLocaleDateString()};reports.unshift(e);localStorage.setItem('uh_reports',JSON.stringify(reports));if(!workers[name])workers[name]={days:[]};workers[name].days.push(e.date);localStorage.setItem('uh_workers',JSON.stringify(workers));renderContent();}
function addRefurb(){let ch=document.getElementById('rfChassis').value;if(!ch)return;refurbs.unshift({chassis:ch});localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));renderContent();}
function delRefurb(i){refurbs.splice(i,1);localStorage.setItem('uh_refurbs',JSON.stringify(refurbs));renderContent();}
function savePw(){pw.admin=document.getElementById('setAdmin').value;localStorage.setItem('uh_pw',JSON.stringify(pw));alert('Saved');}
function createTab(){let n=document.getElementById('newCompanyTab').value.trim();if(!n)return;if(!customCompanyTabs.includes(n)){customCompanyTabs.push(n);companyHomes[n]=[];localStorage.setItem('uh_customTabs',JSON.stringify(customCompanyTabs));localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));renderHomes();}}
function addHome(){let comp=document.getElementById('selCompany').value||'General';let obj={chassis:document.getElementById('hChassis').value};if(!obj.chassis)return;if(!companyHomes[comp])companyHomes[comp]=[];companyHomes[comp].unshift(obj);localStorage.setItem('uh_companyHomes',JSON.stringify(companyHomes));renderHomes();}
function renderHomes(){let list=document.getElementById('homesList');if(!list)return;let h='';for(let c in companyHomes){h+='<div class=card><b>'+c+'</b> ('+companyHomes[c].length+')</div>';for(let i=0;i<companyHomes[c].length;i++)h+='<div class=card>'+companyHomes[c][i].chassis+'</div>';}list.innerHTML=h;}
function sendChat(){let name=document.getElementById('chatName').value.trim()||'Guest';let msg=document.getElementById('chatMsg').value.trim();if(!msg)return;chatMsgs.unshift({name:name,msg:msg});localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));cloudAdd('chatMsgs',{name:name,msg:msg});document.getElementById('chatMsg').value='';renderChatList();}
function renderChatList(){let list=document.getElementById('chatList')||document.getElementById('adminChatList');if(!list)return;let h='';for(let i=0;i<chatMsgs.length;i++)h+='<div class=card><b>'+chatMsgs[i].name+'</b> '+chatMsgs[i].msg+' <button class=btn2 onclick=delChat('+i+')>Del ALL</button></div>';list.innerHTML=h;}
function delChat(i){let c=chatMsgs[i];if(c._fid)cloudDeleteById('chatMsgs',c._fid);chatMsgs.splice(i,1);localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}
function clearChat(){if(confirm('Clear ALL?')){db.collection('chatMsgs').get().then(s=>s.forEach(d=>d.ref.delete()));chatMsgs=[];localStorage.setItem('uh_chat',JSON.stringify(chatMsgs));renderChatList();}}
checkFlashes();
</script></body></html>
